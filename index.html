<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0a0e17;--sf:#111827;--sf2:#1a2236;--bd:#2a3456;--ac:#22d3ee;--ac2:#a78bfa;--ok:#34d399;--no:#f87171;--tx:#e2e8f0;--td:#64748b;--tb:#f8fafc}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(34,211,238,.06),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(167,139,250,.06),transparent 50%);pointer-events:none;z-index:0}.ct{max-width:820px;margin:0 auto;padding:24px 20px;position:relative;z-index:1}.hd{text-align:center;padding:48px 0 32px}.hd h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:900;letter-spacing:-.03em;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}.hd p{color:var(--td);font-size:.95rem;font-weight:300}.mn{font-family:'JetBrains Mono',monospace}.tg{display:grid;grid-template-columns:1fr;gap:12px;margin:24px 0}@media(min-width:600px){.tg{grid-template-columns:1fr 1fr}}.tc{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}.tc::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--ac);opacity:0;transition:opacity .25s}.tc:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 8px 32px rgba(34,211,238,.08)}.tc:hover::before,.tc.sl::before{opacity:1}.tc.sl{border-color:var(--ac);background:rgba(34,211,238,.05)}.tc h3{font-size:.95rem;font-weight:700;color:var(--tb);margin-bottom:4px}.tc>span{font-size:.8rem;color:var(--td);font-weight:300}.tn{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--ac);font-weight:700;margin-bottom:6px;display:block}.bt{font-family:'Outfit',sans-serif;font-weight:700;font-size:.95rem;border:none;border-radius:10px;padding:14px 32px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}.bp{background:linear-gradient(135deg,var(--ac),#06b6d4);color:var(--bg);box-shadow:0 4px 20px rgba(34,211,238,.25)}.bp:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(34,211,238,.35)}.bp:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}.bs{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}.bs:hover{border-color:var(--ac);color:var(--ac)}.bg_{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--bd)}.qp{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--td)}.qt{font-size:.8rem;color:var(--ac);font-weight:500}.pb{width:100%;height:4px;background:var(--sf2);border-radius:4px;margin-bottom:32px;overflow:hidden}.pf{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:4px;transition:width .4s}.qc{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:32px;margin-bottom:20px;animation:fu .4s}@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.qc h2{font-size:1.05rem;font-weight:700;color:var(--tb);line-height:1.6;margin-bottom:24px}.qc code{font-family:'JetBrains Mono',monospace;background:var(--sf2);padding:2px 8px;border-radius:4px;font-size:.85rem;color:var(--ac)}.os{display:flex;flex-direction:column;gap:10px}.op{background:var(--sf2);border:1.5px solid var(--bd);border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:.93rem;line-height:1.5;display:flex;align-items:flex-start;gap:12px}.op:hover:not(.ds){border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.04)}.ol{font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:700;color:var(--td);background:var(--bg);width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}.op.ok{border-color:var(--ok);background:rgba(52,211,153,.08)}.op.ok .ol{color:var(--bg);background:var(--ok)}.op.no{border-color:var(--no);background:rgba(248,113,113,.08)}.op.no .ol{color:var(--bg);background:var(--no)}.op.ds{cursor:default}.op.dm{opacity:.45}.ex{margin-top:20px;padding:16px 20px;background:rgba(34,211,238,.04);border:1px solid rgba(34,211,238,.15);border-radius:10px;font-size:.88rem;line-height:1.65;animation:fu .3s}.ex strong{color:var(--ac)}.rs{text-align:center;animation:fu .5s}.sr{width:180px;height:180px;margin:32px auto;position:relative}.sr svg{width:100%;height:100%;transform:rotate(-90deg)}.sr circle{fill:none;stroke-width:8}.sr .bg2{stroke:var(--sf2)}.sr .fg{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset 1.5s}.st{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}.st .nm{font-size:2.8rem;font-weight:900;color:var(--tb);line-height:1}.st .lb{font-size:.75rem;color:var(--td);margin-top:4px;font-weight:500}.rs h2{font-size:1.5rem;font-weight:900;color:var(--tb);margin-bottom:8px}.gd{font-size:1rem;font-weight:700;padding:6px 16px;border-radius:8px;display:inline-block;margin:12px 0 24px}.gd.a{background:rgba(52,211,153,.12);color:var(--ok)}.gd.b{background:rgba(34,211,238,.12);color:var(--ac)}.gd.c{background:rgba(250,204,21,.12);color:#facc15}.gd.f{background:rgba(248,113,113,.12);color:var(--no)}.tb_{text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:24px;margin:24px 0}.tb_ h3{font-size:.85rem;font-weight:700;color:var(--td);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px}.br{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.br:last-child{border:none}.br span:first-child{font-size:.88rem}.br span:last-child{font-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:700}.cl{display:flex;justify-content:space-between;align-items:center;margin:16px 0 4px;flex-wrap:wrap;gap:8px}.sa{font-size:.82rem;color:var(--ac);cursor:pointer;font-weight:500;background:none;border:none;font-family:'Outfit',sans-serif}.sa:hover{text-decoration:underline}.qn{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--td)}.ms-tag{display:inline-block;font-size:.7rem;font-weight:700;color:var(--ac2);background:rgba(167,139,250,.12);padding:3px 10px;border-radius:6px;margin-left:8px;vertical-align:middle}.sc-tag{display:inline-block;font-size:.7rem;font-weight:700;color:#f472b6;background:rgba(236,72,153,.12);padding:3px 10px;border-radius:6px;margin-left:6px;vertical-align:middle}.th-tag{display:inline-block;font-size:.7rem;font-weight:700;color:#38bdf8;background:rgba(56,189,248,.12);padding:3px 10px;border-radius:6px;margin-left:6px;vertical-align:middle}
.op.sel{border-color:var(--ac2);background:rgba(167,139,250,.08)}.op.sel .ol{color:var(--bg);background:var(--ac2)}
.cb{width:16px;height:16px;border:2px solid var(--bd);border-radius:4px;flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:10px;color:transparent}
.op.sel .cb{border-color:var(--ac2);background:var(--ac2);color:var(--bg)}
.op.ok .cb{border-color:var(--ok);background:var(--ok);color:var(--bg)}
.op.no .cb{border-color:var(--no);background:var(--no);color:var(--bg)}
.op.dm .cb{opacity:.45}
.sub-btn{font-family:'Outfit',sans-serif;font-weight:700;font-size:.9rem;border:none;border-radius:8px;padding:10px 24px;cursor:pointer;background:var(--ac2);color:var(--bg);margin-top:16px;transition:all .2s;box-shadow:0 2px 12px rgba(167,139,250,.25)}.sub-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(167,139,250,.35)}.sub-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
@media(max-width:480px){.qc{padding:20px}.hd{padding:32px 0 20px}.hd h1{font-size:1.4rem}}
</style>

<script>
const Q=[{"t": "W08. Authentication", "tp": "theory", "q": "What is the correct relationship between authentication, session management, and access control?", "o": ["Session management verifies identity first, then authentication handles access control for each subsequent request", "Access control verifies identity; authentication tracks the user across requests; session management determines permitted resources", "Authentication and access control both verify identity, while session management encrypts the communication channel", "Authentication verifies identity; session management tracks the user across requests; access control determines permitted resources"], "a": 3, "e": "Authentication = 'who are you?', session management = 'how do I know it's still you?', access control = 'what can you do?'. Three sequential aspects of IAM."}, {"t": "W08. Authentication", "tp": "mcq", "q": "In HTTP Basic authentication, how are credentials transmitted?", "o": ["As a Kerberos ticket embedded in the WWW-Authenticate header after a challenge-response exchange", "As an encrypted AES-256 token in the Authorization header, which the server decrypts with a shared key", "As a hashed digest in the Authorization header, using the server's nonce to prevent replay", "As a Base64-encoded string in the Authorization header — encoding, not encryption, so HTTPS is required"], "a": 3, "e": "HTTP Basic sends Base64(username:password). Base64 is encoding ≠ encryption. Without HTTPS, credentials can be sniffed. Header: Authorization: Basic dXNlcjpwYXNzd29yZA=="}, {"t": "W08. Authentication", "tp": "mcq", "q": "How does HTTP Digest authentication differ from Basic?", "o": ["Digest sends a hash digest computed from the password plus a server nonce, rather than the plaintext password", "Digest stores the password locally in the browser's keychain, avoiding transmission altogether", "Digest uses public-key cryptography to sign each request, providing non-repudiation for every authentication", "Digest encrypts the password using AES before transmission, providing confidentiality without needing HTTPS"], "a": 0, "e": "Digest uses a challenge-response hash. Still pair with HTTPS though — hashing alone doesn't provide full transport security. Digest is rarer today; most systems use forms + tokens."}, {"t": "W08. Authentication", "tp": "mcq", "q": "Which of the following is NOT a valid factor in multi-factor authentication (MFA)?", "o": ["Possession factors such as a mobile phone, hardware security key, or smart card", "Human verification factors such as CAPTCHA challenges that confirm the user is not a bot", "Knowledge factors such as passwords, PINs, and answers to security questions", "Biometric factors such as fingerprints, facial recognition, or retinal scans"], "a": 1, "e": "CAPTCHA checks human-ness, not identity. MFA requires ≥2 DIFFERENT factor types. Password + PIN is also NOT MFA since both are knowledge factors."}, {"t": "W08. Authentication", "tp": "theory", "q": "What advantage do client certificates and smartcards have over traditional username/password authentication?", "o": ["They enable cryptographic authentication via PKI, support mutual authentication, and reduce phishing risk since keys stay on the device", "They eliminate the need for session management entirely because the certificate is validated on every single request", "They provide the same security as username/password but with a better user experience on mobile devices", "They are significantly easier to deploy across an organization and require no additional infrastructure or management"], "a": 0, "e": "Client certs use PKI for strong crypto auth. Smartcards add a second factor (possession + PIN = MFA). Trade-off: usability and certificate lifecycle management."}, {"t": "W08. Authentication", "tp": "theory", "q": "In the Kerberos authentication flow, what are the three main steps?", "o": ["Client proves identity to AS and gets a TGT; presents TGT to TGS for a Service Ticket; presents Service Ticket to the service", "Client encrypts the request with the server's public key; server decrypts it; both parties establish a TLS session", "Client requests a certificate from the KDC; KDC issues a signed certificate; client presents the certificate to the service", "Client sends password to the Authentication Server; AS stores the password; client accesses the service directly"], "a": 0, "e": "Kerberos uses a KDC (AS + TGS). Passwords are NEVER sent over the network — only tickets and session keys. Tickets are time-limited to reduce replay risk."}, {"t": "W08. Authentication", "tp": "mcq", "q": "Which row correctly compares Kerberos and SSL certificate authentication?", "o": ["Kerberos uses symmetric keys managed by a KDC for internal enterprise SSO; SSL uses PKI with a CA for public internet", "Both use identical PKI infrastructure but Kerberos adds time-limited tickets for additional replay protection", "Kerberos uses public/private keys via a CA for public internet; SSL uses symmetric keys managed by a KDC internally", "Kerberos is less complex and more universally supported; SSL requires additional browser and OS configuration"], "a": 0, "e": "Kerberos = symmetric crypto + KDC + internal networks + complex setup. SSL certs = PKI + CA + public internet + more universal. Both support mutual auth."}, {"t": "W08. Authentication", "tp": "theory", "q": "In OAuth 2.0 third-party authentication, how does the application verify a user's identity without receiving their password?", "o": ["The third-party provider issues secure tokens after the user authenticates directly with the provider — the app only sees tokens", "The user creates a separate application-specific password managed by the third-party identity provider", "The user's password is encrypted by the provider and forwarded to the application for verification against a local store", "The application redirects to a provider page that sends the password hash via a secure back-channel to the application"], "a": 0, "e": "Token-based auth: user authenticates with the provider (Google, Facebook), who issues tokens. Reduces custom auth flaws but creates provider dependency."}, {"t": "W08. Authentication", "tp": "multi", "q": "Which are common design flaws in authentication mechanisms?", "o": ["Verbose failure messages that enable username enumeration by revealing whether the username or password was incorrect", "Using HTTPS with TLS 1.3 for credential transmission between the client browser and the application server", "Unlimited login attempts without account lockout or rate limiting, enabling brute-force and credential stuffing attacks", "Insecure 'Remember me' functionality using predictable or reversible tokens that can be forged by attackers"], "m": [0, 2, 3], "e": "HTTPS/TLS is a secure practice, not a flaw. The other three are well-known authentication design flaws."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A login page returns 'Username not found' for invalid usernames and 'Incorrect password' for wrong passwords. What is the primary risk?", "o": ["TLS misconfiguration — the error messages indicate that encryption is not being applied to the login responses", "Weak password policy — the application is revealing that it checks passwords against a dictionary of common values", "SQL injection — the different messages indicate the application is constructing database queries using the error type", "Verbose failure messages enable username enumeration — attackers can build a list of valid accounts before targeted brute-forcing"], "a": 3, "e": "Different errors per field let attackers identify valid accounts. Even identical pages may differ in HTML source, timing, or redirects. Return generic 'Login failed'."}, {"t": "W08. Authentication", "tp": "scenario", "q": "After 200 failed login attempts, the application still responds normally with no lockout. What attack does this enable?", "o": ["Brute-force and credential stuffing — attackers can try unlimited password combinations against target accounts", "Session fixation — without lockout, the application assigns the same session token to all failed authentication attempts", "SQL injection — the high number of accepted requests indicates input validation is missing on the login fields", "Cross-site request forgery — the lack of lockout means anti-CSRF tokens are not being validated on the login form"], "a": 0, "e": "No lockout + no rate limiting = unlimited attempts. Mitigate with account lockout, rate limiting, CAPTCHA, and MFA."}, {"t": "W08. Authentication", "tp": "scenario", "q": "An application relies on client-side cookies to count failed login attempts and trigger lockout. Why is this flawed?", "o": ["Client-side cookies are more reliable than server-side counters because they persist across browser sessions", "Cookies cannot store numeric values, so the counter will always reset to zero on each new page load", "Attackers can obtain a fresh cookie for each attempt or delete the counter cookie, completely bypassing lockout", "Client-side cookies are always encrypted by the browser, making the counter impossible for the server to verify"], "a": 2, "e": "Client-side counters are trivially bypassable — clear, replace, or don't send the cookie. Lockout must be enforced server-side."}, {"t": "W08. Authentication", "tp": "mcq", "q": "Why should brute-force attacks use a breadth-first approach (user1-pass1, user2-pass1, user3-pass1, ...)?", "o": ["It generates less network traffic than depth-first because HTTP keep-alive connections can be reused across users", "It avoids triggering per-account lockout thresholds by spreading attempts across many accounts before trying a second password", "Breadth-first is computationally faster because it allows parallel processing of multiple password hashes simultaneously", "It is the only approach supported by Burp Intruder's built-in attack modes and payload processing rules"], "a": 1, "e": "Breadth-first: try one password against all usernames before the next password. Avoids hitting per-account lockout while still testing many combinations."}, {"t": "W08. Authentication", "tp": "multi", "q": "Credentials should NEVER be sent via which of the following channels?", "o": ["Cookies used to store actual passwords, because they can be stolen via XSS or CSRF attacks", "POST request body over HTTPS, because the data is encrypted in transit end-to-end", "URL query parameters, because they are logged in browser history, server logs, and proxy logs", "Plain HTTP without TLS, because the credentials can be intercepted by network eavesdropping"], "m": [0, 2, 3], "e": "POST over HTTPS is the correct method. HTTP = sniffable, URL params = logged everywhere, passwords in cookies = stealable."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A password change page checks the new password's strength but does NOT verify the user's current password. What category of flaw is this?", "o": ["Credential validation quirk — the old password check exists but uses case-insensitive comparison logic", "Incomplete validation of credentials — the required check for the old password is entirely missing from the flow", "Verbose failure message — the strength check reveals information about the application's password policy", "Brute-forcible login — the lack of old password verification allows unlimited authentication attempts"], "a": 1, "e": "Incomplete validation: a required check is missing. An attacker with session access (e.g., via XSS) can change the password without knowing the original."}, {"t": "W08. Authentication", "tp": "multi", "q": "Which are common weaknesses in forgotten password functionality?", "o": ["Requiring email verification via a cryptographically random, time-limited, single-use reset token", "Allowing users to set their own easily guessable security questions during account registration", "Emailing the actual password back to the user in plaintext instead of a time-limited reset token", "Providing password hints that essentially reveal the actual password or make it trivially guessable"], "m": [1, 2, 3], "e": "Email verification with time-limited tokens is the secure approach. The other three are well-known weaknesses in reset flows."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A 'Remember me' cookie contains <code>RememberUser=bob</code>. What is the flaw and how would an attacker exploit it?", "o": ["The token is a predictable, meaningful value — an attacker simply changes 'bob' to another username to impersonate them", "The cookie is transmitted over HTTPS, which prevents the server from reading it when the user switches to HTTP pages", "The cookie expires too quickly, forcing users to re-authenticate more frequently than necessary for their threat model", "The cookie uses HTTP-only flag incorrectly, preventing the client from reading it for auto-fill functionality"], "a": 0, "e": "Persistent cookies become password equivalents. If the value is just a username, anyone can forge it. Use random, rotating, server-stored tokens with expiry."}, {"t": "W08. Authentication", "tp": "theory", "q": "What distinguishes 'incomplete validation of credentials' from a 'credential validation quirk'?", "o": ["Both terms describe the same class of vulnerability but are named differently depending on which authentication stage is affected", "Incomplete validation only applies to multi-stage login flows, while quirks apply to single-stage password-based login forms", "Incomplete validation means a required check is entirely absent (attack: skip steps); a quirk means the check exists but is wrong (attack: craft colliding credentials)", "A quirk is always more severe because it indicates intentional design decisions, while incomplete validation is an oversight"], "a": 2, "e": "Incomplete: skip the check entirely (e.g., no password verification). Quirk: check runs but works wrong (e.g., truncation, case-insensitive). Different root causes, different attacks."}, {"t": "W08. Authentication", "tp": "scenario", "q": "An application generates usernames like EMP001, EMP002, EMP003. What security risk does this create?", "o": ["The numeric format prevents the use of multi-factor authentication because MFA tokens require alphanumeric usernames", "Sequential usernames cause database index collisions that can be exploited to bypass authentication on shared indices", "Predictable username patterns make account enumeration trivial, enabling targeted brute-force attacks against all known accounts", "The short username format violates minimum length requirements and makes the accounts vulnerable to dictionary attacks"], "a": 2, "e": "Predictable patterns let attackers enumerate all accounts. Same risk applies to predictable initial passwords (e.g., same temp password for all)."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A web application stores passwords as unsalted MD5 hashes. An attacker obtains the database. What specific attack is this storage most vulnerable to?", "o": ["Brute-force attack only, requiring the attacker to hash each candidate password individually against every hash in the database", "Rainbow table attack — precomputed hash-to-password lookup tables that can crack unsalted hashes almost instantly", "Phishing attack — the attacker sends emails pretending to be the application and collects credentials from users who respond", "Replay attack — the attacker captures and resubmits the hash value directly to the login form without cracking it"], "a": 1, "e": "Unsalted MD5 = precomputed rainbow tables. LinkedIn 2012: 110M unsalted hashes cracked. Fix: slow hash (bcrypt/Argon2) + unique salt per password."}, {"t": "W08. Authentication", "tp": "mcq", "q": "Non-unique hashes appearing multiple times in a password database indicate:", "o": ["The database has been compromised and the hashes have been tampered with by an attacker to create duplicates", "Either common passwords are being used across accounts, or hashes lack unique per-password salts, or both", "The application is using multi-factor authentication, which intentionally creates duplicate hashes for redundancy", "The passwords are properly encrypted with a strong algorithm that happens to produce collisions for common inputs"], "a": 1, "e": "Same hash = same password (if no salt) or same password+salt combo. Both are problems that aid attackers."}, {"t": "W08. Authentication", "tp": "scenario", "q": "In a multi-stage login (Stage 1: password, Stage 2: OTP), an attacker replays the Stage 2 request but substitutes a different username in a hidden field. What vulnerability is this?", "o": ["Session fixation — the application assigns the attacker's session token to the new username specified in the hidden field", "Cross-site request forgery — the hidden field manipulation is only possible because anti-CSRF tokens are missing from Stage 2", "Weak OTP generation — the OTP is deterministically derived from the username, so changing the username produces a valid OTP", "Logic flaw — the app doesn't re-verify identity at Stage 2, trusting that the same user who completed Stage 1 is still present"], "a": 3, "e": "Common bad assumptions: Stage 2 trusts data from Stage 1, same identity completes all stages. Test by skipping/reordering stages and changing repeated fields."}, {"t": "W08. Authentication", "tp": "scenario", "q": "During a password-guessing attack, you find one specific password works for multiple different usernames. What might this indicate?", "o": ["A backdoor password deliberately planted by a developer or attacker that grants access to any account", "A load balancer distributing authentication requests across servers with inconsistent password databases", "A credential validation quirk where the system truncates passwords, causing many different passwords to collide", "A coincidence — multiple users independently chose the same strong password during registration"], "a": 0, "e": "One password matching many usernames is a red flag for backdoor passwords. Always check for this during password-guessing attacks."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A system stores only the first 10 characters of passwords. Both 'Security12345!' and 'Security99999!' authenticate the same user. Incomplete validation or validation quirk?", "o": ["Incomplete validation — the system only validates the first 5 characters, ignoring the remaining portion entirely", "Neither — this is expected behavior for systems that enforce a maximum password length of 10 characters", "Incomplete validation — the system fails to check the password at all and accepts any input matching the username", "Validation quirk — the check exists but truncates before comparing, causing collisions between different passwords"], "a": 3, "e": "The check runs but is wrong (truncation). Incomplete validation would be skipping the check entirely. Quirk = check exists, implemented incorrectly."}, {"t": "W08. Authentication", "tp": "scenario", "q": "You register several accounts and notice activation URLs follow a pattern: <code>/activate?token=1001</code>, <code>1002</code>, <code>1003</code>. What is the risk?", "o": ["The sequential pattern indicates the application is using proper database auto-increment IDs for tracking purposes", "No risk — sequential tokens ensure each account gets a unique activation link that cannot be duplicated", "Predictable activation tokens allow an attacker to activate other users' accounts or forge activation links for arbitrary accounts", "Sequential tokens are actually more secure because the server can verify they were issued in the correct order"], "a": 2, "e": "Register multiple accounts in succession and look for URL patterns. Also test if activation URLs can be reused after expiration. Credentials distributed out-of-band need time limits."}, {"t": "W08. Authentication", "tp": "scenario", "q": "In the Okta 2023 incident, attackers accessed HAR files from the customer support system. Why were these files dangerous?", "o": ["HAR files can contain live session tokens and cookies, enabling direct account impersonation without any credentials", "HAR files recorded the network topology of customer environments, enabling targeted infrastructure attacks", "HAR files contained the source code of Okta's authentication modules, allowing attackers to find zero-day vulnerabilities", "HAR files contained encrypted password databases that the attackers could decrypt using Okta's leaked master key"], "a": 0, "e": "HAR (HTTP Archive) files capture full HTTP traffic including cookies/tokens. Lesson: sanitize diagnostic uploads, revoke tokens after sharing, use phishing-resistant MFA."}, {"t": "W08. Authentication", "tp": "scenario", "q": "The SEC's X account was compromised via SIM-swap in 2024. What is the key lesson for high-value account security?", "o": ["The incident was caused by a weak password, not the SIM-swap — stronger password requirements would have prevented it", "SIM-swap attacks are too rare to justify changing authentication methods for organizational accounts", "Avoid SMS-based recovery for high-value accounts — use phishing-resistant MFA like FIDO2 security keys instead, since phone-number recovery is a single point of failure", "SMS-based MFA is the strongest available option because phone numbers are tied to physical SIM cards that are difficult to clone"], "a": 2, "e": "SIM-swap: attacker convinces the carrier to transfer the victim's number. SMS-based MFA/recovery then becomes the weakest link."}, {"t": "W08. Authentication", "tp": "theory", "q": "Hashing and encryption serve different purposes. Why must passwords be hashed rather than encrypted?", "o": ["Hashing is one-way and cannot recover the original; encryption is reversible with a key — so a key compromise exposes ALL passwords", "Encryption is one-way and more secure, but hashing is used because browsers cannot perform decryption operations", "Hashing is reversible with the correct key, while encryption is one-way — so encryption exposes raw passwords if compromised", "Both are equivalent for password storage, but hashing is preferred because it requires less computational power on the server"], "a": 0, "e": "Encrypted passwords: compromise the key → recover every password at once. Hashed passwords: even with full access, originals can't be recovered, only verified by re-hashing."}, {"t": "W08. Authentication", "tp": "theory", "q": "The slides recommend slow hashes + unique salt + an optional third layer. What is this third layer?", "o": ["A nonce that is generated per-request and appended to the password before the slow hashing algorithm runs", "A pepper — a secret value added before hashing, stored separately from the database (e.g., in application config)", "An initialization vector (IV) that ensures each hash operation starts from a different cryptographic state", "An HMAC key that signs the hash output to prevent tampering with the stored hash values in the database"], "a": 1, "e": "Salt (unique per password, in DB) defeats rainbow tables. Pepper (app secret, outside DB) means a full DB dump alone isn't enough to crack hashes."}, {"t": "W08. Authentication", "tp": "multi", "q": "Which items belong on the defender checklist for secure authentication?", "o": ["Enforce strong, unique credentials and prefer passphrases over short complex passwords", "Protect credentials in transit with TLS and at rest with slow hashing algorithms (bcrypt, Argon2)", "Prevent automation via rate limiting, account lockout, MFA, and suspicious event monitoring", "Provide detailed error messages with error codes, timestamps, and query details to help users debug login issues"], "m": [0, 1, 2], "e": "Detailed errors help attackers, not users. The checklist also includes: generic errors, consistent responses, hardened reset/change/remember-me flows, and logging/monitoring/alerting."}, {"t": "W08. Authentication", "tp": "mcq", "q": "What is <code>haveibeenpwned.com</code> useful for in authentication security?", "o": ["It provides free SSL certificates that applications can use to encrypt credential transmission over HTTPS", "It is a password manager that generates and stores unique credentials for every website a user visits", "It is a penetration testing tool that automates brute-force attacks against login forms using leaked password lists", "It checks whether credentials have appeared in known data breaches, useful for identifying compromised accounts"], "a": 3, "e": "haveibeenpwned.com lets users check if their email/password has appeared in breaches. Referenced in slides as a resource for discovering compromised logins."}, {"t": "W08. Authentication", "tp": "scenario", "q": "You discover a password change page accessible without being logged in. Why is this potentially more dangerous than the login page itself?", "o": ["Password change pages always use weaker encryption than login pages because they handle fewer concurrent requests", "The old password field uses client-side validation only, meaning the new password can be set by modifying the form's JavaScript", "Password change pages are served from a different server that may not have the same firewall rules or WAF protections", "The page may leak usernames via verbose errors, allow unlimited old-password guesses, and be exploitable for enumeration — often less hardened than login"], "a": 3, "e": "Password change pages accessible without auth are often MORE vulnerable: verbose username errors, unlimited old-password guesses, new/confirm checks run after old-password validation."}, {"t": "W08. Authentication", "tp": "mcq", "q": "Which of the following is NOT a recommended practice for secure authentication?", "o": ["Salting each password hash with a unique per-user random value to prevent rainbow table attacks", "Implementing multi-factor authentication using at least two different factor types for sensitive operations", "Storing passwords in cleartext or reversible encryption so support staff can help users recover forgotten passwords", "Using HTTPS with TLS for all credential transmission between the client browser and the application server"], "a": 2, "e": "Cleartext or reversible encryption = immediate compromise if the database is breached. Support should use password RESET flows, never password RECOVERY."}, {"t": "W08. Authentication", "tp": "scenario", "q": "In the 23andMe credential stuffing incident (2023), compromised accounts exposed others' data via social features. Why did 'sharing' amplify the impact?", "o": ["One compromised account could access data that OTHER users had opted into sharing — exposure far exceeded the breached accounts", "Shared data was cached in the browser, so attacking one user's machine gave access to all previously viewed shared profiles", "The sharing feature disabled all authentication checks, allowing anyone with a link to access shared genetic profiles", "The sharing feature stored genetic data in a separate unencrypted database that was directly accessible via the API"], "a": 0, "e": "Transitive exposure: breach account A → access data shared by B, C, D who are A's connections. Rate limiting + breached-password checks + MFA reduce stuffing risk."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A multi-stage login (Stage 1: password, Stage 2: OTP) has a hidden field <code>stage1complete=true</code>. You navigate directly to Stage 2 and it works. What is the vulnerability?", "o": ["Logic flaw — Stage 2 trusts the client-side hidden field to confirm Stage 1 passed, allowing attackers to skip password verification", "Session fixation — the same session token is used across both stages, so the attacker can reuse a captured Stage 1 token", "Weak OTP generation — the OTP is derived from the session ID, so knowing the session allows computing valid OTPs", "CSRF vulnerability — the hidden field should contain an anti-CSRF token instead of a boolean completion flag"], "a": 0, "e": "App assumes reaching Stage 2 means Stage 1 passed. Hidden fields are trivially forgeable. Each stage must independently verify server-side."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A login form accepts any password as long as the username exists. Is this incomplete validation or a quirk?", "o": ["Incomplete validation — the password check is entirely absent, meaning the system only verifies the username exists", "Neither — this indicates SQL injection, where the password field is being bypassed via injected query logic", "Both — the system has a missing check (incomplete) that manifests as incorrect behavior (quirk) simultaneously", "Validation quirk — the password comparison function returns true regardless of input due to a type coercion bug"], "a": 0, "e": "A required check (password verification) is completely absent = incomplete validation. A quirk would be if the check existed but was wrong (e.g., case-insensitive)."}, {"t": "W08. Authentication", "tp": "scenario", "q": "Passwords are stored in reversible encrypted format rather than hashed. Why is this a problem even though they aren't cleartext?", "o": ["Reversible encryption means anyone with the key can decrypt ALL passwords at once — hashing is one-way so originals can't be recovered", "Encrypted passwords cannot be verified during login because the decryption operation is too slow for real-time authentication", "Encrypted passwords take more storage space than hashed passwords, increasing database costs and backup complexity", "There is no practical difference — both encryption and hashing provide equivalent protection for stored credentials"], "a": 0, "e": "Encryption is reversible: compromise the key → every password exposed. Hashing is one-way: even with full access, originals can't be recovered. This is why hashing ≠ encryption."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A password reset lets users specify their own security questions. An attacker collects questions from enumerated usernames. What is the risk?", "o": ["User-chosen questions are often guessable — attacker focuses on accounts with weak questions and brute-forces or guesses the answers", "User-defined questions are more secure because only the user knows what personal information they chose to reference", "The security questions are encrypted in the database, so collecting them provides no advantage to the attacker", "The risk is limited to accounts that use the same question as the attacker's own account in the system"], "a": 0, "e": "User-set questions tend to be weak or based on publicly available info (social media). Harvest questions → focus on guessable ones → reset passwords."}, {"t": "W09. Session Management", "tp": "theory", "q": "Why does HTTP need session management even though it functions correctly as a stateless protocol?", "o": ["Applications need to associate multiple requests with the same user to avoid forcing re-authentication on every page load", "HTTP cannot transmit any cookies or headers without an active session management framework running on the server", "HTTP session management is a regulatory compliance requirement mandated by GDPR for all websites serving EU users", "Session management is only required for e-commerce applications that need to maintain shopping cart state information"], "a": 0, "e": "HTTP is stateless. Session tokens let the server link requests to the same authenticated user across their entire interaction."}, {"t": "W09. Session Management", "tp": "theory", "q": "'We use smartcards for authentication, so user sessions cannot be compromised without them.' Why is this wrong?", "o": ["The statement is wrong only because smartcard readers are easily cloned using commercially available hardware", "Authentication is NOT session management — flawed session implementation lets attackers bypass even robust authentication", "Smartcards provide both authentication and session management simultaneously, making the statement actually correct", "Smartcards don't work with modern web browsers and require legacy ActiveX plugins that are no longer supported"], "a": 1, "e": "Even with strong auth (smartcards, MFA), if session tokens are predictable, stealable, or don't expire, attackers bypass auth entirely."}, {"t": "W09. Session Management", "tp": "mcq", "q": "The cookie attribute <code>HttpOnly</code> prevents ____ and <code>SameSite</code> mitigates ____.", "o": ["Server-side session fixation attacks; timing-based side-channel attacks on the authentication process", "JavaScript-based cookie theft (XSS); cross-origin cookie sending that enables CSRF attacks", "SQL injection attacks; brute-force password guessing attacks against the login endpoint", "Man-in-the-middle interception of cookies; replay attacks using previously captured cookie values"], "a": 1, "e": "HttpOnly: JavaScript can't access the cookie → blocks XSS cookie theft. SameSite: limits cross-origin cookie sending → mitigates CSRF."}, {"t": "W09. Session Management", "tp": "mcq", "q": "You decode a hex session token to: <code>user=daf;app=admin;date=01/12/11</code>. What is the primary vulnerability?", "o": ["Encrypted token without integrity — the AES encryption doesn't include an HMAC, allowing ciphertext manipulation", "Meaningful structured token — it contains decodable user data that an attacker can modify and re-encode to forge sessions", "Weak random number generator — the token was generated using Math.random() instead of a cryptographically secure PRNG", "Session fixation — the date field shows the token was generated months ago and has never been rotated or invalidated"], "a": 1, "e": "Token contains structured data (username, app, date) merely hex-encoded. Attacker decodes, changes user to admin, re-encodes. Common encodings: hex, Base64, XOR — none are encryption."}, {"t": "W09. Session Management", "tp": "scenario", "q": "Base64-encoded tokens from consecutive logins, when decoded to hex and subtracted, show a constant difference. What type of weakness is this?", "o": ["Encrypted token — the constant difference is an artifact of ECB mode producing predictable ciphertext block relationships", "Concealed sequence — a hidden arithmetic pattern under encoding layers, where adding a fixed increment predicts the next token", "Meaningful token — the constant difference encodes the user ID, which is the same across all login sessions for one user", "Time-dependent token — the constant difference represents the fixed time interval between consecutive login events"], "a": 1, "e": "The slides show: decode Base64 → hex → subtract consecutive values → constant pattern emerges. Attacker adds the increment to predict the next token."}, {"t": "W09. Session Management", "tp": "scenario", "q": "Session tokens look like <code>3124538-1172764258718</code>. The first number increments by 1 each login. The second number's differences vary (344, 219, 453...). What is it?", "o": ["An encrypted session counter using a stream cipher that produces pseudo-random differences between consecutive values", "A random nonce that provides cryptographic strength to the overall token and cannot be predicted or brute-forced", "A hash of the username and password that changes slightly due to timing differences in the hashing computation", "A time-related component — small varying differences suggest timestamps that could be brute-forced within a narrow window"], "a": 3, "e": "First number: sequential counter. Second: time-related (small varying diffs). Capture more tokens later to verify. Attacker narrows the search window."}, {"t": "W09. Session Management", "tp": "multi", "q": "Which are common weak RNG mistakes for session token generation?", "o": ["PHP's mt_rand() which uses the Mersenne Twister algorithm that is predictable once the internal state is recovered", "JavaScript's Math.random() which is not cryptographically secure and can be reverse-engineered from outputs", "Python's secrets.token_hex() which is backed by the operating system's cryptographically secure entropy source", "Java's java.util.Random which uses a linear congruential generator with a predictable seed and sequence"], "m": [0, 1, 3], "e": "Math.random(), mt_rand(), and java.util.Random are NOT cryptographically secure. secrets.token_hex() IS secure (CSPRNG). Test randomness with Burp Sequencer."}, {"t": "W09. Session Management", "tp": "multi", "q": "What are the three categories of weaknesses in session token generation?", "o": ["Encrypted tokens vulnerable to block manipulation — ECB block swapping or CBC bit-flipping to alter plaintext", "Meaningful tokens containing decodable structured data like usernames that can be modified and re-encoded", "Excessively long tokens that cause buffer overflows in the server's session management parsing routines", "Predictable tokens using sequential patterns, time-dependent values, or weak pseudo-random number generators"], "m": [0, 1, 3], "e": "(1) Meaningful = decodable/forgeable. (2) Predictable = guessable. (3) Encrypted = manipulable ciphertext. Token length isn't a vulnerability category."}, {"t": "W09. Session Management", "tp": "scenario", "q": "In ECB-encrypted tokens, swapping ciphertext block 4 (uid=219) with block 6 (e=daf1) changes the UID. Why does this work?", "o": ["ECB uses XOR-based encryption that is trivially reversible, so the attacker decrypts the token, modifies it, and re-encrypts", "ECB encrypts each block independently with no chaining or integrity check — identical plaintext always produces identical ciphertext, enabling free block rearrangement", "The encryption key is derived from the session ID, which the attacker already knows from observing the token structure", "ECB chains blocks together, but the chaining function has a known algebraic weakness that allows controlled modifications"], "a": 1, "e": "No signature, no chaining, no tamper detection. Each block decrypts independently. The character '1' happens to align with the UID byte position."}, {"t": "W09. Session Management", "tp": "scenario", "q": "An attacker wants to change 'uid=216' to 'uid=001' in a CBC-encrypted token. How is this done?", "o": ["Flip specific bits in the PREVIOUS ciphertext block — CBC XORs each plaintext with the prior ciphertext, so bit flips propagate predictably to the next block", "Brute-force the AES encryption key by trying all possible keys until the modified token decrypts to the desired UID value", "Swap ciphertext blocks in the same way as ECB, since CBC uses the same underlying block cipher algorithm", "Modify the initialization vector only, since CBC's IV determines the entire plaintext of all subsequent blocks"], "a": 0, "e": "CBC bit-flipping: flipping bits in ciphertext block N causes predictable bit flips in plaintext block N+1 (but garbage in block N). Harder than ECB but feasible with trial-and-error."}, {"t": "W09. Session Management", "tp": "scenario", "q": "An app sets cookies with <code>Domain=.example.com</code>. Main app is at <code>app.example.com</code>. What is the security impact?", "o": ["The cookie is forced into HTTP-only mode, preventing the application's JavaScript from reading or modifying it", "The cookie becomes invisible to app.example.com because the domain attribute overrides the origin's cookie scope", "Any subdomain (mail, admin, or attacker-controlled evil.example.com) receives the session cookie — subdomain compromise means token theft", "The SameSite attribute is automatically disabled when a parent domain is specified, removing all CSRF protections"], "a": 2, "e": "Domain=.example.com → cookie sent to ALL subdomains. Set Domain=app.example.com explicitly to limit scope."}, {"t": "W09. Session Management", "tp": "theory", "q": "What properties make a session token cryptographically secure?", "o": ["The token should contain a hash of the user's IP address and browser fingerprint to prevent session hijacking across devices", "The token should have maximum entropy — not meaningful, completely unpredictable, and generated by a CSPRNG rather than Math.random()", "The token should use reversible encryption of the session state so the server can efficiently reconstruct the session on each request", "The token should encode the user's role and permissions directly, enabling the server to process requests without database lookups"], "a": 1, "e": "Good token: no embedded data, no patterns, CSPRNG-generated. Token = opaque identifier; all session state stays server-side."}, {"t": "W09. Session Management", "tp": "scenario", "q": "An application issues a session token before login. After successful authentication, the same token persists unchanged. What attack is possible?", "o": ["Cross-site scripting — the token persistence means HttpOnly is not set, allowing JavaScript to read the session cookie", "Session fixation — an attacker obtains or sets a known token, waits for the victim to authenticate, then uses the now-authenticated token", "SQL injection — the unchanged token indicates the session store is a database table that may be vulnerable to injection", "Brute-force — the pre-login token reveals the algorithm used for post-login token generation, enabling prediction"], "a": 1, "e": "Fix: ALWAYS issue a new token on successful login. The old pre-auth token must be invalidated server-side."}, {"t": "W09. Session Management", "tp": "scenario", "q": "A logout function only clears the cookie via client-side JavaScript. The server never invalidates the token. What is the security impact?", "o": ["The token remains valid server-side, so an attacker who previously captured it can continue using it indefinitely after 'logout'", "Client-side logout is more secure than server-side because it prevents the server from retaining sensitive session data in memory", "The JavaScript function will also clear the server's session store because modern browsers send a DELETE request to the session endpoint", "No impact — clearing the cookie is sufficient because the browser will no longer send the token in subsequent requests"], "a": 0, "e": "Session termination MUST happen server-side. Client-side cookie clearing is trivially bypassed — the token continues to work. Also implement server-side timeouts."}, {"t": "W09. Session Management", "tp": "multi", "q": "Which attacks exploit client-side exposure to session token hijacking?", "o": ["XSS — injected JavaScript reads the session cookie and sends it to an attacker-controlled server for replay", "SQL injection — the attacker extracts session tokens directly from the server's database via injected queries", "CSRF — the browser automatically includes session cookies with cross-site requests initiated from attacker-controlled pages", "Session fixation — attacker feeds a known token to the victim before login, then reuses the authenticated token"], "m": [0, 2, 3], "e": "XSS steals tokens (blocked by HttpOnly). Session fixation pre-sets tokens. CSRF exploits auto-sent cookies. SQLi targets the data store, not session handling."}, {"t": "W09. Session Management", "tp": "mcq", "q": "If a site issues the SAME session token every time a user logs in, what becomes trivial?", "o": ["SQL injection — static tokens indicate the session store uses predictable query patterns that can be injected into", "Cross-site scripting — static tokens mean HttpOnly is not set, since dynamic tokens require JavaScript to rotate", "DNS poisoning — knowing the static token allows the attacker to redirect the domain to a server that accepts the same token", "Permanent session hijacking — a stolen token never changes, so the attacker can use it indefinitely across all future sessions"], "a": 3, "e": "Static tokens never expire or change. Stolen once = hijacked forever. Must issue unique tokens per session."}, {"t": "W09. Session Management", "tp": "scenario", "q": "Consecutive tokens: <code>...B8F1</code>, <code>...B8F2</code>, <code>...B8F5</code>. What attack becomes feasible?", "o": ["CSRF bypass — sequential tokens indicate the anti-CSRF mechanism is tied to the session counter rather than random values", "CBC bit-flipping — the sequential last bytes indicate CBC encryption with a predictable counter as the initialization vector", "Token guessing via sequence prediction — identical prefixes and incrementing suffixes let attackers extrapolate other users' tokens", "Session fixation — the similar prefixes mean the server accepts any token that starts with the known prefix bytes"], "a": 2, "e": "Identical prefixes, incrementing suffixes → predictable. Attacker observes a few → extrapolates others' tokens."}, {"t": "W09. Session Management", "tp": "mcq", "q": "What enables token disclosure on the network even when the application uses TLS?", "o": ["Tokens stored in HttpOnly cookies, which prevent client-side access but not server-side logging of the cookie values", "Short session timeout values, which force frequent re-authentication and increase the number of tokens transmitted over the wire", "Tokens placed in URL query parameters, which are logged in browser history, server logs, proxy logs, and leaked via Referer headers", "SameSite=None set on cookies, which allows the token to be sent cross-origin but doesn't affect its network visibility"], "a": 2, "e": "URL tokens are visible/logged everywhere. TLS encrypts the channel but doesn't prevent endpoints from logging the full URL. Referer leaks tokens to external sites."}, {"t": "W09. Session Management", "tp": "mcq", "q": "What tool tests the quality of randomness in session tokens?", "o": ["Nmap — its scripting engine includes modules for statistical analysis of captured network tokens", "Burp Sequencer — configure the token location, start a live capture, and auto-analyze for statistical weaknesses", "Wireshark — its protocol analysis features can detect non-random patterns in encrypted session cookie values", "sqlmap — its session detection module evaluates token entropy as part of the SQL injection discovery process"], "a": 1, "e": "If tokens fail Burp Sequencer's randomness test, identify the underlying algorithm and write a script to generate candidates."}, {"t": "W09. Session Management", "tp": "scenario", "q": "An app uses HTTPS for login, but the session cookie was issued during an earlier HTTP request on port 80. Why is this dangerous?", "o": ["The token could be intercepted during the initial HTTP request; also, without the Secure flag, the cookie continues to be sent over HTTP", "HTTP requests on port 80 are automatically redirected to HTTPS by all modern browsers before any cookies are transmitted", "The cookie is encrypted by the browser's built-in HSTS mechanism even when transmitted over plain HTTP connections", "HTTPS and HTTP use different cookie stores, so the session cookie from HTTP cannot be read by HTTPS pages"], "a": 0, "e": "Test: check if server listens on port 80, visit HTTP URLs within an authenticated session, verify if the token is still valid (server should terminate it immediately)."}, {"t": "W09. Session Management", "tp": "scenario", "q": "You log into an app twice with the same account. Both sessions remain active simultaneously. What is the concern?", "o": ["Both sessions share the same token, which means only one will work at a time due to server-side token locking", "Concurrent sessions indicate the application is using JWT tokens instead of server-side sessions, which is inherently less secure", "The system cannot detect leaked credentials, because a stolen token stays valid alongside the legitimate user's session", "No concern — concurrent sessions are a standard feature that improves user experience across multiple devices"], "a": 2, "e": "If multiple concurrent tokens are allowed, the system can't detect when credentials have leaked. A new login should ideally invalidate previous tokens."}, {"t": "W09. Session Management", "tp": "theory", "q": "In a CSRF attack, an attacker makes a crafted request from a site they control. Why does the victim's browser comply?", "o": ["The browser's same-origin policy doesn't apply to form submissions, allowing any website to POST data to any other domain", "The attacker exploits a DNS rebinding vulnerability to make their domain resolve to the target application's IP address", "The attacker uses XSS to inject JavaScript on the target domain first, then that script makes authenticated requests on behalf of the user", "The victim's browser automatically includes session cookies with requests to the target domain, regardless of which site initiated the request"], "a": 3, "e": "CSRF exploits automatic cookie inclusion. Mitigate with: SameSite attribute, anti-CSRF tokens, Origin header checking."}, {"t": "W09. Session Management", "tp": "scenario", "q": "An app at <code>/apps/secure/</code> sets a cookie with <code>path=/apps/</code> instead of the default path. What is the risk?", "o": ["The cookie is sent to ALL paths under /apps/ including less-secure sibling directories — vulnerabilities there can steal the token", "The broader path setting automatically makes the cookie persistent, removing the session-only behavior browsers normally apply", "Path attributes are ignored by modern browsers, so this setting has no practical security impact on cookie transmission", "The cookie becomes inaccessible to the issuing application because the path attribute narrows the scope below the default"], "a": 0, "e": "Default: cookies sent to issuing directory and subdirectories only. Setting path=/apps/ broadens scope to include sibling paths that may be less protected."}, {"t": "W10. Access Controls", "tp": "theory", "q": "What is the difference between vertical, horizontal, and context-dependent access control?", "o": ["Vertical applies to server-side checks; horizontal applies to client-side checks; context-dependent applies to API-level checks", "All three describe the same access control model but are named differently depending on the organization's security framework", "Vertical controls different functions per user type; horizontal controls same-type resource subsets per user; context-dependent restricts access based on application state", "Vertical restricts by data volume; horizontal restricts by function count; context-dependent restricts by geographic location"], "a": 2, "e": "Context-dependent example: can't skip checkout steps, can't access multistage functions out of order. Vertical: user vs admin. Horizontal: your emails vs others'."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "According to OWASP Top 10 (2025), what is the #1 web application vulnerability?", "o": ["Cross-Site Scripting (XSS) — the most prevalent client-side vulnerability affecting both stored and reflected variants", "Cryptographic Failures — weak encryption and key management expose sensitive data across the majority of web applications", "SQL Injection — still the most commonly exploited vulnerability in production web applications worldwide", "Broken Access Control — flawed authorization can lead to full application compromise and unauthorized data access"], "a": 3, "e": "Broken access control leads to: attacker controlling admin functions, accessing others' data. Example: Optus 2023 breach — IDOR exposed 10M customers."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "An app checks <code>admin=true</code> in the URL query string for admin access. What type of vulnerability is this?", "o": ["Secure role-based access control that efficiently encodes the user's privilege level in each request URL", "Insecure parameter-based access control — any user can add or modify the client-controlled parameter to gain access", "A business logic control that correctly prevents admin functionality from appearing in low-privilege user interfaces", "A server-side privilege enforcement mechanism that validates the parameter against the authenticated session state"], "a": 1, "e": "Client parameters are trivially modified. Access decisions must be server-side based on authenticated user's actual role. Never trust client data."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "Which best describes an Insecure Direct Object Reference (IDOR) vulnerability?", "o": ["A user logs into the application without providing a password by exploiting a flaw in the authentication state machine", "A user bypasses HTTPS encryption by directly referencing internal server resources using unencrypted HTTP links", "A user accesses or modifies another user's resource by changing identifiers like document IDs or account numbers in the request", "A user guesses admin panel URLs by enumerating common administrative path patterns like /admin and /dashboard"], "a": 2, "e": "IDOR: app exposes object references (DB IDs) without verifying authorization. Use random UUIDs instead of sequential IDs."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "A student finds <code>/admin/manageUsers</code> by reading a JavaScript file. They can access it without admin privileges. What vulnerability is this?", "o": ["SQL injection — the admin page directly exposes database operations that can be manipulated through the URL parameters", "Completely unprotected functionality — admin functions are accessible to anyone who knows the URL, with no server-side authorization", "Cross-site scripting — the JavaScript file should sanitize all output to prevent injection of administrative URLs", "Broken session management — the student's session was incorrectly elevated to admin privileges when loading the JavaScript"], "a": 1, "e": "The JS had: if(isAdmin){ adminMenu.addItem('/menus/secure/ff457/addNewPortalUser2.jsp') }. URLs are discoverable. Enforce server-side auth."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "A bank transfer has 3 stages. At stage 3 (enter auth code), the attacker modifies the source account number in a hidden field. What happened?", "o": ["Session fixation — the attacker's session was merged with the victim's session during the multi-stage transfer process", "Horizontal privilege escalation via a multistage flaw — the app didn't revalidate the source account at each stage, allowing access to another user's account", "SQL injection — the source account number was concatenated into a database query that the attacker manipulated", "Cross-site request forgery — the attacker submitted a forged transfer request from an external website using the victim's session"], "a": 1, "e": "App assumed data from stage 1 was trustworthy at stage 3. Re-validate ALL data at EVERY step."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "Why is using the HTTP Referer header for access control fundamentally broken?", "o": ["The Referer header is validated and enforced by the browser's same-origin policy, preventing cross-origin forgery", "The Referer header is a client-supplied HTTP header that can be freely added, removed, or modified using an intercepting proxy", "The Referer header is only included in POST requests, so GET-based admin functions would bypass the access control entirely", "The Referer header is encrypted by TLS during transmission, making it impossible for the server to read and validate"], "a": 1, "e": "Referer is just another client header — trivially modified with Burp Suite. Not a secure proof of origin."}, {"t": "W10. Access Controls", "tp": "theory", "q": "How can location-based access controls be circumvented by an attacker?", "o": ["They cannot be circumvented because IP geolocation databases are maintained by government agencies and always accurate", "Location controls can only be bypassed with administrative access to the application's geolocation configuration files", "Using a VPN or proxy server in the required location, or directly manipulating client-side geolocation mechanisms", "Only by physically relocating to the target geographic region and connecting from a local internet service provider"], "a": 2, "e": "VPNs, proxies, and client-side manipulation make location controls unreliable as the sole access mechanism."}, {"t": "W10. Access Controls", "tp": "multi", "q": "Which are common access control vulnerabilities?", "o": ["Identifier-based functions using predictable sequential IDs with no authorization check on who is accessing the resource", "Completely unprotected functionality that relies on URL obscurity rather than server-side authorization checks", "Multi-stage functions that verify permissions only at the first step and assume later steps were reached legitimately", "Using parameterized database queries with bound parameters to prevent SQL injection in data access operations"], "m": [0, 1, 2], "e": "First three are access control flaws. Parameterized queries defend against SQLi, not an access control vulnerability."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "<code>/admin/updateRole</code> is protected, but <code>/api/user/details?id=####</code> has no role check. What assumption is broken?", "o": ["The only issue is that the API uses GET instead of POST, which exposes parameters in the URL for easier manipulation", "The application assumes that protecting the admin UI means the underlying API endpoints don't need their own authorization", "The application's defense-in-depth strategy correctly separates UI-level and API-level access control responsibilities", "The API endpoint only needs rate limiting to prevent abuse, since it returns non-sensitive user details by design"], "a": 1, "e": "Every endpoint must enforce authorization independently. Users can craft HTTP requests manually, bypassing any UI."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "A 3-step upgrade workflow checks authorization only at Step 1. At Step 3, an attacker changes userId, plan tier, and price to 0. What's being exploited?", "o": ["Multi-stage flaw (no re-validation at each step) combined with horizontal escalation (userId) and business logic exploitation (price=0)", "Only session fixation — the attacker established a known session before the victim started the upgrade workflow", "Only SQL injection — the attacker is modifying query parameters that are concatenated into database operations", "Only CSRF — the attacker submits the modified request from an external page using the victim's authenticated session"], "a": 0, "e": "Multiple combined vulnerabilities. Good session management alone doesn't prevent this — the session IS valid, the problem is trusting client data at later stages."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "An admin action is restricted to POST requests by platform rules. A tester changes the method to GET and the action still executes with a low-privilege account. What was exploited?", "o": ["Session hijacking — changing the HTTP method caused the server to authenticate the request against a different session store", "Cross-site scripting — the GET method reflected the admin action parameters back in the HTML response without sanitization", "SQL injection — the GET method passes parameters via the URL, which are concatenated into unparameterized queries", "Platform misconfiguration — access rules only restricted the POST method, allowing GET/HEAD to bypass authorization entirely"], "a": 3, "e": "Platform rules specified 'POST only for admin paths' but didn't block GET/HEAD/arbitrary methods. Test with POST, GET, HEAD, and arbitrary invalid methods."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "Which of the following is NOT a safe assumption when designing access control?", "o": ["Users may attempt to access application pages and functions in any order, not just the intended workflow sequence", "Users won't discover random-looking administrative URLs because they aren't referenced anywhere in the visible application", "User roles and permissions should be validated server-side on every individual request, not just at login time", "Users may inspect and modify any parameter value that is transmitted from the client to the server in any request"], "a": 1, "e": "URLs appear in JS, browser history, logs, Referer headers. Options B, C, D are things you SHOULD assume and defend against."}, {"t": "W10. Access Controls", "tp": "theory", "q": "Why is 'security by obscurity' insufficient for protecting administrative functionality?", "o": ["It works for randomly generated URLs with sufficient entropy, similar to how unguessable password reset tokens function", "It is actually sufficient when combined with HTTPS, since encrypted URLs cannot be observed by network attackers", "URLs are discoverable through browser history, JavaScript source, server logs, proxy logs, social engineering, and automated scanning", "Security by obscurity only fails against insider threats who have legitimate access to internal documentation and codebases"], "a": 2, "e": "Access control must be enforced server-side regardless of URL visibility. URLs are never secrets."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "An attacker downloads purchased e-books by guessing predictable static file names with sequential ISBNs. What vulnerability is this?", "o": ["Static file exposure — direct requests to static resources bypass application-level access control since no server-side code executes", "Cross-site scripting — the attacker injects JavaScript that automatically downloads files on behalf of other authenticated users", "Referer header manipulation — the attacker forges the Referer to appear as though the request came from the checkout page", "Platform misconfiguration — the web server's file permissions allow directory listing for the download folder"], "a": 0, "e": "Static resources served directly by the web server often skip application-level authorization. Predictable naming (ISBN) = enumerable."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "A user skips the payment step in an online checkout and directly accesses the download page. What type of access control attack is this?", "o": ["Horizontal privilege escalation — the user accessed another customer's purchased content by manipulating the download identifier", "Parameter-based access control bypass — the user modified a URL parameter to change their account role from customer to premium", "Business logic exploitation — the user exploited a flaw in the application's workflow state machine to bypass a required step", "Vertical privilege escalation — the user performed an admin function by accessing the download page without payment authorization"], "a": 2, "e": "Business logic exploitation: bypassing a workflow step, not elevating privileges or accessing others' data. Third category alongside vertical and horizontal escalation."}, {"t": "W10. Access Controls", "tp": "theory", "q": "Why should resource identifiers use random UUIDs instead of sequential integers?", "o": ["Sequential IDs are predictable — an attacker who sees docid=1001 can try 1002, 1003 etc., while random UUIDs cannot be guessed", "UUIDs automatically enforce access control at the database level, eliminating the need for application-side authorization checks", "Sequential integers cause SQL injection vulnerabilities because numeric parameters are not enclosed in single quotes", "UUIDs are shorter than integers and consume less storage space in the database, improving query performance"], "a": 0, "e": "Even with proper access control, predictable IDs make enumeration easy. UUIDs add defense-in-depth."}, {"t": "W10. Access Controls", "tp": "multi", "q": "According to the access control lessons learned, which assumptions should you NEVER make?", "o": ["Users won't know application URLs or the identifiers used for resources, because they aren't displayed in the UI", "Users will always access application pages in the sequence intended by the application's designed workflow", "User-submitted parameters like admin=true or role=manager can be trusted to accurately represent access rights", "Users won't tamper with any data that is transmitted via the client, including hidden form fields and cookies"], "m": [0, 1, 2, 3], "e": "All four are dangerous assumptions explicitly listed in the lessons learned. Don't rely on ignorance, don't trust client data, don't assume order, don't trust untampered data."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "Why are interpreted languages like SQL vulnerable to injection while compiled languages are not directly affected by grammar injection?", "o": ["Compiled languages don't accept any form of user input, while interpreted languages are designed around interactive input", "Compiled languages have superior error handling that automatically sanitizes any user input before processing", "Interpreted languages use older, less-maintained codebases that lack the security features of modern compiled frameworks", "Interpreted languages process code and data together at runtime — concatenated user input can alter the program's grammar and logic"], "a": 3, "e": "SQL injection arises when data is concatenated into queries. The interpreter can't distinguish code from data. Use parameterization to separate them."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "What are the 6 ordered steps for exploiting code injection vulnerabilities?", "o": ["Google → Copy payload → Paste in form → Submit → Download data → Delete logs — automated tool-assisted approach", "Scan → Enumerate → Exploit → Escalate → Persist → Clean up — the standard penetration testing kill chain", "Authenticate → Map application → Fuzz parameters → Dump database → Exfiltrate → Report — the OWASP testing methodology", "Probe → Observe → Hypothesise → Modify input → Prove with safe PoC → Exploit & Report — systematic detection to exploitation"], "a": 3, "e": "Systematic: unexpected syntax → observe anomalies → analyze errors → confirm hypothesis → safe proof-of-concept → full exploitation."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "Given <code>SELECT * FROM users WHERE username='[input]' AND password='foo'</code>, which input logs in as admin?", "o": ["admin — the correct username is submitted, and the server validates the password separately in a different query", "admin' AND 1=2 -- — this tests a false condition against the admin account, returning no rows from the database", "' OR '1'='1' -- — this creates a tautology that returns all rows, logging in as the first user in the table", "admin' -- — the comment removes the password check, so the query only verifies the username matches 'admin'"], "a": 3, "e": "admin' -- → WHERE username='admin' (password check commented out). Option B logs in as the first user, not necessarily admin. Option C returns nothing."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "Instead of using <code>--</code> to comment out trailing SQL, what alternative technique avoids needing a comment at all?", "o": ["Submit the NULL byte character %00 which terminates string processing in most database parsers immediately", "Double-encode the comment as %252d%252d so the server decodes it to -- after the input filter has already passed it through", "Inject ' OR 'a'='a to close the string naturally — the trailing quote from the original query completes the last expression", "Use the CHAR() function to construct the comment characters dynamically, bypassing any character-level filtering"], "a": 2, "e": "John' OR 'a'='a → WHERE lname='John' OR 'a'='a' AND id=100. The quotes balance naturally. Useful when -- or # are filtered."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "Self-registration INSERT: <code>INSERT INTO users (username, password, id, privs) VALUES ('[input]', 'secret', 2248, 1)</code>. Attacker injects <code>foo', 'bar', 9999, 0) --</code>. Result?", "o": ["The database silently ignores the injection because INSERT statements have built-in protection against extra value entries", "The injection fails because the attacker cannot know the correct number of columns without access to the database schema", "A syntax error is returned because the injected closing parenthesis creates an unbalanced expression in the VALUES clause", "A new account is created with id=9999 and privs=0 — if 0 means admin, the attacker has created an administrative user"], "a": 3, "e": "INSERT injection: attacker controls all column values. Must match correct number/types. Try incrementally: foo') --, foo',1) --, foo',1,1) -- etc."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "Password change: <code>UPDATE users SET password='new' WHERE user='[input]' AND password='old'</code>. Attacker enters <code>admin' --</code>. What happens?", "o": ["The database returns a permission denied error because UPDATE operations require elevated database-level privileges", "Only the attacker's own password is changed because the server validates the session user against the username before executing", "The update fails with a syntax error because the comment characters are not valid within an UPDATE statement's WHERE clause", "The admin user's password is changed without knowing the old password — the -- comments out the AND password='old' check"], "a": 3, "e": "Query becomes: UPDATE users SET password='new' WHERE user='admin' -- AND password='old'. Old password check bypassed."}, {"t": "W11. SQL Injection", "tp": "multi", "q": "Which inputs should be tested for SQL injection vulnerabilities?", "o": ["Cookie values that may be passed to database functions for session lookup or user preference storage", "HTTP headers such as User-Agent, Referer, and custom headers that may be logged or processed by the application", "URL parameters in the query string that control page content, filtering, or search behavior", "POST data fields including form inputs, JSON bodies, and multipart form fields submitted to the server"], "m": [0, 1, 2, 3], "e": "ALL data submitted to the server may reach database functions. Must complete multistage processes too — data may only be persisted after all stages."}, {"t": "W11. SQL Injection", "tp": "multi", "q": "Which are valid probing techniques for SQL injection in string input fields?", "o": ["Submit two single quotes ('') and check if the error disappears — databases use '' as the escape for a literal quote", "Submit a single quote (') and observe whether an error or behavioral change occurs in the application's response", "Use database-specific concatenation operators (Oracle: '||'FOO, MSSQL: '+'FOO, MySQL: ' 'FOO) to construct equivalent input", "Submit the SQL wildcard character % in a search field — a large result set confirms the input reaches a SQL query"], "m": [0, 1, 2, 3], "e": "All four are valid. Also: a JavaScript error from an unsanitized quote in the returned page suggests XSS may also be possible."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "For numeric input fields, what is a reliable initial SQL injection probe?", "o": ["Submit a mathematical expression equal to the original value (e.g., 1+1 for 2) — identical response indicates SQL evaluation", "Submit an extremely large integer to trigger a numeric overflow error that reveals the database version information", "Submit the word NULL as the parameter value to test whether the database accepts null values in the query", "Submit a single quote and check for database error messages revealing the query structure and table names"], "a": 0, "e": "Further verify with SQL-specific expressions: 67-ASCII('A')=2, or 51-ASCII(1)=2 (no quotes needed, uses implicit type casting)."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "You submit <code>O'Reilly</code> in a search field and get a database error. What does this indicate and what is your next step?", "o": ["The error is a false positive from the application's input validation — retry with the same input to see if it's consistent", "The database doesn't support Unicode characters like apostrophes — switch to URL-encoded input using %27 instead", "The application has a spelling checker that doesn't recognize the apostrophe in Irish surnames — submit without the apostrophe", "The single quote likely brok
