<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0a0e17;--sf:#111827;--sf2:#1a2236;--bd:#2a3456;--ac:#22d3ee;--ac2:#a78bfa;--ok:#34d399;--no:#f87171;--tx:#e2e8f0;--td:#64748b;--tb:#f8fafc}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(34,211,238,.06),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(167,139,250,.06),transparent 50%);pointer-events:none;z-index:0}.ct{max-width:820px;margin:0 auto;padding:24px 20px;position:relative;z-index:1}.hd{text-align:center;padding:48px 0 32px}.hd h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:900;letter-spacing:-.03em;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}.hd p{color:var(--td);font-size:.95rem;font-weight:300}.mn{font-family:'JetBrains Mono',monospace}.tg{display:grid;grid-template-columns:1fr;gap:12px;margin:24px 0}@media(min-width:600px){.tg{grid-template-columns:1fr 1fr}}.tc{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}.tc::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--ac);opacity:0;transition:opacity .25s}.tc:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 8px 32px rgba(34,211,238,.08)}.tc:hover::before,.tc.sl::before{opacity:1}.tc.sl{border-color:var(--ac);background:rgba(34,211,238,.05)}.tc h3{font-size:.95rem;font-weight:700;color:var(--tb);margin-bottom:4px}.tc>span{font-size:.8rem;color:var(--td);font-weight:300}.tn{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--ac);font-weight:700;margin-bottom:6px;display:block}.bt{font-family:'Outfit',sans-serif;font-weight:700;font-size:.95rem;border:none;border-radius:10px;padding:14px 32px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}.bp{background:linear-gradient(135deg,var(--ac),#06b6d4);color:var(--bg);box-shadow:0 4px 20px rgba(34,211,238,.25)}.bp:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(34,211,238,.35)}.bp:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}.bs{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}.bs:hover{border-color:var(--ac);color:var(--ac)}.bg_{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--bd)}.qp{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--td)}.qt{font-size:.8rem;color:var(--ac);font-weight:500}.pb{width:100%;height:4px;background:var(--sf2);border-radius:4px;margin-bottom:32px;overflow:hidden}.pf{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:4px;transition:width .4s}.qc{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:32px;margin-bottom:20px;animation:fu .4s}@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.qc h2{font-size:1.05rem;font-weight:700;color:var(--tb);line-height:1.6;margin-bottom:24px}.qc code{font-family:'JetBrains Mono',monospace;background:var(--sf2);padding:2px 8px;border-radius:4px;font-size:.85rem;color:var(--ac)}.os{display:flex;flex-direction:column;gap:10px}.op{background:var(--sf2);border:1.5px solid var(--bd);border-radius:10px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:.93rem;line-height:1.5;display:flex;align-items:flex-start;gap:12px}.op:hover:not(.ds){border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.04)}.ol{font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:700;color:var(--td);background:var(--bg);width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}.op.ok{border-color:var(--ok);background:rgba(52,211,153,.08)}.op.ok .ol{color:var(--bg);background:var(--ok)}.op.no{border-color:var(--no);background:rgba(248,113,113,.08)}.op.no .ol{color:var(--bg);background:var(--no)}.op.ds{cursor:default}.op.dm{opacity:.45}.ex{margin-top:20px;padding:16px 20px;background:rgba(34,211,238,.04);border:1px solid rgba(34,211,238,.15);border-radius:10px;font-size:.88rem;line-height:1.65;animation:fu .3s}.ex strong{color:var(--ac)}.rs{text-align:center;animation:fu .5s}.sr{width:180px;height:180px;margin:32px auto;position:relative}.sr svg{width:100%;height:100%;transform:rotate(-90deg)}.sr circle{fill:none;stroke-width:8}.sr .bg2{stroke:var(--sf2)}.sr .fg{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset 1.5s}.st{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}.st .nm{font-size:2.8rem;font-weight:900;color:var(--tb);line-height:1}.st .lb{font-size:.75rem;color:var(--td);margin-top:4px;font-weight:500}.rs h2{font-size:1.5rem;font-weight:900;color:var(--tb);margin-bottom:8px}.gd{font-size:1rem;font-weight:700;padding:6px 16px;border-radius:8px;display:inline-block;margin:12px 0 24px}.gd.a{background:rgba(52,211,153,.12);color:var(--ok)}.gd.b{background:rgba(34,211,238,.12);color:var(--ac)}.gd.c{background:rgba(250,204,21,.12);color:#facc15}.gd.f{background:rgba(248,113,113,.12);color:var(--no)}.tb_{text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:24px;margin:24px 0}.tb_ h3{font-size:.85rem;font-weight:700;color:var(--td);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px}.br{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.br:last-child{border:none}.br span:first-child{font-size:.88rem}.br span:last-child{font-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:700}.cl{display:flex;justify-content:space-between;align-items:center;margin:16px 0 4px;flex-wrap:wrap;gap:8px}.sa{font-size:.82rem;color:var(--ac);cursor:pointer;font-weight:500;background:none;border:none;font-family:'Outfit',sans-serif}.sa:hover{text-decoration:underline}.qn{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--td)}.ms-tag{display:inline-block;font-size:.7rem;font-weight:700;color:var(--ac2);background:rgba(167,139,250,.12);padding:3px 10px;border-radius:6px;margin-left:8px;vertical-align:middle}.sc-tag{display:inline-block;font-size:.7rem;font-weight:700;color:#f472b6;background:rgba(236,72,153,.12);padding:3px 10px;border-radius:6px;margin-left:6px;vertical-align:middle}.th-tag{display:inline-block;font-size:.7rem;font-weight:700;color:#38bdf8;background:rgba(56,189,248,.12);padding:3px 10px;border-radius:6px;margin-left:6px;vertical-align:middle}
.op.sel{border-color:var(--ac2);background:rgba(167,139,250,.08)}.op.sel .ol{color:var(--bg);background:var(--ac2)}
.cb{width:16px;height:16px;border:2px solid var(--bd);border-radius:4px;flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:10px;color:transparent}
.op.sel .cb{border-color:var(--ac2);background:var(--ac2);color:var(--bg)}
.op.ok .cb{border-color:var(--ok);background:var(--ok);color:var(--bg)}
.op.no .cb{border-color:var(--no);background:var(--no);color:var(--bg)}
.op.dm .cb{opacity:.45}
.sub-btn{font-family:'Outfit',sans-serif;font-weight:700;font-size:.9rem;border:none;border-radius:8px;padding:10px 24px;cursor:pointer;background:var(--ac2);color:var(--bg);margin-top:16px;transition:all .2s;box-shadow:0 2px 12px rgba(167,139,250,.25)}.sub-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(167,139,250,.35)}.sub-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
@media(max-width:480px){.qc{padding:20px}.hd{padding:32px 0 20px}.hd h1{font-size:1.4rem}}
</style>

<script>
const Q=[{"t": "W08. Authentication", "tp": "theory", "q": "What is the correct relationship between authentication, session management, and access control?", "o": ["Authentication determines what a user can access; access control verifies identity", "Authentication verifies identity; session management tracks the user across requests; access control determines what they can access", "Session management replaces authentication once a cookie is set", "Access control and authentication are the same thing"], "a": 1, "e": "Authentication = 'who are you?', session management = 'how do I know it\\'s still you?', access control = 'what can you do?'. Three sequential aspects of IAM."}, {"t": "W08. Authentication", "tp": "mcq", "q": "In HTTP Basic authentication, credentials are transmitted as:", "o": ["A hashed digest using MD5", "A Base64-encoded string in the Authorization header", "An encrypted token using AES", "A Kerberos ticket"], "a": 1, "e": "Base64 is encoding, not encryption — HTTPS must be used to protect credentials in transit. The header looks like: Authorization: Basic dXNlcjpwYXNzd29yZA=="}, {"t": "W08. Authentication", "tp": "mcq", "q": "How does HTTP Digest authentication differ from Basic?", "o": ["Digest sends the password in plaintext", "Digest sends a hash digest instead of the plaintext password, using a challenge-response mechanism", "Digest doesn't require any authentication header", "Digest uses symmetric encryption"], "a": 1, "e": "The client sends a hash computed from the password + server nonce. Still pair with HTTPS — hashing alone doesn't provide full transport security."}, {"t": "W08. Authentication", "tp": "mcq", "q": "Which of the following is NOT a valid factor in multi-factor authentication (MFA)?", "o": ["Knowledge (password, PIN)", "Possession (phone, hardware key)", "CAPTCHA", "Biometrics (fingerprint, face)"], "a": 2, "e": "CAPTCHA checks human-ness, not identity. Password + PIN is also NOT MFA since both are knowledge factors."}, {"t": "W08. Authentication", "tp": "theory", "q": "What advantage do client certificates / smartcards have over username+password?", "o": ["They are easier to deploy", "They enable strong cryptographic authentication via PKI, support mutual authentication, and reduce phishing risk since the private key never leaves the device", "They eliminate the need for session management", "They are free to implement"], "a": 1, "e": "Client certs use PKI for cryptographic auth. Smartcards add a second factor (possession + PIN = MFA). Trade-off: usability and certificate lifecycle management."}, {"t": "W08. Authentication", "tp": "theory", "q": "In the Kerberos authentication flow, what are the three steps?", "o": ["Login → Encrypt → Decrypt", "Client proves identity to AS → gets TGT; presents TGT to TGS → gets Service Ticket; presents Service Ticket to Service → access", "Client sends password to server → server verifies → access granted", "Client requests cert → CA issues cert → client presents cert"], "a": 1, "e": "Kerberos uses a KDC (AS + TGS). Passwords are never sent over the network — only tickets and session keys. Tickets are time-limited to reduce replay risk."}, {"t": "W08. Authentication", "tp": "multi", "q": "Which are common design flaws in authentication mechanisms?", "o": ["Verbose failure messages enabling username enumeration", "Unlimited login attempts without lockout", "Using HTTPS for credential transmission", "Insecure 'Remember me' tokens with predictable values"], "m": [0, 1, 3], "e": "HTTPS is a secure practice, not a flaw. The other three are well-known authentication design flaws."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A login page returns 'Username not found' for invalid usernames and 'Incorrect password' for wrong passwords. What is the primary vulnerability?", "o": ["SQL injection", "Verbose failure messages — enables username enumeration before brute-forcing", "Weak password policy", "TLS misconfiguration"], "a": 1, "e": "Different errors let attackers identify valid accounts. Even if the page looks identical, HTML source comments or response timing may differ. Return generic 'Login failed'."}, {"t": "W08. Authentication", "tp": "scenario", "q": "After 200 failed login attempts, the app still responds normally. What attack does this enable?", "o": ["Cross-site scripting", "Brute-force / credential stuffing — mitigate with lockout, rate limiting, MFA", "Session fixation", "SQL injection"], "a": 1, "e": "No lockout + no rate limiting = unlimited attempts. Enables brute-force and credential stuffing (reused passwords from other breaches)."}, {"t": "W08. Authentication", "tp": "scenario", "q": "An app uses client-side cookies to count failed login attempts. Why is this flawed?", "o": ["Cookies are always encrypted so this is secure", "Attackers can obtain a new cookie for each login attempt, resetting the counter and bypassing lockout", "Client-side cookies are faster than server-side counters", "This is the recommended approach"], "a": 1, "e": "Client-side counters are trivially bypassable — just clear or replace the cookie. Lockout counters must be enforced server-side."}, {"t": "W08. Authentication", "tp": "mcq", "q": "Why should a breadth-first approach be used in brute-force attacks (user1-pass1, user2-pass1, ...)?", "o": ["It's faster computationally", "It avoids triggering per-account lockout by spreading attempts across many accounts before trying a second password", "It's required by Burp Suite", "It only works on HTTP Basic auth"], "a": 1, "e": "Breadth-first distributes attempts: try one password against all usernames before moving to the next password. This avoids triggering per-account lockout thresholds."}, {"t": "W08. Authentication", "tp": "multi", "q": "Credentials should NEVER be sent via which of the following channels?", "o": ["Plain HTTP (no TLS)", "URL query parameters (logged everywhere)", "Cookies (never store actual passwords in cookies)", "POST body over HTTPS"], "m": [0, 1, 2], "e": "POST over HTTPS is the correct method. Plain HTTP = sniffable. URL params = logged in browser history, server logs, proxy logs. Passwords in cookies = stolen via XSS/CSRF."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A password change page checks the new password strength but does NOT verify the old password. Which flaw category is this?", "o": ["Credential validation quirk", "Incomplete validation of credentials — a required check (old password) is missing entirely", "Brute-forcible login", "Verbose failure messages"], "a": 1, "e": "Incomplete validation: a check is missing. An attacker who has session access (e.g., via XSS) can change the password without knowing the original one."}, {"t": "W08. Authentication", "tp": "multi", "q": "Which are common weaknesses in forgotten password functionality?", "o": ["Guessable security questions that users set themselves", "Password hints that essentially reveal the password", "Emailing actual passwords in plaintext", "Requiring email verification with a time-limited token"], "m": [0, 1, 2], "e": "Email verification with time-limited tokens is a secure practice. The other three are well-known weaknesses in password reset flows."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A 'Remember me' cookie contains <code>RememberUser=bob</code>. What is the flaw?", "o": ["No flaw — this is standard", "Predictable/meaningful remember-me token — an attacker can change 'bob' to any username to impersonate them", "It should use Digest auth instead", "The cookie should be longer"], "a": 1, "e": "Persistent cookies become 'password equivalents'. If the value is just a username, anyone can forge it. Use random, rotating, server-stored tokens with expiry instead."}, {"t": "W08. Authentication", "tp": "theory", "q": "What distinguishes 'incomplete validation' from a 'credential validation quirk'?", "o": ["They are the same thing", "Incomplete = a check is missing (skip password verify); Quirk = check exists but is wrong (case-insensitive passwords)", "A quirk is always more severe", "Incomplete only applies to multi-stage logins"], "a": 1, "e": "Incomplete: skip steps (bypass). Quirk: craft variant credentials (collisions). The slides give examples: (a) accepting any password = incomplete; (b) truncating to 10 chars = quirk."}, {"t": "W08. Authentication", "tp": "scenario", "q": "An application generates usernames like EMP001, EMP002, EMP003. What risk does this create?", "o": ["No risk — sequential names are easier to remember", "Predictable usernames make enumeration trivial, enabling targeted brute-force attacks against known accounts", "The names are too short", "Only internal users are affected"], "a": 1, "e": "Predictable username patterns let attackers enumerate all accounts. Similarly, predictable initial passwords (e.g., same temp password) make brute-force trivial."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A web app stores passwords as unsalted MD5 hashes. What specific attack is this vulnerable to?", "o": ["Brute-force only — use SHA-256", "Rainbow table attacks — use bcrypt/Argon2 with unique salts", "Phishing", "Replay attacks"], "a": 1, "e": "Unsalted MD5 = precomputed rainbow tables. LinkedIn 2012: 110M unsalted hashes cracked. Ubuntu Forums 2013: MD5 + SQLi. Fix: slow hash + unique salt."}, {"t": "W08. Authentication", "tp": "mcq", "q": "Non-unique hashes in a password database indicate:", "o": ["The database has been compromised", "Passwords are properly encrypted", "Common passwords are being used OR hashes are not salted (or both)", "The application uses MFA"], "a": 2, "e": "If two users have the same hash, either they chose the same password or the hashing lacks unique salts. Both are problems."}, {"t": "W08. Authentication", "tp": "scenario", "q": "Multi-stage login (Stage 1: password, Stage 2: OTP). Attacker replays Stage 2 with a different username in a hidden field. What vulnerability?", "o": ["Session fixation", "Logic flaw — the app trusts that the same identity completes every stage, but doesn't re-verify; attacker can swap identity mid-flow", "Weak OTP", "CSRF"], "a": 1, "e": "Common bad assumptions: Stage 2 implies Stage 1 passed; Stage 2 trusts data from Stage 1; same user completes all stages. Test by skipping/reordering stages and changing repeated fields."}, {"t": "W09. Session Management", "tp": "theory", "q": "Why is session management necessary even though HTTP is stateless?", "o": ["HTTP cannot transmit cookies without it", "Apps need to identify requests from the same user across requests to avoid re-authenticating every time", "Only needed for shopping carts", "Regulatory requirement"], "a": 1, "e": "HTTP is stateless. Session tokens let the server associate multiple requests with the same authenticated user."}, {"t": "W09. Session Management", "tp": "theory", "q": "'We use smartcards for authentication, so sessions can't be compromised without them.' Why is this a misconception?", "o": ["Smartcards don't work with web apps", "Authentication is NOT session management — a flawed session implementation allows attackers to bypass even robust authentication", "Smartcards expire too quickly", "This is actually correct"], "a": 1, "e": "Even with strong auth (smartcards, MFA), if session tokens are predictable, stealable, or don't expire, attackers bypass the auth entirely."}, {"t": "W09. Session Management", "tp": "mcq", "q": "Which cookie attributes help protect session tokens? <code>HttpOnly</code> prevents ____ and <code>SameSite</code> prevents ____.", "o": ["XSS cookie theft; CSRF attacks", "SQL injection; brute force", "Encryption; hashing", "Replay; timing attacks"], "a": 0, "e": "HttpOnly: JavaScript cannot access the cookie → blocks XSS cookie theft. SameSite: limits cross-origin cookie sending → mitigates CSRF."}, {"t": "W09. Session Management", "tp": "mcq", "q": "You decode a hex session token to: <code>user=daf;app=admin;date=01/12/11</code>. Primary vulnerability?", "o": ["Weak RNG", "Meaningful / structured token — attacker can decode and forge it", "Encrypted token without integrity", "Session fixation"], "a": 1, "e": "Contains structured user data merely hex-encoded. Common encoding: hex, Base64, XOR — none of these are encryption."}, {"t": "W09. Session Management", "tp": "scenario", "q": "Base64-encoded tokens from consecutive logins, when decoded to hex, show a constant difference between successive values. What kind of predictable token is this?", "o": ["Time-dependent token", "Concealed sequence — a hidden arithmetic pattern (constant increment) under encoding", "Meaningful token", "Encrypted token"], "a": 1, "e": "The slides show: decode Base64 → hex → subtract consecutive values → constant pattern. Attacker adds the increment to predict next token."}, {"t": "W09. Session Management", "tp": "scenario", "q": "Tokens are: <code>3124538-1172764258718</code>, <code>3124539-1172764259062</code>, etc. First number increments by 1. What about the second?", "o": ["Also sequential", "It appears to be time-related — differences vary but are small, suggesting timestamps that could be brute-forced", "Completely random", "An encrypted counter"], "a": 1, "e": "First number: sequential counter. Second number: time-related (differences of 344, 219, 453...). Capture more tokens minutes later to verify. Attacker can narrow the search space."}, {"t": "W09. Session Management", "tp": "multi", "q": "Which are common weak RNG mistakes for token generation?", "o": ["JavaScript's Math.random()", "PHP's mt_rand()", "Java's java.util.Random", "Python's secrets.token_hex()"], "m": [0, 1, 2], "e": "Math.random(), mt_rand(), and java.util.Random are NOT cryptographically secure. Python's secrets module IS secure (CSPRNG). Use Burp Sequencer to test randomness quality."}, {"t": "W09. Session Management", "tp": "multi", "q": "What are the three categories of weaknesses in session token generation?", "o": ["Meaningful tokens (decodable user data)", "Predictable tokens (sequential, time-dependent, weak RNG)", "Encrypted tokens (ECB block swap, CBC bit-flip)", "Tokens that are too long"], "m": [0, 1, 2], "e": "(1) Meaningful = decodable & forgeable. (2) Predictable = guessable. (3) Encrypted = manipulable ciphertext. Length alone isn't a vulnerability."}, {"t": "W09. Session Management", "tp": "mcq", "q": "In ECB-encrypted tokens, swapping ciphertext block 4 (containing uid=219) with block 6 (containing e=daf1) can change the uid to 1. Why does this work?", "o": ["ECB uses chaining that allows controlled changes", "ECB encrypts each block independently with no chaining or tamper detection — identical plaintext → identical ciphertext, and blocks can be swapped freely", "The encryption key is weak", "The token isn't actually encrypted"], "a": 1, "e": "No signature, no chaining, no integrity check. Each block decrypts independently. The '1' character happens to be at the byte position where the UID digit goes."}, {"t": "W09. Session Management", "tp": "scenario", "q": "In a CBC-encrypted token, an attacker wants to change 'uid=216' to 'uid=001'. How?", "o": ["Swap blocks like in ECB", "Flip specific bits in the previous ciphertext block — CBC XORs each plaintext with previous ciphertext, so bit flips propagate predictably to the next block's plaintext", "Brute-force the encryption key", "Change the IV to 001"], "a": 1, "e": "CBC bit-flipping: flipping bits in ciphertext block N causes predictable bit flips in plaintext block N+1 (but garbage in block N). Harder than ECB but feasible with trial-and-error."}, {"t": "W09. Session Management", "tp": "scenario", "q": "App sets cookies with <code>Domain=.example.com</code>. Main app at <code>app.example.com</code>. Why dangerous?", "o": ["Makes cookies invisible", "Any subdomain receives the session cookie — compromise any subdomain → steal the token", "Prevents HttpOnly", "Forces HTTP"], "a": 1, "e": "Domain=.example.com → cookie sent to ALL subdomains. Set Domain=app.example.com explicitly to limit scope."}, {"t": "W09. Session Management", "tp": "theory", "q": "What makes a session token 'good' security-wise?", "o": ["Should contain user role for efficiency", "Should encode session state", "Maximum entropy — not meaningful, unpredictable, CSPRNG-generated", "Based on IP and timestamp"], "a": 2, "e": "Good token: no embedded data, no patterns, CSPRNG. Token = opaque identifier only; all state stays server-side."}, {"t": "W09. Session Management", "tp": "scenario", "q": "App issues a token before login. After login, same token persists. What attack?", "o": ["SQLi", "XSS", "Session fixation — attacker pre-sets the victim's session ID, victim logs in, attacker uses the now-authenticated token", "Brute-force"], "a": 2, "e": "Fix: always issue a new token on successful login."}, {"t": "W09. Session Management", "tp": "scenario", "q": "A logout function only runs a client-side script that clears the cookie. The server never invalidates the token. What's the problem?", "o": ["No problem — cookie is cleared", "The token remains valid server-side — an attacker who captured it can still use it after 'logout'", "Client-side logout is more secure", "The cookie will expire naturally"], "a": 1, "e": "Session termination must be server-side. Client-side cookie clearing is trivially bypassed — the captured token continues to work. Also implement server-side timeouts."}, {"t": "W09. Session Management", "tp": "multi", "q": "Which attacks exploit client exposure to token hijacking?", "o": ["XSS — JavaScript reads cookies and sends them to attacker's server", "Session fixation — attacker feeds a known token to the victim", "CSRF — browser automatically sends cookies with cross-site requests", "SQL injection"], "m": [0, 1, 2], "e": "XSS steals tokens (blocked by HttpOnly). Session fixation pre-sets tokens. CSRF exploits auto-sent cookies. SQLi is a data store attack, not session hijacking."}, {"t": "W09. Session Management", "tp": "mcq", "q": "If a site issues the SAME session token every login, what becomes trivial?", "o": ["SQLi", "Permanent session hijacking — steal once, use forever", "DNS poisoning", "Buffer overflow"], "a": 1, "e": "Static tokens never change. Stolen once = hijacked forever."}, {"t": "W09. Session Management", "tp": "scenario", "q": "Consecutive tokens: <code>...B8F1</code>, <code>...B8F2</code>, <code>...B8F5</code>. What attack?", "o": ["CSRF", "Token guessing via sequence prediction", "Session fixation", "CBC bit-flipping"], "a": 1, "e": "Identical prefixes, incrementing suffixes → predictable."}, {"t": "W09. Session Management", "tp": "mcq", "q": "What enables token disclosure on the network even when the app 'uses TLS'?", "o": ["HttpOnly cookies", "Token in URL query parameters — logged in browser history, server logs, proxy logs, Referer header", "SameSite=None", "Short timeout"], "a": 1, "e": "URL tokens are visible/logged everywhere. TLS doesn't prevent logging."}, {"t": "W10. Access Controls", "tp": "theory", "q": "What is the difference between vertical, horizontal, and context-dependent access control?", "o": ["They are all the same", "Vertical = different user types access different functions; Horizontal = users access subsets of same-type resources; Context-dependent = access restricted by application state (e.g., can't skip checkout steps)", "Vertical = more data; Horizontal = more functions; Context = time-based", "They only apply to admin panels"], "a": 1, "e": "Context-dependent example: user cannot access multistage functionality out of order (e.g., must complete payment before downloading)."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "According to the slides, what is the OWASP Top 10 #1 vulnerability for 2025?", "o": ["SQL Injection", "Cross-Site Scripting", "Broken Access Control", "Cryptographic Failures"], "a": 2, "e": "Flawed access control can lead to full application compromise — attacker controls admin functions or accesses others' sensitive data. Example: Optus 2023 breach via IDOR."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "An app checks <code>admin=true</code> in the URL for admin access. This is:", "o": ["Secure RBAC", "Parameter-based access control (insecure)", "Vertical privilege enforcement", "Business logic enforcement"], "a": 1, "e": "Client-controlled parameters are trivially modified. Never trust client data for access decisions."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "Which best describes an IDOR vulnerability?", "o": ["User logs in without password", "User guesses admin URLs", "User accesses another user's resource by manipulating identifiers in the request", "User bypasses HTTPS"], "a": 2, "e": "IDOR: app exposes object references (DB IDs) without verifying authorization. Use random UUIDs, not sequential IDs."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "Student finds <code>/admin/manageUsers</code> in a JS file. Can access it without being admin. What vulnerability?", "o": ["XSS", "Completely unprotected functionality — relying on URL obscurity, no server-side access control", "SQLi", "Session flaw"], "a": 1, "e": "JS contained: if(isAdmin){ adminMenu.addItem('/menus/secure/ff457/addNewPortalUser2.jsp') }. URLs are discoverable — enforce server-side auth."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "A bank transfer has 3 stages: select account → enter payee → enter auth code. At stage 3, attacker modifies the source account number. What happened?", "o": ["SQLi", "Horizontal privilege escalation via multistage function — app didn't revalidate the source account at each stage", "Session fixation", "CSRF"], "a": 1, "e": "The app assumed that data from stage 1 was trustworthy at stage 3. Re-validate ALL data at EVERY step."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "Why is the HTTP Referer header broken for access control?", "o": ["It's encrypted", "It's a client-supplied header freely modifiable via proxy", "Only in POST requests", "Browser validates it"], "a": 1, "e": "Not a secure proof of origin. Example: app checks if request was 'referred from' the admin menu page — attacker just sets the Referer header."}, {"t": "W10. Access Controls", "tp": "theory", "q": "How can location-based access controls be circumvented?", "o": ["They cannot be circumvented", "Using a VPN or web proxy in the required location, or manipulating client-side geolocation", "Only by physical relocation", "Only with admin access"], "a": 1, "e": "Attackers use VPNs, proxies, or direct client-side manipulation to appear from the required geographic location."}, {"t": "W10. Access Controls", "tp": "multi", "q": "Which are common access control vulnerabilities?", "o": ["Unprotected functionality", "Identifier-based functions with predictable IDs, no auth check", "Multi-stage functions checking permissions only at step 1", "Using parameterized queries"], "m": [0, 1, 2], "e": "First three are access control flaws. Parameterized queries defend against SQLi."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "Admin action uses POST. Tester changes the HTTP method to GET and the action still works with a low-privilege account. What was exploited?", "o": ["SQLi", "Platform misconfiguration — access rules only restricted POST method, not GET; attacker bypassed by changing HTTP method", "Session hijacking", "XSS"], "a": 1, "e": "Platform rules specified 'POST only for admin paths' but didn't block GET/HEAD. Test with different HTTP methods including arbitrary invalid ones."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "<code>/api/user/details?id=####</code> has no role check. Normal users call it directly. Broken assumption?", "o": ["API needs rate limiting", "App assumes protecting the admin UI means API endpoints don't need authorization", "GET vs POST issue", "Defense in depth is correct"], "a": 1, "e": "Every endpoint must enforce authorization independently, regardless of UI visibility."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "3-step upgrade: auth only at Step 1. Attacker changes userId, plan, price=0 at Step 3. Vulnerabilities?", "o": ["Only SQLi", "Multi-stage flaw + horizontal escalation + business logic exploitation", "Only session fixation", "Only CSRF"], "a": 1, "e": "Combined: no re-validation, user ID manipulation, price tampering."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "Which is NOT a safe assumption when designing access control?", "o": ["Users won't guess random-looking URLs", "Users may modify any parameter sent through the client", "Users can access pages out of intended sequence", "User roles should be validated on every request"], "a": 0, "e": "URLs are not secrets. B, C, D are all things you SHOULD assume (and defend against)."}, {"t": "W10. Access Controls", "tp": "theory", "q": "Why is 'security by obscurity' insufficient?", "o": ["Works if URL is random enough", "URLs appear in history, logs, JS, and are discoverable via scanning", "Only fails against insiders", "Sufficient with HTTPS"], "a": 1, "e": "Access control must be server-side enforcement regardless of URL visibility."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "Attacker downloads e-books by guessing sequential ISBN file URLs. Vulnerability?", "o": ["Platform misconfiguration", "Referer manipulation", "Static file exposure — direct requests bypass app-level access control", "XSS"], "a": 2, "e": "Static resources often served without app-level auth. Predictable naming = enumerable."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "Why are interpreted languages (SQL) vulnerable to injection?", "o": ["Better error handling in compiled", "Interpreted languages process code+data at runtime — concatenated user input alters program grammar", "Compiled don't accept input", "Interpreted are older"], "a": 1, "e": "SQLi arises when data is concatenated into queries. Use parameterization to separate code from data."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "What are the 6 steps for exploiting code injection vulnerabilities?", "o": ["Scan → Exploit → Report", "Probe → Observe → Hypothesise → Modify input → Prove (safe PoC) → Exploit & Report", "Login → Enumerate → Dump → Delete → Cover tracks → Exit", "Google → Copy → Paste → Submit → Profit → Repeat"], "a": 1, "e": "Systematic methodology: unexpected syntax → anomalies → error analysis → confirm → safe PoC → full exploit."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "Given <code>SELECT * FROM users WHERE username='[input]' AND password='foo'</code>, which logs in as admin?", "o": ["admin", "admin' --", "admin' AND 1=2 --", "' OR '1'='1' --"], "a": 1, "e": "admin' -- comments out password check. Option D logs in as first user, not necessarily admin. Option C returns no rows."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "Instead of using <code>--</code> to comment out the rest of a query, what alternative technique can balance the quotes?", "o": ["Use /* */ block comments only", "Inject ' OR 'a'='a to close the string and create a tautology without needing a comment", "Use the DELETE statement", "Submit an empty string"], "a": 1, "e": "John' OR 'a'='a closes the trailing quote naturally: WHERE lname='John' OR 'a'='a' AND id=100. This bypasses without removing the AND clause."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "An app allows self-registration. The INSERT is: <code>INSERT INTO users (username, password, id, privs) VALUES ('[input]', 'secret', 2248, 1)</code>. Attacker injects <code>foo', 'bar', 9999, 0) --</code> as username. What happens?", "o": ["Syntax error", "A new account is created with id=9999 and privs=0, potentially giving admin privileges", "The database crashes", "Nothing — INSERT is not injectable"], "a": 1, "e": "INSERT injection: attacker controls all column values. If privs=0 means admin, they've created an admin account. Must know/guess the number of columns."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "A password change query is: <code>UPDATE users SET password='new' WHERE user='[input]' AND password='old'</code>. Attacker enters <code>admin' --</code> as username. What happens?", "o": ["Nothing — UPDATE is safe", "The admin user's password is changed without knowing the old password, because -- comments out the AND clause", "The database returns an error", "Only the attacker's password changes"], "a": 1, "e": "Query becomes: UPDATE users SET password='new' WHERE user='admin' -- AND password='old'. The old password check is bypassed."}, {"t": "W11. SQL Injection", "tp": "multi", "q": "Which inputs should be probed for SQLi? (According to the slides)", "o": ["URL parameters", "Cookies", "POST data", "HTTP headers"], "m": [0, 1, 2, 3], "e": "ALL data submitted to the server may reach database functions. URL params, cookies, POST data, and HTTP headers all need testing."}, {"t": "W11. SQL Injection", "tp": "multi", "q": "Valid techniques for probing SQLi in string data?", "o": ["Submit single quote (') and observe errors", "Submit '' to check if error disappears", "Use DB-specific concatenation (e.g., '||'FOO for Oracle, '+'FOO for MSSQL)", "Submit % wildcard to confirm DB interaction"], "m": [0, 1, 2, 3], "e": "All four are valid. % wildcard confirms the input reaches a SQL query (often returns many results in search fields). Also watch for JavaScript errors from unsanitized quotes → potential XSS."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "For numeric SQLi, what is a reliable initial probe?", "o": ["Submit a single quote", "Submit math equal to original (e.g., 1+1 for 2) and check identical response", "Submit NULL", "Submit huge number"], "a": 1, "e": "Further verify with SQL-specific expressions: 67-ASCII('A') = 2, or 51-ASCII(1) = 2 (no quotes needed)."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "What is the most common injection point within SQL query structure (not data)?", "o": ["The SELECT clause", "The WHERE clause", "The ORDER BY clause — users often control sorting, and no escaping is needed since it's not in a data context", "The FROM clause"], "a": 2, "e": "Detect by: supplying numeric values (1, 2, 3...) and checking if result ordering changes. If number > column count → error. Confirm with: 1 ASC -- or 1 DESC --."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "What must be true for UNION-based SQLi to succeed?", "o": ["Any columns work", "Both SELECTs must have same column count, compatible types, same order", "Only MySQL", "Must know admin password"], "a": 1, "e": "Attacker also needs table/column names. The app may not display all returned columns."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "'NULL ladder' in UNION attacks means:", "o": ["NULL as username", "Progressively adding NULL columns to UNION SELECT until query succeeds", "Set all columns to NULL", "NULL to delete"], "a": 1, "e": "NULL converts to any type. Then replace each NULL with 'a' to find string-compatible columns."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "Vulnerable search, 3 columns (first 2 text). Want all table/column names. Payload?", "o": ["' DROP TABLE information_schema --", "' UNION SELECT table_name, column_name, NULL FROM information_schema.columns --", "' OR 1=1 --", "' UNION SELECT @@version, NULL, NULL --"], "a": 1, "e": "information_schema.columns has all metadata. @@version extracts DB version — useful but not schema enumeration."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "When extracting multiple columns from a target table, you can concatenate them into a single column. The Oracle syntax is:", "o": ["CONCAT(a,b)", "a||':'||b", "a+':'+b", "a ' ' b"], "a": 1, "e": "Oracle: ||, MS-SQL: +, MySQL: CONCAT(). Concatenation means you only need to find one varchar column in the original query."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "URL-encoding: to submit the payload <code>1+1</code> as a numeric test, you must encode it as:", "o": ["1+1 (no encoding needed)", "1%2b1 (because + encodes as space in URLs)", "1%201", "1&1"], "a": 1, "e": "+ means space in URL encoding. Literal + must be %2b. Also: & → %26, = → %3d, ; → %3b, space → + or %20."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "What is second-order SQL injection?", "o": ["Same as regular SQLi done twice", "Data safely escaped on INSERT, but when later retrieved and used in a new query without parameterization, stored payload triggers injection", "Only on second-gen databases", "Requires two attackers"], "a": 1, "e": "The DB stores actual characters (including quotes). The second query trusts 'data from our own database'."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "App returns only numeric employee IDs. SQLi confirmed. How extract admin password char by char?", "o": ["UNION with text columns", "ASCII() + SUBSTRING() to convert each character to numeric ASCII, one per query", "Time delays for whole password", "Can't extract strings"], "a": 1, "e": "E.g., ' UNION SELECT ASCII(SUBSTRING(password,1,1)),NULL,NULL FROM users WHERE username='admin' # returns 113 = 'q'."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "What is blind SQLi using conditional responses?", "o": ["Can't see DB at all", "Attacker infers data by observing different behavior for true vs false conditions", "Only against blind users", "DB has no logging"], "a": 1, "e": "E.g., admin' AND ASCII(SUBSTRING(password,1,1))=113 # — success = true."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "To check if username 'alice' exists using conditional errors, an attacker injects: <code>SELECT 1/0 FROM dual WHERE (SELECT username FROM users WHERE username='alice')='alice'</code>. If a database error occurs, what does it mean?", "o": ["The table doesn't exist", "Alice IS a valid username — the WHERE matched, so 1/0 was evaluated, causing a division-by-zero error", "Alice doesn't exist", "The query is invalid"], "a": 1, "e": "If alice doesn't exist, the WHERE returns no rows, so 1/0 is never evaluated → no error. Error = alice exists. dual is a dummy table in most DBMSs."}, {"t": "W12. SQLi Advanced", "tp": "mcq", "q": "When conditional responses show no difference, what technique works?", "o": ["Give up", "Time-based blind injection — inject delays (BENCHMARK, SLEEP) contingent on conditions", "XSS instead", "Modify server code"], "a": 1, "e": "BENCHMARK(5000000,SHA1('x')) causes measurable delay when condition is true."}, {"t": "W12. SQLi Advanced", "tp": "multi", "q": "Which are ways to bypass naïve keyword filters (e.g., blocking SELECT)?", "o": ["Case variations: SeLeCt", "Double-word: SELSELECTECT (filter removes inner SELECT, leaving SELECT)", "URL encoding: %53%45%4c%45%43%54", "Use parameterized queries"], "m": [0, 1, 2], "e": "Also: %00SELECT (null byte), inline comments: SELECT/*foo*/username. Parameterized queries are a defense, not a bypass."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "A filter blocks the comment symbol <code>--</code>. How can an attacker still bypass a trailing quote?", "o": ["Use ' OR 'a'='a to balance the quotes without needing a comment", "Give up", "Use XSS instead", "Delete the filter file"], "a": 0, "e": "Balancing quotes: lname='John' OR 'a'='a' closes the string naturally. Also can use # (MySQL) or inline comments /**/. Blocked characters can also be replaced via CHAR() function."}, {"t": "W12. SQLi Advanced", "tp": "multi", "q": "Effective methods for preventing SQL injection?", "o": ["Blacklist validation", "Parameterized queries (prepared statements)", "Stored procedures with typed parameters", "Escaping single quotes"], "m": [1, 2], "e": "Parameterized: template + data separate. Stored procs: typed params. But stored procs that concatenate input are STILL vulnerable. Most modern frameworks enforce parameterization by default."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "Dev escapes quotes. User registers as <code>admin'--</code>. INSERT works. Password change reads username into new query. What happens?", "o": ["Nothing", "Second-order SQLi — DB stores literal admin'--, breaks password change query", "DB rejects username", "Syntax error only"], "a": 1, "e": "INSERT: admin''-- → stored as admin'--. Password change: WHERE username='admin'-- → quote breaks out, -- comments rest."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "Search field: <code>O'Reilly</code> causes DB error. <code>O''Reilly</code> error disappears. Conclusion?", "o": ["Spelling checker", "Likely SQLi — single quote broke syntax, double was escape. Verify with concatenation.", "App handled it correctly", "Coincidence"], "a": 1, "e": "'' is SQL escape for literal quote. Verify with DB-specific concatenation operators."}, {"t": "W12. SQLi Advanced", "tp": "mcq", "q": "What is the most popular automated SQL exploitation tool?", "o": ["Nmap", "sqlmap — brute-forces parameters, tries UNION/boolean/time-based techniques, supports all major DBMSs", "Wireshark", "Metasploit"], "a": 1, "e": "sqlmap: --forms (HTML forms), --banner (DBMS version), --dbs (enumerate databases), --tables (enumerate tables), --dump (extract data). Can even open OS shells."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "Why do stored procedures NOT guarantee safety against SQLi?", "o": ["They are always safe", "If a stored procedure internally concatenates user input into dynamic SQL, it's still vulnerable", "They don't support parameters", "They only work on Oracle"], "a": 1, "e": "Stored procedures prevent SQLi only if they use parameterized inputs. Never build SQL with user strings inside procedures."}, {"t": "W08. Authentication", "tp": "multi", "q": "For HTML form-based authentication, which defenses should be in place?", "o": ["HTTPS (TLS) to protect credentials in transit", "Slow hashing (bcrypt/Argon2) + salt for password storage", "Rate limiting + CAPTCHA + account lockout against automation", "CSRF tokens for login flows"], "m": [0, 1, 2, 3], "e": "All four are listed in the slides as required defenses for form-based auth. CSRF tokens prevent attackers from submitting login forms on behalf of victims."}, {"t": "W08. Authentication", "tp": "scenario", "q": "During a password-guessing attack, you notice that one specific password works for multiple different usernames. What might this indicate?", "o": ["A coincidence", "A backdoor password that was deliberately planted by a developer or attacker", "Strong password policy", "All users chose the same password independently"], "a": 1, "e": "When carrying out password-guessing, check whether a specific password matches several usernames — this could indicate a backdoor password."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A system stores only the first 10 characters of passwords. Both 'Security12345!' and 'Security99999!' authenticate the same user. Is this incomplete validation or a validation quirk?", "o": ["Incomplete validation — a check is missing", "Validation quirk — the check exists but truncates passwords, causing collisions between different passwords", "Neither — this is correct behavior", "Both"], "a": 1, "e": "The check runs but is wrong (truncation). Incomplete validation would be skipping the password check entirely. Quirk = check exists but is implemented incorrectly."}, {"t": "W08. Authentication", "tp": "scenario", "q": "You register several new accounts and notice activation URLs follow a pattern: <code>/activate?token=1001</code>, <code>/activate?token=1002</code>, <code>/activate?token=1003</code>. What is the risk?", "o": ["No risk — tokens are unique", "Predictable activation tokens — attacker can activate other users' accounts or create accounts with arbitrary tokens", "The tokens are properly encrypted", "This is standard practice"], "a": 1, "e": "Register multiple accounts in succession and look for patterns. Also test if activation URLs can be reused after expiration."}, {"t": "W08. Authentication", "tp": "scenario", "q": "In the Okta 2023 incident, attackers accessed HAR (HTTP Archive) files from the support system. Why was this dangerous?", "o": ["HAR files contain source code", "HAR files can contain session tokens and cookies, enabling account impersonation without credentials", "HAR files contain encryption keys", "HAR files are always encrypted"], "a": 1, "e": "Lesson: treat logs and diagnostic uploads as sensitive data. Sanitize HAR files before sharing, revoke tokens, and use phishing-resistant MFA for admin accounts."}, {"t": "W08. Authentication", "tp": "scenario", "q": "In the SEC X account SIM-swap incident (2024), attackers took control of the phone number to reset the password. What is the key lesson?", "o": ["SMS is the most secure MFA method", "Avoid SMS-based recovery for high-value accounts — prefer phishing-resistant MFA like FIDO2/security keys, since phone-number recovery is a single point of failure", "SIM cards cannot be swapped", "Only government accounts are at risk"], "a": 1, "e": "SIM-swap = attacker convinces carrier to transfer the victim's number. SMS-based MFA/recovery then becomes the weakest link."}, {"t": "W08. Authentication", "tp": "theory", "q": "Hashing and encryption are often confused. What is the key difference relevant to password storage?", "o": ["They are the same thing", "Hashing is one-way (cannot recover the original); encryption is reversible with a key. Passwords should be hashed, not encrypted.", "Encryption is one-way; hashing is reversible", "Hashing requires a key; encryption does not"], "a": 1, "e": "If passwords are encrypted, anyone with the key can recover all passwords. Hashing is one-way — even the system can't recover the original, only verify by re-hashing input."}, {"t": "W08. Authentication", "tp": "multi", "q": "Which are part of the defender checklist for secure authentication?", "o": ["Enforce strong, unique credentials (prefer passphrases)", "Protect credentials in transit (TLS) and at rest (slow hashes)", "Prevent automation (rate limit, lockout, MFA, monitoring)", "Reveal detailed error information to help users debug login failures"], "m": [0, 1, 2], "e": "Detailed errors help attackers, not users. The checklist also includes: generic errors, consistent responses, harden reset/change/remember-me flows, and log/monitor/alert."}, {"t": "W09. Session Management", "tp": "mcq", "q": "What tool can be used to test the quality of randomness in session tokens?", "o": ["Nmap", "Burp Sequencer — configure the token location, start a live capture, and enable auto-analysis", "Wireshark", "sqlmap"], "a": 1, "e": "If tokens fail the Burp Sequencer randomness test, try to identify the underlying algorithm and write a script to generate candidate tokens."}, {"t": "W09. Session Management", "tp": "scenario", "q": "An app homepage uses HTTPS, but the session cookie is issued before login over HTTP (on port 80). Why is this dangerous?", "o": ["No risk — HTTPS is used for login", "The token can be intercepted during the initial HTTP request before encryption starts; also, if the Secure flag is missing, the cookie is sent over HTTP connections too", "HTTP is faster than HTTPS", "The cookie is encrypted by default"], "a": 1, "e": "Test: check if server listens on port 80, visit HTTP URLs within an authenticated session, verify if the token is still valid (server should terminate it immediately)."}, {"t": "W09. Session Management", "tp": "scenario", "q": "You log into an app twice with the same account. Both sessions remain active simultaneously. What's the security concern?", "o": ["No concern — this is convenient", "If multiple concurrent tokens are allowed, the system cannot detect when credentials have been leaked — a stolen token stays valid alongside the legitimate one", "It means the app uses load balancing", "Both sessions share the same token"], "a": 1, "e": "Proper design: only one active session per user. A new login should invalidate previous tokens, making stolen tokens detectable."}, {"t": "W09. Session Management", "tp": "theory", "q": "In a CSRF attack, the attacker makes a crafted request to an application from a site they control. Why does this work?", "o": ["The attacker knows the session token", "The victim's browser automatically submits the current session cookie with cross-site requests, so the app can't distinguish attacker-crafted requests from legitimate ones", "The attacker has admin access", "CSRF only works on HTTP, not HTTPS"], "a": 1, "e": "CSRF exploits the browser's automatic cookie submission. Mitigate with: SameSite cookie attribute, anti-CSRF tokens, and checking the Origin header."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "A user exploits a flaw in an online checkout to skip the payment step and proceed directly to the download page. What category of access control attack is this?", "o": ["Vertical privilege escalation", "Horizontal privilege escalation", "Business logic exploitation — exploiting a flaw in the application's state machine to gain access to resources without completing required steps", "Parameter-based access control bypass"], "a": 2, "e": "Business logic exploitation is the third category alongside vertical and horizontal escalation. The user didn't elevate privileges or access others' data — they bypassed a workflow step."}, {"t": "W10. Access Controls", "tp": "theory", "q": "Why should resource identifiers use random UUIDs instead of sequential integers?", "o": ["UUIDs are shorter", "Sequential IDs are predictable — an attacker who sees docid=1001 can try 1002, 1003, etc. Random UUIDs cannot be guessed.", "UUIDs are faster to query", "Sequential IDs cause SQL injection"], "a": 1, "e": "Even with proper access control, predictable IDs make enumeration easy. Random UUIDs add an additional layer of defense (defense in depth). Application logs also store identifiers."}, {"t": "W10. Access Controls", "tp": "multi", "q": "According to the access control lessons learned, which assumptions should you NEVER make?", "o": ["Users won't know application URLs or resource identifiers", "User-submitted parameters (e.g., admin=true) can be trusted for access rights", "Users will access pages in the intended sequence", "Users won't tamper with data transmitted via the client"], "m": [0, 1, 2, 3], "e": "All four are dangerous assumptions. The lessons learned explicitly state: don't rely on ignorance, don't trust client parameters, don't assume sequence, don't trust client data."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "You submit <code>O'Reilly</code> as a last name in a search field. The application returns a database error. What does this indicate?", "o": ["The name is too long", "The single quote broke the SQL syntax, indicating the input is likely being concatenated directly into a SQL query — a potential SQL injection point", "The database doesn't support apostrophes", "The application is working correctly"], "a": 1, "e": "This is the 'Probe → Observe → Hypothesise' step. The query became: WHERE lname='O'Reilly' — the DB sees 'O' as the name and Reilly' as invalid syntax."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "While probing for SQLi with a single quote, you notice a JavaScript error in the returned page. What additional vulnerability does this suggest?", "o": ["SQL injection only", "The unsanitized single quote was injected into JavaScript in the response — this means cross-site scripting (XSS) attacks may also be possible", "Buffer overflow", "CSRF"], "a": 1, "e": "User input often appears in JavaScript on the page. An unsanitized quote breaks the JS interpreter → you can inject arbitrary JavaScript (reflected XSS)."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "To verify numeric SQLi without using quotes (in case they're filtered), which expression equals 2?", "o": ["67-ASCII('A') — but this uses quotes", "51-ASCII(1) — databases implicitly cast numeric 1 to string '1' (ASCII 49), so 51-49=2", "2+0 — trivially equivalent", "ASCII(2)"], "a": 1, "e": "When quotes are filtered, exploit implicit type casting: ASCII(1) treats 1 as the character '1' (ASCII 49). So 51-49=2."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "The MOVEit file transfer breach (2023) was caused by:", "o": ["Weak authentication", "SQL injection — an unauthenticated attacker gained access to the database and could infer structure, read content, and modify/delete data", "Misconfigured firewall", "Insider threat"], "a": 1, "e": "CVE-2023-34362: SQLi in MOVEit Transfer. Led to mass data theft across thousands of organizations. Mistakes in input handling → severe financial consequences."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "To extract the database version via UNION injection, which payload would you use?", "o": ["' UNION SELECT @@version, NULL, NULL --", "' UNION SELECT version, NULL, NULL --", "' UNION SELECT DB_VERSION(), NULL, NULL --", "' OR @@version --"], "a": 0, "e": "@@version is a system variable in MySQL and MSSQL. First determine column count with NULL ladder, find a text column, then place @@version in that column."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "A filter blocks whitespace characters. How can an attacker still construct valid SQL?", "o": ["Impossible without spaces", "Use inline SQL comments /**/ to simulate whitespace: <code>SELECT/**/username,password/**/FROM/**/users</code>", "Use tab characters only", "Give up and try XSS"], "a": 1, "e": "Inline comments /**/ are treated as whitespace by the SQL parser. Also: some databases accept alternative whitespace (tabs, newlines, %09, %0a)."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "Attacking a web application without the owner's explicit permission is:", "o": ["Acceptable for educational purposes", "Legal if you find vulnerabilities", "Illegal — only test systems you own or have written permission to test", "Allowed during business hours"], "a": 2, "e": "This is explicitly stated in the course slides with a WARNING. Unauthorized testing is a criminal offense in most jurisdictions."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "OWASP's position on SQL injection defense is that the default defensive control should be:", "o": ["Input validation via blacklists", "Character escaping", "Parameterization — most modern frameworks enforce parameterized queries by default", "Stored procedures only"], "a": 2, "e": "Parameterized queries are the primary defense. Stored procedures are secondary but NOT safe if they concatenate input. Never build SQL with user strings."}, {"t": "W08. Authentication", "tp": "mcq", "q": "Which row correctly compares Kerberos and SSL certificate authentication?", "o": ["Kerberos: public/private keys, used for public internet. SSL: symmetric keys, used internally.", "Kerberos: symmetric keys managed by KDC, used for internal/enterprise SSO. SSL: public/private keys via CA, more universally supported for public internet.", "Kerberos: no mutual authentication. SSL: mutual authentication only.", "Kerberos: less complex. SSL: more complex."], "a": 1, "e": "Kerberos = symmetric crypto + KDC + internal networks + complex configuration. SSL certs = PKI + CA + public internet + more universally supported. Both support mutual auth and SSO."}, {"t": "W08. Authentication", "tp": "theory", "q": "In third-party authentication (OAuth 2.0), the application never receives the user's password. How does authentication work instead?", "o": ["The password is encrypted and forwarded", "The third-party provider issues secure tokens to authenticate users — the application only receives tokens, never passwords directly", "The password is hashed and sent via URL", "The user creates a new password for each application"], "a": 1, "e": "Token-based authentication: user authenticates with the provider (Google, Facebook), who issues a token to the application. This reduces risk from custom auth vulnerabilities but creates provider dependency and privacy implications."}, {"t": "W08. Authentication", "tp": "mcq", "q": "What is <code>haveibeenpwned.com</code> useful for in the context of authentication security?", "o": ["It is a password manager", "It checks whether your credentials have appeared in known data breaches — useful for discovering compromised logins and sites that have been breached", "It generates strong passwords", "It provides MFA tokens"], "a": 1, "e": "haveibeenpwned.com lets users check if their email or password has appeared in known breaches. It's referenced in the slides as a resource for discovering compromised credentials."}, {"t": "W08. Authentication", "tp": "scenario", "q": "You discover that a password change page is accessible without being logged in first. What attacks does this enable?", "o": ["No risk — users need to enter their old password anyway", "The page may reveal verbose error messages about usernames, allow unrestricted guesses on the old password field, or serve as an enumeration vector — it may be more vulnerable than the login page itself", "Only brute-force on the new password", "Only CSRF attacks"], "a": 1, "e": "Password change pages accessible without auth are often MORE vulnerable than login because they provide verbose errors about usernames, allow unlimited old-password guesses, and check new/confirm fields only after validating the old password."}, {"t": "W08. Authentication", "tp": "mcq", "q": "What is NOT a recommended practice for secure authentication?", "o": ["Salting password hashes", "Implementing multifactor authentication", "Storing passwords in cleartext", "Using HTTPS for credential transmission"], "a": 2, "e": "Cleartext passwords = immediate account compromise if the database is breached. Passwords must be hashed (one-way), never encrypted (reversible) or stored in cleartext."}, {"t": "W08. Authentication", "tp": "theory", "q": "The slides recommend using slow hashes + unique salt + optional ____. What is this third layer?", "o": ["Nonce", "Pepper — a secret value added to passwords before hashing, stored separately from the database (e.g., in application config)", "IV", "HMAC key"], "a": 1, "e": "Salt (unique per password, stored in DB) defeats rainbow tables. Pepper (application-level secret, stored outside DB) adds a layer so that even a full DB dump isn't enough to crack hashes."}, {"t": "W08. Authentication", "tp": "scenario", "q": "In the 23andMe credential stuffing incident (2023), compromised accounts exposed data via social features (DNA relatives / family tree). Why did a 'sharing' feature amplify the impact of weak authentication?", "o": ["Sharing features are always insecure", "Because one compromised account could access data that OTHER users had opted into sharing — the attacker gained data far beyond the breached account itself", "The sharing feature disabled MFA", "DNA data cannot be protected"], "a": 1, "e": "Opt-in sharing features create transitive exposure: breaching account A gives access to data shared by accounts B, C, D who are A's connections. Rate limiting + breached-password checks + MFA reduce credential stuffing risk."}, {"t": "W09. Session Management", "tp": "scenario", "q": "An application at <code>/apps/secure/index.jsp</code> sets a cookie with <code>path=/apps/</code> instead of the default <code>/apps/secure/</code>. What is the risk?", "o": ["No risk — broader path is more convenient", "The cookie is now sent to ALL paths under /apps/, including potentially less-secure areas like /apps/public/ — if any of those paths have vulnerabilities, the session token can be stolen", "The cookie becomes HttpOnly", "The path setting is ignored by browsers"], "a": 1, "e": "Liberal cookie path scope: by default, cookies are only sent to the issuing directory and subdirectories. Setting path=/apps/ broadens this to include sibling directories that may be less protected."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A login form accepts any password as long as the username exists in the database. Is this incomplete validation or a validation quirk?", "o": ["Validation quirk — the password check is case-insensitive", "Incomplete validation — the application fails to verify the password entirely, meaning the check is missing, not just wrong", "Neither — this is a configuration error", "Both"], "a": 1, "e": "This is incomplete validation: a required check (password verification) is completely absent. Compare with a quirk like case-insensitive comparison, where the check exists but is implemented incorrectly."}, {"t": "W08. Authentication", "tp": "scenario", "q": "During a security audit, you discover the database stores passwords in a reversible encrypted format rather than hashing them. Why is this a problem even though the passwords aren't in cleartext?", "o": ["No problem — encryption is sufficient", "Anyone with the encryption key can decrypt ALL passwords at once. Passwords should be hashed (one-way) so that even with full system access, original passwords cannot be recovered.", "Encryption is stronger than hashing", "Only the admin has the key so it's safe"], "a": 1, "e": "Encryption is reversible — compromise the key and every password is exposed. Hashing is one-way: even the system can't recover the original, only verify by re-hashing. This is why the slides emphasize hashing ≠ encryption."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "You only have one low-privilege user account to test access controls. What techniques can you use to find and test for access control flaws?", "o": ["You can't test access controls without an admin account", "Add parameters like admin=true to URLs and POST bodies; test if the Referer header controls access; review all client-side HTML and JavaScript for hidden functionality; discover resource identifiers and test for predictable sequences", "Only test the login page", "Only check for SQL injection"], "a": 1, "e": "With limited access: (1) add access-level parameters to requests, (2) test Referer-based controls by modifying/removing the header, (3) review client-side code for hidden URLs, (4) enumerate resource identifiers and test predictability, (5) mount automated harvesting if IDs are predictable and access controls are broken."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A company's password reset lets users specify their own security questions during registration. An attacker enumerates valid usernames and collects their security questions. What is the risk?", "o": ["No risk — custom questions are more secure", "User-chosen questions are often easily guessable (e.g., 'What is my favourite colour?'). The attacker focuses on accounts with weak questions and brute-forces or guesses the answers to reset those passwords.", "Custom questions prevent enumeration", "The questions are encrypted"], "a": 1, "e": "User-set security questions tend to be weak or personal knowledge that's publicly available (social media). Harvest questions from enumerated accounts → focus on guessable ones → reset passwords. Prefer system-defined questions or better yet, email-based token recovery."}];
function sh(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
const T=[...new Set(Q.map(x=>x.t))];
let S={s:'home',sl:new Set(T),qs:[],ci:0,an:[],ms:new Set()};
function isM(q){return Array.isArray(q.m)}
function gQ(){return sh(Q.filter(x=>S.sl.has(x.t)))}
function cor(q,ans){if(isM(q)){if(!Array.isArray(ans))return false;const s=new Set(ans),c=new Set(q.m);if(s.size!==c.size)return false;for(const v of s)if(!c.has(v))return false;return true}return ans===q.a}
function r(){document.getElementById('app').innerHTML='';({home:rH,quiz:rQ,results:rR})[S.s](document.getElementById('app'))}
function rH(el){
const al=S.sl.size===T.length,cn=Q.filter(x=>S.sl.has(x.t)).length;
el.innerHTML=`<div class="hd"><h1>ICT2214 Web Security</h1><p>Interactive quiz revision \u00b7 <span class="mn">${Q.length} questions</span></p></div>
<div class="cl"><button class="sa" onclick="tA()">${al?'Deselect All':'Select All'}</button><span class="qn">${cn} questions selected</span></div>
<div class="tg">${T.map(t=>`<div class="tc ${S.sl.has(t)?'sl':''}" onclick="tT('${t}')"><span class="tn">${t.split('.')[0].trim()}</span><h3>${t.split('. ')[1]}</h3><span>${Q.filter(x=>x.t===t).length} questions</span></div>`).join('')}</div>
<div class="bg_"><button class="bt bp" onclick="go()" ${!S.sl.size?'disabled':''}>Start Quiz \u2192</button></div>`}
function rQ(el){
const q=S.qs[S.ci],n=S.qs.length,p=S.ci/n*100,d=S.an[S.ci]!=null,multi=isM(q),u=S.an[S.ci];
const uSet=multi&&Array.isArray(u)?new Set(u):new Set();
const cSet=multi?new Set(q.m):new Set([q.a]);
const tags={multi:'<span class="ms-tag">MULTI-SELECT</span>',scenario:'<span class="sc-tag">SCENARIO</span>',theory:'<span class="th-tag">THEORY</span>',mcq:''};
el.innerHTML=`<div class="qh"><span class="qt">${q.t}</span><span class="qp">${S.ci+1} / ${n}</span></div>
<div class="pb"><div class="pf" style="width:${p}%"></div></div>
<div class="qc"><h2>${q.q}${tags[q.tp]||''}</h2><div class="os">${q.o.map((o,i)=>{
let c='op';
if(d){c+=' ds';if(cSet.has(i))c+=' ok';else if(multi?uSet.has(i):u===i)c+=' no';else c+=' dm'}
else if(multi&&S.ms.has(i))c+=' sel';
return`<div class="${c}" onclick="${multi?(d?'':`mt(${i})`):(`pk(${i})`)}">
${multi?`<span class="cb">${d?(cSet.has(i)?'\u2713':(uSet.has(i)?'\u2717':'')):(S.ms.has(i)?'\u2713':'')}</span>`:`<span class="ol">${'ABCD'[i]}</span>`}
<span>${o}</span></div>`}).join('')}
${multi&&!d?`<button class="sub-btn" onclick="sm()" ${S.ms.size===0?'disabled':''}>Submit Answer</button>`:''}
</div>
${d?`<div class="ex"><strong>${cor(q,u)?'\u2713 Correct':'\u2717 Incorrect'}</strong> \u2014 ${q.e}</div>`:''}</div>
<div class="bg_">${d?(S.ci<n-1?`<button class="bt bp" onclick="nx()">Next \u2192</button>`:`<button class="bt bp" onclick="rs()">Results \u2192</button>`):''}
<button class="bt bs" onclick="rt()">\u27f2 Restart</button></div>`}
function rR(el){
const n=S.qs.length,c=S.an.filter((a,i)=>cor(S.qs[i],a)).length,p=Math.round(c/n*100),ci=2*Math.PI*76,of_=ci-p/100*ci;
let gc,gl;if(p>=85){gc='a';gl='Excellent'}else if(p>=70){gc='b';gl='Good'}else if(p>=50){gc='c';gl='Needs Work'}else{gc='f';gl='Review the Material'}
const bd={};S.qs.forEach((q,i)=>{if(!bd[q.t])bd[q.t]={c:0,t:0};bd[q.t].t++;if(cor(q,S.an[i]))bd[q.t].c++});
el.innerHTML=`<div class="rs"><div class="hd"><h1>Quiz Complete</h1></div>
<div class="sr"><svg viewBox="0 0 160 160"><circle class="bg2" cx="80" cy="80" r="76"/><circle class="fg" cx="80" cy="80" r="76" stroke-dasharray="${ci}" stroke-dashoffset="${of_}"/></svg>
<div class="st"><div class="nm">${p}%</div><div class="lb">${c} / ${n}</div></div></div>
<h2>${gl}</h2><div class="gd ${gc}">${p}%</div>
<div class="tb_"><h3>Topic Breakdown</h3>${Object.entries(bd).map(([t,d])=>{const tp=Math.round(d.c/d.t*100),cl=tp>=80?'var(--ok)':tp>=50?'var(--ac)':'var(--no)';
return`<div class="br"><span>${t}</span><span style="color:${cl}">${d.c}/${d.t} (${tp}%)</span></div>`}).join('')}</div>
<div class="bg_"><button class="bt bp" onclick="rt()">\u27f2 Try Again</button><button class="bt bs" onclick="hm()">\u2190 Topics</button></div></div>`}
function tT(t){S.sl.has(t)?S.sl.delete(t):S.sl.add(t);r()}
function tA(){S.sl=S.sl.size===T.length?new Set():new Set(T);r()}
function go(){S.qs=gQ();S.ci=0;S.an=[];S.ms=new Set();S.s='quiz';r();scrollTo(0,0)}
function pk(i){if(S.an[S.ci]!=null)return;S.an[S.ci]=i;r()}
function mt(i){if(S.an[S.ci]!=null)return;S.ms.has(i)?S.ms.delete(i):S.ms.add(i);r()}
function sm(){if(S.an[S.ci]!=null||S.ms.size===0)return;S.an[S.ci]=[...S.ms];S.ms=new Set();r()}
function nx(){S.ci++;S.ms=new Set();r();scrollTo(0,0)}
function rs(){S.s='results';r();scrollTo(0,0)}
function rt(){S.qs=gQ();S.ci=0;S.an=[];S.ms=new Set();S.s='quiz';r();scrollTo(0,0)}
function hm(){S.s='home';S.ms=new Set();r();scrollTo(0,0)}
r();
</script>
