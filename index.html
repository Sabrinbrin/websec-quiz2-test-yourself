e SQL syntax — next: submit O''Reilly to check if the error disappears, confirming SQL injection"], "a": 3, "e": "This is the Probe → Observe → Hypothesise step. Query became: WHERE lname='O'Reilly' — DB sees 'O' as name, Reilly' is invalid syntax."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "While probing with a single quote, you notice a JavaScript error in the returned page instead of a database error. What additional vulnerability does this suggest?", "o": ["The JavaScript error indicates the application uses a NoSQL database that processes queries through a JavaScript runtime", "The JavaScript error confirms SQL injection because the database passes its error messages through the JavaScript engine", "Client-side JavaScript errors are unrelated to server-side SQL injection and can be safely ignored during testing", "The unsanitized quote was injected into JavaScript in the response — cross-site scripting (XSS) attacks may also be possible"], "a": 3, "e": "User input often appears in JavaScript on the page. An unsanitized quote breaks the JS interpreter → reflected XSS potential."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "To verify numeric SQL injection when quotes are filtered, which expression equals 2 without using any quote characters?", "o": ["CHAR(50) — this returns the character '2' as a string, not the integer 2, so numeric comparison would fail", "67-ASCII('A') — this uses quotes around the character A, so it would be blocked by the filter and fail", "2+0 — this is trivially equivalent and doesn't prove SQL evaluation because any numeric parser would return the same result", "51-ASCII(1) — databases implicitly cast the integer 1 to string '1' (ASCII 49), so 51-49=2 with no quotes needed"], "a": 3, "e": "Implicit type casting: ASCII(1) treats 1 as character '1' (ASCII 49). 51-49=2. Works even when quotes are filtered."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "The MOVEit file transfer breach (2023) was caused by:", "o": ["An insider threat where a disgruntled employee exported customer files using their legitimate elevated access privileges", "A misconfigured firewall that exposed internal file storage directly to the internet without any application-layer protection", "SQL injection in the web application that let unauthenticated attackers access the database to read, modify, and delete data", "A zero-day authentication bypass in the admin panel that allowed unauthenticated attackers to create admin accounts"], "a": 2, "e": "CVE-2023-34362: SQLi in MOVEit Transfer. Led to mass data theft across thousands of organizations. Production input handling mistakes → severe consequences."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "What is the most common injection point within SQL query STRUCTURE (not data values)?", "o": ["The FROM clause, where attackers inject additional table names using CROSS JOIN to access data from unrelated tables", "The WHERE clause, where attackers inject conditions that alter which rows are returned by the original query logic", "The SELECT clause, where attackers inject additional column names to extract data from other tables in the same query", "The ORDER BY clause — users often control sorting, and no quote escaping is needed since the input isn't in a data context"], "a": 3, "e": "Detect by: supplying numeric values (1,2,3...) — if ordering changes, it's ORDER BY. If number > column count → error. Confirm: 1 ASC -- vs 1 DESC --."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "For a UNION-based SQL injection to succeed, what must be true about the injected query?", "o": ["The injected query can have any number of columns as long as at least one column contains the data the attacker wants", "The UNION operator only works with MySQL databases; other DBMSs require UNION ALL for cross-query result merging", "The attacker must know the database administrator password to execute UNION queries against system catalog tables", "Both SELECT statements must have the same number of columns, compatible data types, in the same order"], "a": 3, "e": "This is why attackers first determine column count (NULL ladder) and find text-compatible columns before extracting data."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "What does the 'NULL ladder' technique accomplish in a UNION injection attack?", "o": ["It fills the target table with NULL values, effectively wiping the data to cover the attacker's tracks after extraction", "It creates NULL-valued entries in the session table, forcing all existing users to re-authenticate and exposing their tokens", "It sets all WHERE clause conditions to NULL, bypassing authentication by making every comparison evaluate to true", "It progressively adds NULL columns to a UNION SELECT until the query succeeds, revealing the original query's column count"], "a": 3, "e": "NULL converts to any data type. Add NULLs incrementally until the query works → that count matches the original. Then replace each NULL with 'a' to find string columns."}, {"t": "W11. SQL Injection", "tp": "scenario", "q": "Vulnerable search returns 3 columns (first 2 are text). You want to enumerate the entire database schema. What payload extracts all table and column names?", "o": ["' OR 1=1 -- which returns all rows from the current table, indirectly revealing the schema through column headers", "' DROP TABLE information_schema -- which removes the metadata table, forcing the database to rebuild it with verbose error output", "' UNION SELECT table_name, column_name, NULL FROM information_schema.columns -- which queries the metadata catalog", "' UNION SELECT @@version, NULL, NULL -- which extracts the database version string containing embedded schema metadata"], "a": 2, "e": "information_schema.columns has all table/column metadata. @@version only gets the DB version — useful but not schema enumeration."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "When extracting multiple columns through a single text column, the Oracle concatenation syntax is:", "o": ["username+':'+password — the MS-SQL string addition operator that implicitly casts non-string types before joining", "username ' ' password — MySQL's implicit concatenation using space-separated string literals within the SELECT clause", "username||':'||password — Oracle's pipe operator concatenates strings, combining multiple values into one result field", "CONCAT(username,':',password) — the standard MySQL function that takes multiple arguments separated by commas"], "a": 2, "e": "Oracle: ||, MS-SQL: +, MySQL: CONCAT(). Concatenation reduces the number of text columns needed to extract data."}, {"t": "W11. SQL Injection", "tp": "theory", "q": "To submit the payload <code>1+1</code> as a numeric injection test in a URL, it must be encoded as:", "o": ["1%2b1 — the literal plus sign must be encoded because + represents a space character in URL query string encoding", "1&1 — the ampersand is the standard SQL addition operator when used within URL query string parameter values", "1%201 — spaces are the correct separator for numeric expressions in URL-encoded SQL injection payloads", "1+1 — no encoding is needed because the browser automatically preserves the plus symbol in URL query parameters"], "a": 0, "e": "+ means space in URL encoding. Literal + must be %2b. Also: & → %26, = → %3d, ; → %3b."}, {"t": "W11. SQL Injection", "tp": "mcq", "q": "To extract the database version via a UNION injection with 3 columns (first is text), which payload works?", "o": ["' OR @@version -- which appends the version as a boolean condition in the WHERE clause of the original query", "' UNION SELECT version, NULL, NULL -- which references the version column in the currently selected table", "' UNION SELECT @@version, NULL, NULL -- which places the version string in the first text-compatible column", "' UNION SELECT DB_VERSION(), NULL, NULL -- which calls the standard SQL function for retrieving server metadata"], "a": 2, "e": "@@version is a system variable in MySQL/MSSQL. First determine column count with NULL ladder, find a text column, then extract."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "What is second-order SQL injection and why does escaping input at insertion time fail to prevent it?", "o": ["It targets the second database in a multi-database architecture where cross-database queries bypass the primary server's input filters", "Data is safely escaped during INSERT, but when later retrieved and used in a new query without parameterization, the stored payload triggers injection", "It requires two separate attackers coordinating their payloads to trigger a race condition in the database transaction processor", "It's the same as regular SQL injection but requires two separate injection points in the same HTTP request"], "a": 1, "e": "The DB stores actual characters (including quotes). The second query trusts 'data from our own database'. Fix: parameterize everywhere, not just the initial input."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "An application only returns numeric employee IDs. SQL injection is confirmed. How can you extract the admin password?", "o": ["String extraction is impossible through a numeric-only output channel — switch to a different attack vector entirely", "Use ASCII() and SUBSTRING() to convert each password character to its numeric ASCII value, extracting one character per query", "Use a UNION query with text columns — the application will display the password string in the numeric output field", "Use time-based delays to encode the entire password as a variable-length pause, measuring milliseconds per character"], "a": 1, "e": "E.g., ' UNION SELECT ASCII(SUBSTRING(password,1,1)),NULL,NULL FROM users WHERE username='admin' # returns 113='q'. Repeat per position."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "What is blind SQL injection using conditional responses?", "o": ["The attacker infers data by observing different application behavior (e.g., login success vs failure) when injecting true vs false conditions", "An injection technique where the attacker cannot see the database but can access the application's source code to deduce the schema", "An attack where the database intentionally returns no results to any injected query as a security measure against data exfiltration", "A technique that works only against applications with no visual output, requiring the attacker to intercept raw network packets"], "a": 0, "e": "E.g., admin' AND ASCII(SUBSTRING(password,1,1))=113 # — login succeeds means first char is ASCII 113='q'. Slow but effective."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "To check if username 'alice' exists via conditional errors: <code>SELECT 1/0 FROM dual WHERE (SELECT username FROM users WHERE username='alice')='alice'</code>. Database returns an error. Meaning?", "o": ["Alice IS a valid username — the WHERE matched, 1/0 was evaluated, and division-by-zero caused the error", "The users table doesn't exist in the database, so the subquery failed and triggered a table-not-found error", "The query syntax is invalid because the dual table doesn't support subqueries in the WHERE clause on this DBMS", "Alice does NOT exist — the database always evaluates the SELECT clause before checking the WHERE condition"], "a": 0, "e": "If alice doesn't exist, WHERE returns no rows, 1/0 is never evaluated → no error. Error = alice exists. dual is a dummy table in most DBMSs."}, {"t": "W12. SQLi Advanced", "tp": "mcq", "q": "When blind SQL injection shows no behavioral difference for true vs false conditions, what technique extracts data?", "o": ["Switch to cross-site scripting to extract data through the browser's developer console instead of the server's response", "The attack is impossible — without any observable difference, no information can be extracted from the database", "Directly modify the application's server-side source code to add debugging output that reveals query results", "Time-based blind injection — inject conditional delays (BENCHMARK, SLEEP) that cause measurable timing differences in server responses"], "a": 3, "e": "BENCHMARK(5000000,SHA1('x')) causes delay when condition is true. Slow response = true, fast = false. Extracts one bit at a time."}, {"t": "W12. SQLi Advanced", "tp": "multi", "q": "Which techniques bypass naïve keyword-blocking SQL injection filters?", "o": ["Double-word nesting like SELSELECTECT — the filter removes the inner SELECT, leaving a valid SELECT keyword behind", "Using parameterized queries with bound variables to separate the SQL structure from user-supplied data values", "URL encoding keywords like %53%45%4c%45%43%54 which decode to SELECT after passing through filters that run before decoding", "Case variations like SeLeCt which are treated as valid SQL keywords by the database but missed by case-sensitive filters"], "m": [0, 2, 3], "e": "Also: %00SELECT (null byte), inline comments SELECT/**/username. Parameterized queries are a defense, not a bypass technique."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "A filter blocks the comment characters <code>--</code> and <code>#</code>. How can an attacker handle the trailing quote?", "o": ["URL-double-encode the comment as %252d%252d so the application decodes it to -- after the filter has already been applied", "Balance the quotes naturally using a tautology like ' OR 'a'='a so the original query's trailing quote completes the expression", "The attack is impossible without comment characters because there is no way to neutralize the trailing single quote", "Use the CHAR(45)+CHAR(45) function to construct the -- comment dynamically, bypassing the character-level filter"], "a": 1, "e": "Balancing quotes: lname='John' OR 'a'='a' closes naturally. Also: CHAR() function for blocked chars, inline comments /**/ for whitespace."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "A filter blocks all whitespace characters in SQL input. How can valid SQL still be constructed?", "o": ["Use CONCAT() to build the entire query as a single concatenated string with no whitespace between any SQL keywords", "Use inline comments /**/ as whitespace substitutes: <code>SELECT/**/username,password/**/FROM/**/users</code>", "SQL requires whitespace between keywords and cannot function without at least single space characters separating clauses", "Replace spaces with tab characters, since most filters only block the ASCII space (0x20) but not horizontal tab (0x09)"], "a": 1, "e": "SQL comments /**/ are treated as whitespace by the parser. Some DBs also accept alternative whitespace: tabs, newlines, %09, %0a."}, {"t": "W12. SQLi Advanced", "tp": "multi", "q": "Which are the two effective methods for preventing SQL injection?", "o": ["Stored procedures with properly typed parameters where user input fills values but cannot change the SQL syntax or structure", "Input validation using blacklists that block known dangerous characters like quotes, semicolons, and comment symbols", "Parameterized queries (prepared statements) where the database receives the query template and user values as separate data", "Escaping all single quotes by doubling them ('') in user input before concatenating into dynamically built SQL strings"], "m": [0, 2], "e": "Blacklists and escaping are bypassable (second-order injection, encoding tricks). Stored procs NOT safe if they internally concatenate input. Parameterization is the primary defense."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "A developer escapes all quotes. User registers as <code>admin'--</code>. The escaped INSERT works. Later, the password change function reads this username and uses it in a new query. What happens?", "o": ["Only a harmless syntax error occurs in the password change query — the application catches the exception and displays a generic error", "Second-order SQL injection — the DB stores literal admin'--, which breaks the password change query when concatenated without parameterization", "The database rejects the stored username when it's retrieved because the quote character violates column validation constraints", "Nothing — the escape (admin''--) persists in the database, so the retrieved value is still safely escaped for any subsequent query"], "a": 1, "e": "INSERT: admin''-- → DB stores admin'--. Password change: WHERE username='admin'-- → quote breaks out, -- comments rest. Fix: parameterize everywhere."}, {"t": "W12. SQLi Advanced", "tp": "scenario", "q": "You submit <code>O'Reilly</code> and get a DB error. You submit <code>O''Reilly</code> and the error disappears. What do you conclude?", "o": ["Likely SQL injection — the single quote broke SQL syntax, and '' was interpreted as an escape sequence, confirming the input reaches SQL", "The double apostrophe created a syntax error that the database silently ignored, masking the underlying vulnerability from detection", "The application has a strict input validation filter that rejects single apostrophes but accepts escaped double apostrophes", "The application correctly sanitized the input by replacing dangerous characters, indicating it is NOT vulnerable to injection"], "a": 0, "e": "'' is the SQL escape for a literal single quote. Next: verify with DB-specific concatenation operators to confirm SQL evaluation."}, {"t": "W12. SQLi Advanced", "tp": "mcq", "q": "What is the most widely-used automated SQL exploitation tool?", "o": ["Metasploit — while known for general exploitation, its auxiliary modules are the primary choice for automated SQL injection campaigns", "sqlmap — it brute-forces parameters, tries UNION/boolean/time-based techniques automatically, and supports all major DBMSs", "Nmap — primarily a network scanner, but its NSE scripts include comprehensive SQL injection testing and exploitation modules", "Wireshark — its deep packet inspection can detect SQL injection payloads in real-time traffic and extract the resulting database responses"], "a": 1, "e": "sqlmap options: --forms (HTML forms), --banner (DBMS version), --dbs (databases), --tables, --dump (data), --os-shell. Steps: brute params → UNION → boolean → time."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "Why do stored procedures NOT automatically guarantee protection against SQL injection?", "o": ["Stored procedures are always safe because they are compiled and executed inside the database server by definition", "Stored procedures are deprecated by OWASP and should not be used for any security-critical database operations", "Stored procedures only protect against injection when used with Oracle databases; other DBMSs lack the necessary security features", "If a stored procedure internally builds dynamic SQL by concatenating user input, it remains just as vulnerable to injection"], "a": 3, "e": "Stored procs prevent SQLi ONLY if they use parameterized inputs internally. Never build SQL with user strings inside procedures. Most modern frameworks enforce parameterization by default."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "Attacking a web application or server without authorization is:", "o": ["Legal if you discover and responsibly disclose vulnerabilities to the application owner through a bug bounty program", "Acceptable when performed for educational purposes or academic research on publicly accessible internet-facing applications", "Illegal — only test systems you own or have explicit written permission to test, regardless of your intentions or methodology", "Permitted during business hours when using automated scanning tools that do not attempt to exploit any discovered vulnerabilities"], "a": 2, "e": "Explicitly stated in the course: unauthorized testing is a criminal offense in most jurisdictions."}, {"t": "W12. SQLi Advanced", "tp": "theory", "q": "According to OWASP, what should be the default defensive control against SQL injection?", "o": ["Character escaping applied to all user inputs before they are incorporated into any dynamically constructed SQL strings", "Parameterization — most modern frameworks enforce parameterized queries by default, treating user input strictly as data", "Stored procedures exclusively, with no parameterized queries allowed at the application layer to prevent confusion", "Comprehensive input validation using whitelists of allowed characters for each field type in the application"], "a": 1, "e": "OWASP supports parameterization as the default. Stored procs are secondary. Never build SQL with user strings. ~2/3 to 4/5 of web DBs now use parameterized queries."}, {"t": "W10. Access Controls", "tp": "scenario", "q": "You only have one low-privilege user account. What techniques test for access control flaws?", "o": ["Only test the login page for brute-force vulnerabilities, since access control testing without admin access is unreliable", "Scan for SQL injection vulnerabilities first, since a successful injection automatically bypasses all access control mechanisms", "Add parameters like admin=true to URLs/POST bodies; test Referer-based controls; review client-side HTML/JS for hidden URLs; test identifier predictability", "Access control testing requires at least two accounts with different privilege levels — report the limitation and skip this test"], "a": 2, "e": "With limited access: add access params, test/remove Referer, review client code, enumerate identifiers, test for predictable sequences, automate harvesting if broken."}];
function sh(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
const T=[...new Set(Q.map(x=>x.t))];
let S={s:'home',sl:new Set(T),qs:[],ci:0,an:[],ms:new Set()};
function isM(q){return Array.isArray(q.m)}
function gQ(){return sh(Q.filter(x=>S.sl.has(x.t)))}
function cor(q,ans){if(isM(q)){if(!Array.isArray(ans))return false;const s=new Set(ans),c=new Set(q.m);if(s.size!==c.size)return false;for(const v of s)if(!c.has(v))return false;return true}return ans===q.a}
function r(){document.getElementById('app').innerHTML='';({home:rH,quiz:rQ,results:rR})[S.s](document.getElementById('app'))}
function rH(el){
const al=S.sl.size===T.length,cn=Q.filter(x=>S.sl.has(x.t)).length;
el.innerHTML=`<div class="hd"><h1>ICT2214 Web Security</h1><p>Interactive quiz revision \u00b7 <span class="mn">${Q.length} questions</span></p></div>
<div class="cl"><button class="sa" onclick="tA()">${al?'Deselect All':'Select All'}</button><span class="qn">${cn} questions selected</span></div>
<div class="tg">${T.map(t=>`<div class="tc ${S.sl.has(t)?'sl':''}" onclick="tT('${t}')"><span class="tn">${t.split('.')[0].trim()}</span><h3>${t.split('. ')[1]}</h3><span>${Q.filter(x=>x.t===t).length} questions</span></div>`).join('')}</div>
<div class="bg_"><button class="bt bp" onclick="go()" ${!S.sl.size?'disabled':''}>Start Quiz \u2192</button></div>`}
function rQ(el){
const q=S.qs[S.ci],n=S.qs.length,p=S.ci/n*100,d=S.an[S.ci]!=null,multi=isM(q),u=S.an[S.ci];
const uSet=multi&&Array.isArray(u)?new Set(u):new Set();
const cSet=multi?new Set(q.m):new Set([q.a]);
const tags={multi:'<span class="ms-tag">MULTI-SELECT</span>',scenario:'<span class="sc-tag">SCENARIO</span>',theory:'<span class="th-tag">THEORY</span>',mcq:''};
el.innerHTML=`<div class="qh"><span class="qt">${q.t}</span><span class="qp">${S.ci+1} / ${n}</span></div>
<div class="pb"><div class="pf" style="width:${p}%"></div></div>
<div class="qc"><h2>${q.q}${tags[q.tp]||''}</h2><div class="os">${q.o.map((o,i)=>{
let c='op';
if(d){c+=' ds';if(cSet.has(i))c+=' ok';else if(multi?uSet.has(i):u===i)c+=' no';else c+=' dm'}
else if(multi&&S.ms.has(i))c+=' sel';
return`<div class="${c}" onclick="${multi?(d?'':`mt(${i})`):(`pk(${i})`)}">
${multi?`<span class="cb">${d?(cSet.has(i)?'\u2713':(uSet.has(i)?'\u2717':'')):(S.ms.has(i)?'\u2713':'')}</span>`:`<span class="ol">${'ABCD'[i]}</span>`}
<span>${o}</span></div>`}).join('')}
${multi&&!d?`<button class="sub-btn" onclick="sm()" ${S.ms.size===0?'disabled':''}>Submit Answer</button>`:''}
</div>
${d?`<div class="ex"><strong>${cor(q,u)?'\u2713 Correct':'\u2717 Incorrect'}</strong> \u2014 ${q.e}</div>`:''}</div>
<div class="bg_">${d?(S.ci<n-1?`<button class="bt bp" onclick="nx()">Next \u2192</button>`:`<button class="bt bp" onclick="rs()">Results \u2192</button>`):''}
<button class="bt bs" onclick="rt()">\u27f2 Restart</button></div>`}
function rR(el){
const n=S.qs.length,c=S.an.filter((a,i)=>cor(S.qs[i],a)).length,p=Math.round(c/n*100),ci=2*Math.PI*76,of_=ci-p/100*ci;
let gc,gl;if(p>=85){gc='a';gl='Excellent'}else if(p>=70){gc='b';gl='Good'}else if(p>=50){gc='c';gl='Needs Work'}else{gc='f';gl='Review the Material'}
const bd={};S.qs.forEach((q,i)=>{if(!bd[q.t])bd[q.t]={c:0,t:0};bd[q.t].t++;if(cor(q,S.an[i]))bd[q.t].c++});
el.innerHTML=`<div class="rs"><div class="hd"><h1>Quiz Complete</h1></div>
<div class="sr"><svg viewBox="0 0 160 160"><circle class="bg2" cx="80" cy="80" r="76"/><circle class="fg" cx="80" cy="80" r="76" stroke-dasharray="${ci}" stroke-dashoffset="${of_}"/></svg>
<div class="st"><div class="nm">${p}%</div><div class="lb">${c} / ${n}</div></div></div>
<h2>${gl}</h2><div class="gd ${gc}">${p}%</div>
<div class="tb_"><h3>Topic Breakdown</h3>${Object.entries(bd).map(([t,d])=>{const tp=Math.round(d.c/d.t*100),cl=tp>=80?'var(--ok)':tp>=50?'var(--ac)':'var(--no)';
return`<div class="br"><span>${t}</span><span style="color:${cl}">${d.c}/${d.t} (${tp}%)</span></div>`}).join('')}</div>
<div class="bg_"><button class="bt bp" onclick="rt()">\u27f2 Try Again</button><button class="bt bs" onclick="hm()">\u2190 Topics</button></div></div>`}
function tT(t){S.sl.has(t)?S.sl.delete(t):S.sl.add(t);r()}
function tA(){S.sl=S.sl.size===T.length?new Set():new Set(T);r()}
function go(){S.qs=gQ();S.ci=0;S.an=[];S.ms=new Set();S.s='quiz';r();scrollTo(0,0)}
function pk(i){if(S.an[S.ci]!=null)return;S.an[S.ci]=i;r()}
function mt(i){if(S.an[S.ci]!=null)return;S.ms.has(i)?S.ms.delete(i):S.ms.add(i);r()}
function sm(){if(S.an[S.ci]!=null||S.ms.size===0)return;S.an[S.ci]=[...S.ms];S.ms=new Set();r()}
function nx(){S.ci++;S.ms=new Set();r();scrollTo(0,0)}
function rs(){S.s='results';r();scrollTo(0,0)}
function rt(){S.qs=gQ();S.ci=0;S.an=[];S.ms=new Set();S.s='quiz';r();scrollTo(0,0)}
function hm(){S.s='home';S.ms=new Set();r();scrollTo(0,0)}
r();
</script>
